<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気楽便 - 発送管理システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --text-dark: #1f2937;
      --text-gray: #6b7280;
      --border: #e5e7eb;
    }

    body {
      font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 24px;
    }

    /* ==================== ログイン画面 ==================== */
    .login-container {
      min-height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-panel {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .login-panel h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-panel .subtitle {
      font-size: 14px;
      color: var(--text-gray);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .login-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-btn {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn.member {
      background: var(--primary);
      color: white;
    }

    .login-btn.member:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .login-btn.admin {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 2px solid var(--border);
      margin-top: 20px;
      font-size: 14px;
    }

    .login-btn.admin:hover {
      background: var(--border);
      border-color: var(--text-gray);
    }

    .login-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .btn-icon {
      font-size: 18px;
    }

    .error-message {
      display: none;
      background: #fef3f2;
      color: #b42318;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      border-left: 4px solid #b42318;
      line-height: 1.6;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ==================== メイン画面 ==================== */
    .container {
      background: var(--bg-white);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
      padding: 36px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-app {
      display: none;
    }

    .main-app.show {
      display: block;
    }

    /* ヘッダー */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .user-badge {
      background: var(--primary);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .user-badge.admin {
      background: var(--secondary);
    }

    .logout-btn {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: var(--border);
    }

    /* ナビゲーション */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-gray);
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-size: 15px;
    }

    .nav-tab:hover {
      color: var(--primary);
    }

    .nav-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ページセクション */
    .page-section {
      display: none;
    }

    .page-section.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ダッシュボード */
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-white);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    /* カード */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      background: var(--bg-white);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 12px;
    }

    .card-content {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* フォーム */
    .form-section {
      background: var(--bg-white);
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .empty-state {
      color: var(--text-gray);
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .hidden {
      display: none !important;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .container,
      .login-panel {
        padding: 24px;
      }

      .app-header {
        flex-direction: column;
        align-items: stretch;
      }

      .logout-btn {
        width: 100%;
      }

      .nav-tabs {
        flex-wrap: wrap;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- ログイン画面 -->
  <section class="login-container" id="loginSection">
    <div class="login-panel">
      <div class="error-message" id="errorMessage"></div>

      <h1>🚚 お気楽便</h1>
      <p class="subtitle">カメラ発送代行サービス<br>発送管理システム</p>

      <div class="login-buttons">
        <button class="login-btn member" id="memberLoginBtn" type="button">
          <span class="btn-icon">👤</span>
          会員としてログイン
        </button>

        <button class="login-btn admin" id="adminLoginBtn" type="button">
          <span class="btn-icon">⚙️</span>
          管理者としてログイン
        </button>
      </div>
    </div>
  </section>

  <!-- メインアプリ -->
  <div class="container main-app" id="mainApp">
    <div class="error-message" id="appErrorMessage"></div>

    <!-- ヘッダー -->
    <header class="app-header">
      <h1 class="app-title">🚚 お気楽便</h1>
      <div class="user-info">
        <span id="userEmail" style="color: var(--text-gray);"></span>
        <span class="user-badge" id="roleLabel">メンバー</span>
        <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
      </div>
    </header>

    <!-- ========== 会員用ダッシュボード ========== -->
    <div id="memberDashboard" class="page-section">
      <!-- ナビゲーション -->
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('member', 'overview')">📊 概要</button>
        <button class="nav-tab" onclick="switchTab('member', 'register')">➕ 商品登録</button>
        <button class="nav-tab" onclick="switchTab('member', 'products')">📦 商品一覧</button>
        <button class="nav-tab" onclick="switchTab('member', 'shipping')">🚚 発送管理</button>
      </div>

      <!-- 概要 -->
      <div id="memberOverview" class="page-section show">
        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-label">登録済み商品</div>
            <div class="stat-value" id="memberProductCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待機中の発送</div>
            <div class="stat-value" id="memberPendingCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">発送完了</div>
            <div class="stat-value" id="memberCompletedCount">0</div>
          </div>
        </div>

        <h2 style="font-size: 20px; margin-top: 30px; margin-bottom: 15px;">最近の商品</h2>
        <div id="memberRecentProducts" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
            <p>「商品登録」タブから登録してください。</p>
          </div>
        </div>
      </div>

      <!-- 商品登録 -->
      <div id="memberRegister" class="page-section">
        <div class="form-section">
          <h2 style="margin-bottom: 20px;">商品を登録する</h2>
          <form id="productForm" onsubmit="registerProduct(event)">
            <div class="form-group">
              <label for="productName">商品名 *</label>
              <input type="text" id="productName" placeholder="例：Canon EOS R5" required>
            </div>

            <div class="form-group">
              <label for="productModel">型番</label>
              <input type="text" id="productModel" placeholder="例：4147C001">
            </div>

            <div class="form-group">
              <label for="productCondition">状態</label>
              <select id="productCondition">
                <option value="new">新品</option>
                <option value="like-new">未使用品</option>
                <option value="excellent">良好</option>
                <option value="good">通常</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productDescription">説明</label>
              <textarea id="productDescription" placeholder="商品の詳細情報を入力してください"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">登録する</button>
          </form>
        </div>
      </div>

      <!-- 商品一覧 -->
      <div id="memberProducts" class="page-section">
        <h2 style="margin-bottom: 20px;">登録済み商品</h2>
        <div id="memberProductsList" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
          </div>
        </div>
      </div>

      <!-- 発送管理 -->
      <div id="memberShipping" class="page-section">
        <h2 style="margin-bottom: 20px;">発送管理</h2>
        <div id="memberShippingList" class="cards-grid">
          <div class="empty-state">
            <h3>発送依頼がありません</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== 管理者用ダッシュボード ========== -->
    <div id="adminDashboard" class="page-section">
      <!-- ナビゲーション -->
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('admin', 'overview')">📊 概要</button>
        <button class="nav-tab" onclick="switchTab('admin', 'members')">👥 メンバー</button>
        <button class="nav-tab" onclick="switchTab('admin', 'products')">📦 全商品</button>
        <button class="nav-tab" onclick="switchTab('admin', 'shipping')">🚚 発送管理</button>
      </div>

      <!-- 概要 -->
      <div id="adminOverview" class="page-section show">
        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-label">総メンバー数</div>
            <div class="stat-value" id="adminMemberCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">管理中の商品</div>
            <div class="stat-value" id="adminProductCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待機中の発送</div>
            <div class="stat-value" id="adminPendingCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">完了した発送</div>
            <div class="stat-value" id="adminCompletedCount">0</div>
          </div>
        </div>
      </div>

      <!-- メンバー一覧 -->
      <div id="adminMembers" class="page-section">
        <h2 style="margin-bottom: 20px;">メンバー一覧</h2>
        <div id="adminMembersList" class="cards-grid">
          <div class="empty-state">
            <h3>メンバーがいません</h3>
          </div>
        </div>
      </div>

      <!-- 全商品 -->
      <div id="adminProducts" class="page-section">
        <h2 style="margin-bottom: 20px;">全商品一覧</h2>
        <div id="adminProductsList" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
          </div>
        </div>
      </div>

      <!-- 発送管理 -->
      <div id="adminShipping" class="page-section">
        <h2 style="margin-bottom: 20px;">発送管理</h2>
        <div id="adminShippingList" class="cards-grid">
          <div class="empty-state">
            <h3>発送依頼がありません</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (Compat版) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <script>
    // ========== Firebase設定 ==========
    const firebaseConfig = {
      apiKey: "AIzaSyB2CH410X3yk4YTJWFC2JyEWScXZn77Z3I",
      authDomain: "my-portfolio-d3560.firebaseapp.com",
      databaseURL: "https://my-portfolio-d3560-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "my-portfolio-d3560",
      storageBucket: "my-portfolio-d3560.firebasestorage.app",
      messagingSenderId: "293517847141",
      appId: "1:293517847141:web:bec173cf345b47cf91f48c"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const database = firebase.database();
    const provider = new firebase.auth.GoogleAuthProvider();

    // DOM要素
    const loginSection = document.getElementById("loginSection");
    const mainApp = document.getElementById("mainApp");
    const memberLoginBtn = document.getElementById("memberLoginBtn");
    const adminLoginBtn = document.getElementById("adminLoginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userEmail = document.getElementById("userEmail");
    const roleLabel = document.getElementById("roleLabel");
    const errorMessage = document.getElementById("errorMessage");
    const appErrorMessage = document.getElementById("appErrorMessage");
    const memberDashboard = document.getElementById("memberDashboard");
    const adminDashboard = document.getElementById("adminDashboard");

    // グローバル変数
    let currentUser = null;
    let currentRole = null;
    let loginMode = null;

    // ========== ログイン処理 ==========
    memberLoginBtn.addEventListener("click", async () => {
      clearError();
      memberLoginBtn.disabled = true;
      loginMode = "member";

      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
      } finally {
        memberLoginBtn.disabled = false;
      }
    });

    adminLoginBtn.addEventListener("click", async () => {
      clearError();
      adminLoginBtn.disabled = true;
      loginMode = "admin";

      try {
        await auth.signInWithPopup(provider);
      } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
      } finally {
        adminLoginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      clearError();
      await auth.signOut();
    });

    // ========== 認証状態の監視 ==========
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        showLoginUI();
        currentUser = null;
        currentRole = null;
        return;
      }

      currentUser = user;

      try {
        // ユーザーの役割を取得または設定
        const userSnapshot = await database.ref(`users/${user.uid}`).once("value");
        
        if (userSnapshot.exists()) {
          currentRole = userSnapshot.val().role;
        } else {
          currentRole = loginMode || "member";
          await database.ref(`users/${user.uid}`).set({
            email: user.email,
            role: currentRole,
            createdAt: firebase.database.ServerValue.TIMESTAMP
          });
        }

        // ログイン履歴を記録
        await database.ref(`loginUsers/${user.uid}`).update({
          uid: user.uid,
          email: user.email,
          role: currentRole,
          lastLoginAt: firebase.database.ServerValue.TIMESTAMP
        });

        // UI表示
        userEmail.textContent = user.email;
        
        if (currentRole === "admin") {
          roleLabel.textContent = "管理者";
          roleLabel.classList.add("admin");
          memberDashboard.classList.remove("show");
          adminDashboard.classList.add("show");
          loadAdminData();
        } else {
          roleLabel.textContent = "メンバー";
          roleLabel.classList.remove("admin");
          adminDashboard.classList.remove("show");
          memberDashboard.classList.add("show");
          loadMemberData();
        }

        showMainApp();
      } catch (error) {
        console.error("Error handling user:", error);
        showError("ユーザー情報の取得に失敗しました");
      }
    });

    // ========== UI制御 ==========
    function showLoginUI() {
      loginSection.classList.remove("hidden");
      mainApp.classList.remove("show");
    }

    function showMainApp() {
      loginSection.classList.add("hidden");
      mainApp.classList.add("show");
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("show");
      appErrorMessage.textContent = message;
      appErrorMessage.classList.add("show");
    }

    function clearError() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("show");
      appErrorMessage.textContent = "";
      appErrorMessage.classList.remove("show");
    }

    // ========== タブ切り替え ==========
    window.switchTab = function(dashboard, tabName) {
      const sections = document.querySelectorAll(".page-section");
      sections.forEach(el => el.classList.remove("show"));

      const tabs = document.querySelectorAll(".nav-tab");
      tabs.forEach(el => el.classList.remove("active"));

      const sectionId = `${dashboard === 'member' ? 'member' : 'admin'}${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`;
      const section = document.getElementById(sectionId);
      if (section) {
        section.classList.add("show");
      }

      event.target.classList.add("active");
    };

    // ========== 商品登録 ==========
    window.registerProduct = async function(event) {
      event.preventDefault();
      
      const name = document.getElementById("productName").value.trim();
      const model = document.getElementById("productModel").value.trim();
      const condition = document.getElementById("productCondition").value;
      const description = document.getElementById("productDescription").value.trim();

      if (!name) {
        showError("商品名は必須です");
        return;
      }

      try {
        const productId = Date.now().toString();
        const product = {
          id: productId,
          name: name,
          model: model,
          condition: condition,
          description: description,
          status: "registered",
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await database.ref(`products/${currentUser.uid}/${productId}`).set(product);

        document.getElementById("productForm").reset();
        alert("商品が登録されました！");
        loadMemberData();
      } catch (error) {
        console.error("Error registering product:", error);
        showError("商品の登録に失敗しました");
      }
    };

    // ========== 会員データ読み込み ==========
    async function loadMemberData() {
      try {
        const uid = currentUser.uid;

        // 商品一覧を取得
        const productsSnapshot = await database.ref(`products/${uid}`).once("value");
        const productsList = document.getElementById("memberProductsList");
        const recentProducts = document.getElementById("memberRecentProducts");

        let productCount = 0;
        let pendingCount = 0;
        let completedCount = 0;

        if (productsSnapshot.exists()) {
          const products = Object.values(productsSnapshot.val()).sort((a, b) => 
            b.createdAt - a.createdAt
          );
          productCount = products.length;

          const html = products.map(product => `
            <div class="card">
              <div class="card-title">${escapeHtml(product.name)}</div>
              <div class="card-meta">
                ${product.model ? '型番: ' + escapeHtml(product.model) + ' | ' : ''}
                状態: ${getConditionLabel(product.condition)}
              </div>
              <div class="card-content">${product.description ? escapeHtml(product.description) : '説明なし'}</div>
              <div style="font-size: 12px; color: #9ca3af;">
                登録日: ${new Date(product.createdAt).toLocaleDateString('ja-JP')}
              </div>
              <div class="card-actions">
                <button class="btn btn-primary" onclick="requestShipping('${product.id}', '${escapeHtml(product.name)}')">
                  発送依頼
                </button>
              </div>
            </div>
          `).join('');

          productsList.innerHTML = html || '<div class="empty-state"><h3>商品がありません</h3></div>';
          recentProducts.innerHTML = html.length > 0 ? products.slice(0, 3).map(product => `
            <div class="card">
              <div class="card-title">${escapeHtml(product.name)}</div>
              <div class="card-meta">${getConditionLabel(product.condition)}</div>
              <div class="card-content">${product.description ? escapeHtml(product.description) : '説明なし'}</div>
              <div class="card-actions">
                <button class="btn btn-primary" onclick="requestShipping('${product.id}', '${escapeHtml(product.name)}')">
                  発送依頼
                </button>
              </div>
            </div>
          `).join('') : '<div class="empty-state"><h3>商品が登録されていません</h3></div>';
        } else {
          productsList.innerHTML = '<div class="empty-state"><h3>商品が登録されていません</h3></div>';
          recentProducts.innerHTML = '<div class="empty-state"><h3>商品が登録されていません</h3></div>';
        }

        // 発送情報を取得
        const shippingSnapshot = await database.ref(`shipping/${uid}`).once("value");
        const shippingList = document.getElementById("memberShippingList");

        if (shippingSnapshot.exists()) {
          const shippings = Object.values(shippingSnapshot.val()).sort((a, b) => 
            b.createdAt - a.createdAt
          );

          shippings.forEach(shipping => {
            if (shipping.status === 'pending') pendingCount++;
            if (shipping.status === 'completed') completedCount++;
          });

          const html = shippings.map(shipping => `
            <div class="card">
              <div class="card-title">${escapeHtml(shipping.productName)}</div>
              <div class="card-meta">
                <span style="background: ${getStatusColor(shipping.status)}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                  ${getStatusLabel(shipping.status)}
                </span>
              </div>
              <div class="card-content">
                依頼日: ${new Date(shipping.createdAt).toLocaleDateString('ja-JP')}
                ${shipping.trackingNumber ? '<br>追跡番号: ' + escapeHtml(shipping.trackingNumber) : ''}
              </div>
            </div>
          `).join('');

          shippingList.innerHTML = html || '<div class="empty-state"><h3>発送依頼がありません</h3></div>';
        } else {
          shippingList.innerHTML = '<div class="empty-state"><h3>発送依頼がありません</h3></div>';
        }

        // 統計を更新
        document.getElementById("memberProductCount").textContent = productCount;
        document.getElementById("memberPendingCount").textContent = pendingCount;
        document.getElementById("memberCompletedCount").textContent = completedCount;
      } catch (error) {
        console.error("Error loading member data:", error);
      }
    }

    // ========== 管理者データ読み込み ==========
    async function loadAdminData() {
      try {
        const usersSnapshot = await database.ref("users").once("value");
        const membersList = document.getElementById("adminMembersList");
        let memberCount = 0;
        let productCount = 0;
        let pendingCount = 0;
        let completedCount = 0;

        if (usersSnapshot.exists()) {
          const users = usersSnapshot.val();
          const members = Object.entries(users)
            .filter(([uid, user]) => user.role === "member")
            .map(([uid, user]) => ({ uid, ...user }));

          memberCount = members.length;

          const html = members.map(member => `
            <div class="card">
              <div class="card-title">${escapeHtml(member.email)}</div>
              <div class="card-meta">メンバー</div>
              <div class="card-content">
                参加日: ${new Date(member.createdAt).toLocaleDateString('ja-JP')}
              </div>
              <div class="card-actions">
                <button class="btn btn-primary" onclick="viewMemberProducts('${member.uid}')">
                  商品を見る
                </button>
              </div>
            </div>
          `).join('');

          membersList.innerHTML = html || '<div class="empty-state"><h3>メンバーがいません</h3></div>';
        }

        // 全商品を取得
        const productsSnapshot = await database.ref("products").once("value");
        const productsList = document.getElementById("adminProductsList");

        if (productsSnapshot.exists()) {
          const allProducts = [];
          const products = productsSnapshot.val();

          Object.entries(products).forEach(([uid, userProducts]) => {
            Object.values(userProducts).forEach(product => {
              allProducts.push({ ...product, uid });
            });
          });

          productCount = allProducts.length;

          const html = allProducts.sort((a, b) => b.createdAt - a.createdAt).map(product => `
            <div class="card">
              <div class="card-title">${escapeHtml(product.name)}</div>
              <div class="card-meta">
                ${product.model ? '型番: ' + escapeHtml(product.model) + ' | ' : ''}
                状態: ${getConditionLabel(product.condition)}
              </div>
              <div class="card-content">${product.description ? escapeHtml(product.description) : '説明なし'}</div>
            </div>
          `).join('');

          productsList.innerHTML = html || '<div class="empty-state"><h3>商品がありません</h3></div>';
        }

        // 発送情報を取得
        const shippingSnapshot = await database.ref("shipping").once("value");
        const shippingList = document.getElementById("adminShippingList");

        if (shippingSnapshot.exists()) {
          const allShippings = [];
          const shippings = shippingSnapshot.val();

          Object.entries(shippings).forEach(([uid, userShippings]) => {
            Object.values(userShippings).forEach(shipping => {
              allShippings.push({ ...shipping, uid });
            });
          });

          allShippings.forEach(shipping => {
            if (shipping.status === 'pending') pendingCount++;
            if (shipping.status === 'completed') completedCount++;
          });

          const html = allShippings.sort((a, b) => b.createdAt - a.createdAt).map(shipping => `
            <div class="card">
              <div class="card-title">${escapeHtml(shipping.productName)}</div>
              <div class="card-meta">
                <span style="background: ${getStatusColor(shipping.status)}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                  ${getStatusLabel(shipping.status)}
                </span>
              </div>
              <div class="card-content">
                依頼日: ${new Date(shipping.createdAt).toLocaleDateString('ja-JP')}
                ${shipping.trackingNumber ? '<br>追跡番号: ' + escapeHtml(shipping.trackingNumber) : ''}
              </div>
            </div>
          `).join('');

          shippingList.innerHTML = html || '<div class="empty-state"><h3>発送依頼がありません</h3></div>';
        }

        // 統計を更新
        document.getElementById("adminMemberCount").textContent = memberCount;
        document.getElementById("adminProductCount").textContent = productCount;
        document.getElementById("adminPendingCount").textContent = pendingCount;
        document.getElementById("adminCompletedCount").textContent = completedCount;
      } catch (error) {
        console.error("Error loading admin data:", error);
      }
    }

    // ========== 発送依頼 ==========
    window.requestShipping = async function(productId, productName) {
      try {
        const shippingId = Date.now().toString();
        const shipping = {
          id: shippingId,
          productId: productId,
          productName: productName,
          status: "pending",
          trackingNumber: null,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        await database.ref(`shipping/${currentUser.uid}/${shippingId}`).set(shipping);
        alert("発送依頼が作成されました。管理者が対応するのをお待ちください。");
        loadMemberData();
      } catch (error) {
        console.error("Error requesting shipping:", error);
        showError("発送依頼の作成に失敗しました");
      }
    };

    // ========== メンバー商品表示 ==========
    window.viewMemberProducts = function(uid) {
      alert("メンバーID: " + uid + " の商品管理画面（現在は未実装）");
    };

    // ========== ヘルパー関数 ==========
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function getConditionLabel(condition) {
      const labels = {
        'new': '新品',
        'like-new': '未使用品',
        'excellent': '良好',
        'good': '通常'
      };
      return labels[condition] || condition;
    }

    function getStatusLabel(status) {
      const labels = {
        'pending': '待機中',
        'shipped': '発送済み',
        'completed': '完了'
      };
      return labels[status] || status;
    }

    function getStatusColor(status) {
      const colors = {
        'pending': '#f59e0b',
        'shipped': '#3b82f6',
        'completed': '#10b981'
      };
      return colors[status] || '#6b7280';
    }

    // ========== エラーメッセージ処理 ==========
    function toJapaneseError(error) {
      const code = error?.code || "unknown";
      const messages = {
        "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
        "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
        "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
        "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
        "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。"
      };
      return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
    }
  </script>
