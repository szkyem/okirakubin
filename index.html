<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気楽便</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    color: #1f2937;
    background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
}

.entry-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.entry-panel {
    width: 100%;
    max-width: 520px;
    padding: 36px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
    text-align: center;
}

.entry-panel h1 {
    margin-bottom: 12px;
    font-size: 30px;
    color: #2563eb;
}

.entry-panel p {
    line-height: 1.7;
    color: #4b5563;
}

.entry-buttons {
    display: grid;
    gap: 12px;
    margin-top: 24px;
}

.entry-button {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    background: #2563eb;
    color: #ffffff;
}

.entry-button:hover {
    background: #1d4ed8;
}

.entry-button.admin {
    background: #eef2f7;
    color: #1f2937;
}

.entry-button.admin:hover {
    background: #dfe7f1;
}
</style>
</head>
<body>
<main class="entry-container">
    <section class="entry-panel">
        <h1>お気楽便</h1>
        <p>利用する画面を選択してください。</p>

        <div class="entry-buttons">
            <a class="entry-button" href="member.html">会員としてログイン</a>
            <a class="entry-button" href="register.html">会員登録を申請</a>
            <a class="entry-button admin" href="admin.html">管理者としてログイン</a>
        </div>
    </section>
</main>
</body>
</html>
