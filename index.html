<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おきらく便 - 会員ログイン</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    color: #1f2937;
    background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: #2563eb;
    color: #ffffff;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
}

.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.login-panel {
    width: 100%;
    max-width: 520px;
    padding: 36px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
    text-align: center;
}

.login-panel h1 {
    margin-bottom: 12px;
    font-size: 28px;
}

.login-panel p {
    line-height: 1.7;
    color: #4b5563;
}

.login-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 24px;
}

.login-button {
    width: 100%;
}

.admin-button {
    width: 100%;
    background: #eef2f7;
    color: #6b7280;
}

.admin-button:hover {
    background: #eef2f7;
}

.error-message {
    display: none;
    margin-bottom: 18px;
    padding: 12px;
    border-radius: 8px;
    background: #fef3f2;
    color: #b42318;
    line-height: 1.6;
    text-align: left;
}

.error-message.show {
    display: block;
}
</style>
</head>
<body>
<main>
<section class="login-container" id="loginSection">
    <div class="login-panel">
        <div class="error-message" id="errorMessage"></div>

        <h1>おきらく便</h1>
        <p>Googleアカウントで会員としてログインしてください。</p>

        <div class="login-buttons">
            <button class="login-button" id="memberLoginBtn" type="button">会員としてログイン</button>
            <button class="admin-button" id="adminLoginBtn" type="button" disabled>管理者としてログイン</button>
        </div>
    </div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
    getDatabase,
    ref,
    set,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
    authDomain: "okirakubin-manager.firebaseapp.com",
    projectId: "okirakubin-manager",
    storageBucket: "okirakubin-manager.firebasestorage.app",
    messagingSenderId: "387991576787",
    appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);
const provider = new GoogleAuthProvider();

const memberLoginBtn = document.getElementById("memberLoginBtn");
const errorMessage = document.getElementById("errorMessage");

let redirecting = false;

memberLoginBtn.addEventListener("click", async () => {
    clearError();
    memberLoginBtn.disabled = true;

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
        memberLoginBtn.disabled = false;
    }
});

onAuthStateChanged(auth, async (user) => {
    if (!user || redirecting) {
        if (!user) {
            memberLoginBtn.disabled = false;
        }
        return;
    }

    redirecting = true;

    try {
        await set(ref(database, `loginUsers/${user.uid}`), {
            uid: user.uid,
            name: user.displayName || "",
            email: user.email || "",
            role: "member",
            lastLoginAt: serverTimestamp()
        });
    } catch (error) {
        console.error(error);
    }

    goToPage("member.html");
});

function goToPage(fileName) {
    const basePath = location.pathname.includes("/okirakubin/")
        ? "/okirakubin/"
        : "./";

    window.location.assign(basePath + fileName);
}

function showError(message) {
    errorMessage.textContent = message;
    errorMessage.classList.add("show");
}

function clearError() {
    errorMessage.textContent = "";
    errorMessage.classList.remove("show");
}

function toJapaneseError(error) {
    const code = error?.code || "unknown";

    const messages = {
        "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
        "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
        "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
        "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
        "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。",
        "auth/network-request-failed": "ネットワーク接続に失敗しました。通信環境を確認してください。"
    };

    return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
}
</script>
</body>
</html>
