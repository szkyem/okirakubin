<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おきらく便 - 発送管理システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --bg-light: #f3f4f6;
      --bg-white: #ffffff;
      --text-dark: #1f2937;
      --text-gray: #6b7280;
      --border: #e5e7eb;
    }

    body {
      font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .login-container {
      min-height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-panel {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .login-panel h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-panel .subtitle {
      font-size: 14px;
      color: var(--text-gray);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .login-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-btn {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn.member {
      background: var(--primary);
      color: white;
    }

    .login-btn.member:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    .login-btn.admin {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 2px solid var(--border);
      margin-top: 20px;
      font-size: 14px;
    }

    .login-btn.admin:hover {
      background: var(--border);
      border-color: var(--text-gray);
    }

    .login-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .btn-icon {
      font-size: 18px;
    }

    .error-message {
      display: none;
      background: #fef3f2;
      color: #b42318;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      border-left: 4px solid #b42318;
      line-height: 1.6;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .container {
      background: var(--bg-white);
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
      padding: 36px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-app {
      display: none;
    }

    .main-app.show {
      display: block;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .app-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .user-badge {
      background: var(--primary);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .user-badge.admin {
      background: var(--secondary);
    }

    .logout-btn {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: var(--border);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0;
      flex-wrap: wrap;
    }

    .nav-tab {
      padding: 12px 20px;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-gray);
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      font-size: 15px;
    }

    .nav-tab:hover {
      color: var(--primary);
    }

    .nav-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .page-section {
      display: none;
    }

    .page-section.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-white);
      border-radius: 10px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      background: var(--bg-white);
      transition: all 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-gray);
      margin-bottom: 12px;
    }

    .card-content {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    .form-section {
      background: var(--bg-white);
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .empty-state {
      color: var(--text-gray);
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .container,
      .login-panel {
        padding: 24px;
      }

      .app-header {
        flex-direction: column;
        align-items: stretch;
      }

      .logout-btn {
        width: 100%;
      }

      .nav-tabs {
        flex-wrap: wrap;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .dashboard-stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <section class="login-container" id="loginSection">
    <div class="login-panel">
      <div class="error-message" id="errorMessage"></div>

      <h1>おきらく便</h1>
      <p class="subtitle">カメラ発送代行サービス<br>発送管理システム</p>

      <div class="login-buttons">
        <button class="login-btn member" id="memberLoginBtn" type="button">
          <span class="btn-icon">👤</span>
          会員としてログイン
        </button>

        <button class="login-btn admin" id="adminLoginBtn" type="button">
          <span class="btn-icon">⚙</span>
          管理者としてログイン
        </button>
      </div>
    </div>
  </section>

  <div class="container main-app" id="mainApp">
    <div class="error-message" id="appErrorMessage"></div>

    <header class="app-header">
      <h1 class="app-title">おきらく便</h1>
      <div class="user-info">
        <span id="userEmail" style="color: var(--text-gray);"></span>
        <span class="user-badge" id="roleLabel">メンバー</span>
        <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
      </div>
    </header>

    <div id="memberDashboard" class="page-section">
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab(event, 'member', 'overview')">概要</button>
        <button class="nav-tab" onclick="switchTab(event, 'member', 'register')">商品登録</button>
        <button class="nav-tab" onclick="switchTab(event, 'member', 'products')">商品一覧</button>
        <button class="nav-tab" onclick="switchTab(event, 'member', 'shipping')">発送管理</button>
      </div>

      <div id="memberOverview" class="page-section show">
        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-label">登録済み商品</div>
            <div class="stat-value" id="memberProductCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待機中の発送</div>
            <div class="stat-value" id="memberPendingCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">発送完了</div>
            <div class="stat-value" id="memberCompletedCount">0</div>
          </div>
        </div>

        <h2 style="font-size: 20px; margin-top: 30px; margin-bottom: 15px;">最近の商品</h2>
        <div id="memberRecentProducts" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
            <p>「商品登録」タブから登録してください。</p>
          </div>
        </div>
      </div>

      <div id="memberRegister" class="page-section">
        <div class="form-section">
          <h2 style="margin-bottom: 20px;">商品を登録する</h2>
          <form id="productForm" onsubmit="registerProduct(event)">
            <div class="form-group">
              <label for="productName">商品名 *</label>
              <input type="text" id="productName" placeholder="例: Canon EOS R5" required>
            </div>

            <div class="form-group">
              <label for="productModel">型番</label>
              <input type="text" id="productModel" placeholder="例: 4147C001">
            </div>

            <div class="form-group">
              <label for="productCondition">状態</label>
              <select id="productCondition">
                <option value="new">新品</option>
                <option value="like-new">未使用品</option>
                <option value="excellent">良好</option>
                <option value="good">通常</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productDescription">説明</label>
              <textarea id="productDescription" placeholder="商品の詳細情報を入力してください"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">登録する</button>
          </form>
        </div>
      </div>

      <div id="memberProducts" class="page-section">
        <h2 style="margin-bottom: 20px;">登録済み商品</h2>
        <div id="memberProductsList" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
          </div>
        </div>
      </div>

      <div id="memberShipping" class="page-section">
        <h2 style="margin-bottom: 20px;">発送管理</h2>
        <div id="memberShippingList" class="cards-grid">
          <div class="empty-state">
            <h3>発送依頼がありません</h3>
          </div>
        </div>
      </div>
    </div>

    <div id="adminDashboard" class="page-section">
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab(event, 'admin', 'overview')">概要</button>
        <button class="nav-tab" onclick="switchTab(event, 'admin', 'members')">メンバー</button>
        <button class="nav-tab" onclick="switchTab(event, 'admin', 'products')">全商品</button>
        <button class="nav-tab" onclick="switchTab(event, 'admin', 'shipping')">発送管理</button>
      </div>

      <div id="adminOverview" class="page-section show">
        <div class="dashboard-stats">
          <div class="stat-card">
            <div class="stat-label">総メンバー数</div>
            <div class="stat-value" id="adminMemberCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">管理中の商品</div>
            <div class="stat-value" id="adminProductCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">待機中の発送</div>
            <div class="stat-value" id="adminPendingCount">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">完了した発送</div>
            <div class="stat-value" id="adminCompletedCount">0</div>
          </div>
        </div>
      </div>

      <div id="adminMembers" class="page-section">
        <h2 style="margin-bottom: 20px;">メンバー一覧</h2>
        <div id="adminMembersList" class="cards-grid">
          <div class="empty-state">
            <h3>メンバーがいません</h3>
          </div>
        </div>
      </div>

      <div id="adminProducts" class="page-section">
        <h2 style="margin-bottom: 20px;">全商品一覧</h2>
        <div id="adminProductsList" class="cards-grid">
          <div class="empty-state">
            <h3>商品が登録されていません</h3>
          </div>
        </div>
      </div>

      <div id="adminShipping" class="page-section">
        <h2 style="margin-bottom: 20px;">発送管理</h2>
        <div id="adminShippingList" class="cards-grid">
          <div class="empty-state">
            <h3>発送依頼がありません</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
  authDomain: "okirakubin-manager.firebaseapp.com",
  projectId: "okirakubin-manager",
  storageBucket: "okirakubin-manager.firebasestorage.app",
  messagingSenderId: "387991576787",
  appId: "1:387991576787:web:db731b898f46dc8214f426"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById("loginSection");
    const mainApp = document.getElementById("mainApp");
    const memberLoginBtn = document.getElementById("memberLoginBtn");
    const adminLoginBtn = document.getElementById("adminLoginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userEmail = document.getElementById("userEmail");
    const roleLabel = document.getElementById("roleLabel");
    const errorMessage = document.getElementById("errorMessage");
    const appErrorMessage = document.getElementById("appErrorMessage");
    const memberDashboard = document.getElementById("memberDashboard");
    const adminDashboard = document.getElementById("adminDashboard");

    let currentUser = null;
    let currentRole = null;
    let loginMode = sessionStorage.getItem("okirakubinLoginMode") || null;

    memberLoginBtn.addEventListener("click", async () => {
      clearError();
      memberLoginBtn.disabled = true;
      loginMode = "member";
      sessionStorage.setItem("okirakubinLoginMode", "member");

      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
      } finally {
        memberLoginBtn.disabled = false;
      }
    });

    adminLoginBtn.addEventListener("click", async () => {
      clearError();
      adminLoginBtn.disabled = true;
      loginMode = "admin";
      sessionStorage.setItem("okirakubinLoginMode", "admin");

      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
      } finally {
        adminLoginBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      clearError();

      try {
        await signOut(auth);
      } catch (error) {
        showError(toJapaneseError(error));
        console.error(error);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        showLoginUI();
        currentUser = null;
        currentRole = null;
        return;
      }

      currentUser = user;

      try {
        currentRole = await findUserRoleByEmailOrUid(user);

        await update(ref(database, `loginUsers/${user.uid}`), {
          uid: user.uid,
          email: user.email || "",
          name: user.displayName || "",
          role: currentRole,
          lastLoginAt: serverTimestamp()
        });

        userEmail.textContent = user.email || user.displayName || user.uid;

        if (currentRole === "admin") {
          roleLabel.textContent = "管理者";
          roleLabel.classList.add("admin");
          memberDashboard.classList.remove("show");
          adminDashboard.classList.add("show");
          await loadAdminData();
        } else {
          roleLabel.textContent = "メンバー";
          roleLabel.classList.remove("admin");
          adminDashboard.classList.remove("show");
          memberDashboard.classList.add("show");
          await loadMemberData();
        }

        showMainApp();
      } catch (error) {
        console.error("Error handling user:", error);
        showError("ユーザー情報の取得に失敗しました。");
      }
    });

    async function findUserRoleByEmailOrUid(user) {
      const uidSnapshot = await get(ref(database, `users/${user.uid}`));

      if (uidSnapshot.exists()) {
        const existingUser = uidSnapshot.val();
        if (existingUser.role) {
          return existingUser.role;
        }
      }

      const usersSnapshot = await get(ref(database, "users"));
      const email = String(user.email || "").toLowerCase();
      let matchedRole = null;
      let matchedCreatedAt = null;

      if (usersSnapshot.exists()) {
        const matchedEntries = Object.values(usersSnapshot.val() || {}).filter((entry) => {
          return String(entry.email || "").toLowerCase() === email;
        });

        const modeMatched = matchedEntries.find((entry) => entry.role === loginMode);
        const adminMatched = matchedEntries.find((entry) => entry.role === "admin");
        const firstMatched = matchedEntries[0];

        const selected = modeMatched || adminMatched || firstMatched;

        if (selected?.role) {
          matchedRole = selected.role;
          matchedCreatedAt = selected.createdAt || null;
        }
      }

      const role = matchedRole || loginMode || "member";

      await update(ref(database, `users/${user.uid}`), {
        uid: user.uid,
        email: user.email || "",
        name: user.displayName || "",
        role,
        createdAt: matchedCreatedAt || serverTimestamp(),
        updatedAt: serverTimestamp()
      });

      return role;
    }

    async function ensureCurrentUserRecord() {
      if (!currentUser) {
        throw new Error("ログイン状態を確認できません。");
      }

      const role = currentRole || "member";

      await update(ref(database, `users/${currentUser.uid}`), {
        uid: currentUser.uid,
        email: currentUser.email || "",
        name: currentUser.displayName || "",
        role,
        updatedAt: serverTimestamp()
      });
    }

    function showLoginUI() {
      loginSection.classList.remove("hidden");
      mainApp.classList.remove("show");
    }

    function showMainApp() {
      loginSection.classList.add("hidden");
      mainApp.classList.add("show");
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("show");
      appErrorMessage.textContent = message;
      appErrorMessage.classList.add("show");
    }

    function clearError() {
      errorMessage.textContent = "";
      errorMessage.classList.remove("show");
      appErrorMessage.textContent = "";
      appErrorMessage.classList.remove("show");
    }

    window.switchTab = function(event, dashboard, tabName) {
      const root = dashboard === "member" ? memberDashboard : adminDashboard;

      root.querySelectorAll(".page-section").forEach((el) => {
        el.classList.remove("show");
      });

      root.querySelectorAll(".nav-tab").forEach((el) => {
        el.classList.remove("active");
      });

      const prefix = dashboard === "member" ? "member" : "admin";
      const sectionId = `${prefix}${tabName.charAt(0).toUpperCase() + tabName.slice(1)}`;
      const section = document.getElementById(sectionId);

      if (section) {
        section.classList.add("show");
      }

      event.currentTarget.classList.add("active");
    };

    window.registerProduct = async function(event) {
      event.preventDefault();
      clearError();

      const name = document.getElementById("productName").value.trim();
      const model = document.getElementById("productModel").value.trim();
      const condition = document.getElementById("productCondition").value;
      const description = document.getElementById("productDescription").value.trim();

      if (!name) {
        showError("商品名は必須です。");
        return;
      }

      try {
        await ensureCurrentUserRecord();

        const productId = Date.now().toString();

        const product = {
          id: productId,
          ownerUid: currentUser.uid,
          ownerEmail: currentUser.email || "",
          name,
          model,
          condition,
          description,
          status: "registered",
          createdAt: Date.now(),
          updatedAt: Date.now()
        };

        await set(ref(database, `products/${currentUser.uid}/${productId}`), product);

        document.getElementById("productForm").reset();
        alert("商品が登録されました。");
        await loadMemberData();
      } catch (error) {
        console.error("Error registering product:", error);

        if (error?.code === "PERMISSION_DENIED" || String(error?.message || "").includes("Permission denied")) {
          showError("商品の登録に失敗しました。Realtime Databaseのルールで書き込みが許可されていない可能性があります。");
        } else {
          showError("商品の登録に失敗しました。");
        }
      }
    };

    async function loadMemberData() {
      try {
        const uid = currentUser.uid;
        const productsSnapshot = await get(ref(database, `products/${uid}`));
        const productsList = document.getElementById("memberProductsList");
        const recentProducts = document.getElementById("memberRecentProducts");

        let productCount = 0;
        let pendingCount = 0;
        let completedCount = 0;

        if (productsSnapshot.exists()) {
          const products = Object.values(productsSnapshot.val()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          productCount = products.length;

          const html = products.map((product) => productCardHtml(product, true)).join("");

          productsList.innerHTML = html || emptyHtml("商品がありません");
          recentProducts.innerHTML = products.length > 0
            ? products.slice(0, 3).map((product) => productCardHtml(product, true)).join("")
            : emptyHtml("商品が登録されていません");
        } else {
          productsList.innerHTML = emptyHtml("商品が登録されていません");
          recentProducts.innerHTML = emptyHtml("商品が登録されていません");
        }

        const shippingSnapshot = await get(ref(database, `shipping/${uid}`));
        const shippingList = document.getElementById("memberShippingList");

        if (shippingSnapshot.exists()) {
          const shippings = Object.values(shippingSnapshot.val()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          shippings.forEach((shipping) => {
            if (shipping.status === "pending") pendingCount++;
            if (shipping.status === "completed") completedCount++;
          });

          shippingList.innerHTML = shippings.map(shippingCardHtml).join("") || emptyHtml("発送依頼がありません");
        } else {
          shippingList.innerHTML = emptyHtml("発送依頼がありません");
        }

        document.getElementById("memberProductCount").textContent = productCount;
        document.getElementById("memberPendingCount").textContent = pendingCount;
        document.getElementById("memberCompletedCount").textContent = completedCount;
      } catch (error) {
        console.error("Error loading member data:", error);
      }
    }

    async function loadAdminData() {
      try {
        const usersSnapshot = await get(ref(database, "users"));
        const membersList = document.getElementById("adminMembersList");

        let memberCount = 0;
        let productCount = 0;
        let pendingCount = 0;
        let completedCount = 0;

        if (usersSnapshot.exists()) {
          const users = usersSnapshot.val();

          const members = Object.entries(users)
            .filter(([, user]) => user.role === "member")
            .map(([uid, user]) => ({ uid, ...user }));

          memberCount = members.length;

          membersList.innerHTML = members.map((member) => `
            <div class="card">
              <div class="card-title">${escapeHtml(member.email || member.name || member.uid)}</div>
              <div class="card-meta">メンバー</div>
              <div class="card-content">参加日: ${formatDate(member.createdAt)}</div>
              <div class="card-actions">
                <button class="btn btn-primary" onclick="viewMemberProducts('${escapeAttr(member.uid)}')">商品を見る</button>
              </div>
            </div>
          `).join("") || emptyHtml("メンバーがいません");
        } else {
          membersList.innerHTML = emptyHtml("メンバーがいません");
        }

        const productsSnapshot = await get(ref(database, "products"));
        const productsList = document.getElementById("adminProductsList");

        if (productsSnapshot.exists()) {
          const allProducts = [];

          Object.entries(productsSnapshot.val()).forEach(([uid, userProducts]) => {
            Object.values(userProducts || {}).forEach((product) => {
              allProducts.push({ ...product, uid });
            });
          });

          productCount = allProducts.length;

          productsList.innerHTML = allProducts
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
            .map((product) => productCardHtml(product, false))
            .join("") || emptyHtml("商品がありません");
        } else {
          productsList.innerHTML = emptyHtml("商品が登録されていません");
        }

        const shippingSnapshot = await get(ref(database, "shipping"));
        const shippingList = document.getElementById("adminShippingList");

        if (shippingSnapshot.exists()) {
          const allShippings = [];

          Object.entries(shippingSnapshot.val()).forEach(([uid, userShippings]) => {
            Object.values(userShippings || {}).forEach((shipping) => {
              allShippings.push({ ...shipping, uid });
            });
          });

          allShippings.forEach((shipping) => {
            if (shipping.status === "pending") pendingCount++;
            if (shipping.status === "completed") completedCount++;
          });

          shippingList.innerHTML = allShippings
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
            .map(shippingCardHtml)
            .join("") || emptyHtml("発送依頼がありません");
        } else {
          shippingList.innerHTML = emptyHtml("発送依頼がありません");
        }

        document.getElementById("adminMemberCount").textContent = memberCount;
        document.getElementById("adminProductCount").textContent = productCount;
        document.getElementById("adminPendingCount").textContent = pendingCount;
        document.getElementById("adminCompletedCount").textContent = completedCount;
      } catch (error) {
        console.error("Error loading admin data:", error);
      }
    }

    window.requestShipping = async function(productId, productName) {
      try {
        await ensureCurrentUserRecord();

        const shippingId = Date.now().toString();

        const shipping = {
          id: shippingId,
          ownerUid: currentUser.uid,
          ownerEmail: currentUser.email || "",
          productId,
          productName,
          status: "pending",
          trackingNumber: null,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };

        await set(ref(database, `shipping/${currentUser.uid}/${shippingId}`), shipping);

        alert("発送依頼が作成されました。管理者の対応をお待ちください。");
        await loadMemberData();
      } catch (error) {
        console.error("Error requesting shipping:", error);

        if (error?.code === "PERMISSION_DENIED" || String(error?.message || "").includes("Permission denied")) {
          showError("発送依頼の作成に失敗しました。Realtime Databaseのルールで書き込みが許可されていない可能性があります。");
        } else {
          showError("発送依頼の作成に失敗しました。");
        }
      }
    };

    window.viewMemberProducts = function(uid) {
      alert("メンバーID: " + uid + " の商品管理画面は現在未実装です。");
    };

    function productCardHtml(product, showShippingButton) {
      return `
        <div class="card">
          <div class="card-title">${escapeHtml(product.name)}</div>
          <div class="card-meta">
            ${product.model ? "型番: " + escapeHtml(product.model) + " | " : ""}
            状態: ${getConditionLabel(product.condition)}
          </div>
          <div class="card-content">${product.description ? escapeHtml(product.description) : "説明なし"}</div>
          <div style="font-size: 12px; color: #9ca3af;">登録日: ${formatDate(product.createdAt)}</div>
          ${showShippingButton ? `
            <div class="card-actions">
              <button class="btn btn-primary" onclick="requestShipping('${escapeAttr(product.id)}', '${escapeAttr(product.name)}')">発送依頼</button>
            </div>
          ` : ""}
        </div>
      `;
    }

    function shippingCardHtml(shipping) {
      return `
        <div class="card">
          <div class="card-title">${escapeHtml(shipping.productName)}</div>
          <div class="card-meta">
            <span style="background: ${getStatusColor(shipping.status)}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
              ${getStatusLabel(shipping.status)}
            </span>
          </div>
          <div class="card-content">
            依頼日: ${formatDate(shipping.createdAt)}
            ${shipping.trackingNumber ? "<br>追跡番号: " + escapeHtml(shipping.trackingNumber) : ""}
          </div>
        </div>
      `;
    }

    function emptyHtml(message) {
      return `<div class="empty-state"><h3>${escapeHtml(message)}</h3></div>`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text ?? "");
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return String(text ?? "").replace(/[&<>"']/g, (s) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[s]));
    }

    function formatDate(value) {
      if (!value) return "-";

      const date = typeof value === "number" ? new Date(value) : new Date(value);

      if (Number.isNaN(date.getTime())) return "-";

      return date.toLocaleDateString("ja-JP");
    }

    function getConditionLabel(condition) {
      const labels = {
        "new": "新品",
        "like-new": "未使用品",
        "excellent": "良好",
        "good": "通常"
      };

      return labels[condition] || condition || "-";
    }

    function getStatusLabel(status) {
      const labels = {
        "pending": "待機中",
        "shipped": "発送済み",
        "completed": "完了"
      };

      return labels[status] || status || "-";
    }

    function getStatusColor(status) {
      const colors = {
        "pending": "#f59e0b",
        "shipped": "#3b82f6",
        "completed": "#10b981"
      };

      return colors[status] || "#6b7280";
    }

    function toJapaneseError(error) {
      const code = error?.code || "unknown";

      const messages = {
        "auth/unauthorized-domain": "このドメインがFirebase Authenticationの承認済みドメインに入っていません。Firebase ConsoleでAuthorized domainsを確認してください。",
        "auth/popup-blocked": "ブラウザがログイン用ポップアップをブロックしています。ポップアップを許可して再試行してください。",
        "auth/popup-closed-by-user": "ログイン画面が閉じられました。もう一度ログインしてください。",
        "auth/operation-not-allowed": "Firebase ConsoleのAuthenticationでGoogleログインが有効になっていません。",
        "auth/invalid-api-key": "Firebase設定のapiKeyが正しくありません。",
        "auth/network-request-failed": "ネットワーク接続に失敗しました。通信環境を確認してください。"
      };

      return messages[code] || `ログインできませんでした。エラーコード: ${code}`;
    }
  </script>
