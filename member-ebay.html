<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気楽便｜eBay発送代行</title><link rel="stylesheet" href="service-common.css"></head><body class="ebay-theme"><main class="shell">
<section id="login" class="panel login"><div class="brand">お気楽便 eBay発送代行</div><p>会員ログイン</p><button id="loginBtn" class="btn">Googleでログイン</button><div id="loginError" class="error hidden"></div></section>
<section id="app" class="hidden"><header class="topbar"><div><div class="brand">eBay発送代行</div><div id="email" class="sub"></div></div><div class="actions"><a id="portalLink" class="btn secondary hidden" href="member-portal.html">サービス選択</a><button id="logoutBtn" class="btn secondary">ログアウト</button></div></header><div id="message" class="hidden"></div>
<div class="tabs"><button class="btn tab active" data-tab="products">商品・発送</button><button class="btn tab" data-tab="invoices">eBay請求書</button></div>
<section id="productsTab"><div class="panel"><div class="section-title"><h2>商品を登録</h2><span class="badge">会員入力</span></div><form id="productForm"><div class="grid"><div class="field"><label>商品名 *</label><input name="productName" required></div><div class="field"><label>eBay注文番号／管理番号 *</label><input name="orderNumber" required></div><div class="field"><label>SKU</label><input name="sku"></div><div class="field"><label>商品重量</label><input name="itemWeight" placeholder="例：850g"></div></div><button class="btn" type="submit">登録する</button></form></div>
<div class="panel"><div class="section-title"><h2>eBay商品一覧</h2><span id="count" class="badge">0件</span></div><div class="table-wrap"><table><thead><tr><th>商品名</th><th>注文番号／管理番号</th><th>SKU</th><th>商品重量</th><th>梱包後</th><th>状態</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
<section id="invoicesTab" class="hidden"><div class="panel"><div class="section-title"><h2>eBay請求書</h2><span class="badge">カメラ請求とは別管理</span></div><div id="invoiceList"></div></div></section>
</section></main>
<dialog id="labelDialog"><form id="labelForm" method="dialog" class="panel" style="max-width:520px;margin:0"><h2>配送ラベルを連絡</h2><input type="hidden" name="productId"><div class="field"><label>配送サービス *</label><input name="deliveryService" required placeholder="例：FedEx / DHL"></div><div class="field"><label>発送日 *</label><input name="shippingDate" type="date" required></div><div class="field"><label>ラベルファイル *</label><input name="labelFile" type="file" required accept="image/*,.pdf"></div><div class="field"><label>メモ（任意）</label><textarea name="memo"></textarea></div><div class="actions"><button class="btn" value="save">送信する</button><button class="btn secondary" value="cancel">閉じる</button></div></form></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get,set,update}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const cfg={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"},gas="https://script.google.com/macros/s/AKfycbyK0ZqT98gvpja-O2BVZPVcrHFrAxFvD4DZko_ded0_yXCgZ6x302wDtMZpoPONbPGv/exec",token="okirakubin_drive_folder_20260527_K7mQp9xR2vL8sT4nY6bF";const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),provider=new GoogleAuthProvider();let user,settings={},items=[];const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
loginBtn.onclick=()=>signInWithPopup(auth,provider).catch(e=>error(e.message));logoutBtn.onclick=()=>signOut(auth);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));productsTab.classList.toggle("hidden",b.dataset.tab!=="products");invoicesTab.classList.toggle("hidden",b.dataset.tab!=="invoices")});
onAuthStateChanged(auth,async u=>{user=u;if(!u){login.classList.remove("hidden");$("app").classList.add("hidden");return}try{const [m,s]=await Promise.all([get(ref(db,`members/${u.uid}`)),get(ref(db,`memberSettings/${u.uid}`))]);if(m.val()!==true)throw Error("このアカウントは会員登録されていません。");settings=s.val()||{};const services=settings.enabledServices||{camera:true,ebay:false};if(!services.ebay)throw Error("eBay発送代行が有効になっていません。管理者へお問い合わせください。");portalLink.classList.toggle("hidden",services.camera===false);email.textContent=u.email||"";login.classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(e){error(e.message)}});
async function load(){const [p,i]=await Promise.all([get(ref(db,`products/${user.uid}`)),get(ref(db,`ebayInvoices/${user.uid}`)).catch(()=>({val:()=>({})}))]);items=Object.entries(p.val()||{}).filter(([,x])=>x.serviceType==="ebay").map(([id,x])=>({id,...x})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));render();renderInvoices(i.val()||{})}
productForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=`ebay_${Date.now()}`;await set(ref(db,`products/${user.uid}/${id}`),{serviceType:"ebay",productName:f.get("productName").trim(),orderNumber:f.get("orderNumber").trim(),sku:f.get("sku").trim(),itemWeight:f.get("itemWeight").trim(),ebayStatus:"registered",createdAt:Date.now(),updatedAt:Date.now()});e.target.reset();notice("商品を登録しました。");await load()};
function render(){count.textContent=`${items.length}件`;tbody.innerHTML=items.length?items.map(x=>`<tr><td>${esc(x.productName)}</td><td>${esc(x.orderNumber)}</td><td>${esc(x.sku||"-")}</td><td>${esc(x.itemWeight||"-")}</td><td>${esc(x.packedSize||"-")} / ${esc(x.packedWeight||"-")}<br><span class="sub">原産国 ${esc(x.countryOfOrigin||"-")}</span></td><td><span class="badge ${x.ebayStatus==="shipped"?"done":""}">${status(x.ebayStatus)}</span></td><td>${actions(x)}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">eBay商品はまだありません。</td></tr>`;tbody.querySelectorAll("button[data-action]").forEach(b=>b.onclick=()=>act(b.dataset.action,b.dataset.id))}
function status(s){return({registered:"登録済み",requested:"発送依頼済み",measured:"梱包情報回答済み",label_received:"ラベル連絡済み",shipped:"発送済み"})[s||"registered"]||s}function actions(x){if((x.ebayStatus||"registered")==="registered")return`<button class="btn" data-action="request" data-id="${x.id}">発送を依頼</button>`;if(x.ebayStatus==="measured")return`<button class="btn green" data-action="label" data-id="${x.id}">ラベルを連絡</button>`;return"-"}async function act(a,id){if(a==="request"){if(!confirm("この商品の発送を依頼しますか？"))return;await update(ref(db,`products/${user.uid}/${id}`),{ebayStatus:"requested",shippingRequestedAt:Date.now(),updatedAt:Date.now()});await load()}else{labelForm.productId.value=id;labelDialog.showModal()}}
labelForm.onsubmit=async e=>{e.preventDefault();if(e.submitter?.value==="cancel"){labelDialog.close();return}const f=new FormData(e.target),file=f.get("labelFile"),id=f.get("productId"),item=items.find(x=>x.id===id);try{const b64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(file)}),webhook=settings.discordLabelWebhookUrl||settings.discordWebhookUrl;if(!webhook)throw Error("発送ラベル連絡用Webhookが未設定です。管理者へお問い合わせください。");const payload={token,action:"discordNotifyFile",webhookUrl:webhook,message:`【eBay発送ラベル】\n商品名：${item.productName}\n注文番号／管理番号：${item.orderNumber}\n配送サービス：${f.get("deliveryService")}\n発送日：${f.get("shippingDate")}\nメモ：${f.get("memo")||"-"}`,fileName:file.name,mimeType:file.type||"application/octet-stream",fileBase64:b64,requestId:`ebay_${Date.now()}`};const res=await fetch(gas,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}),json=await res.json();if(!json.ok)throw Error(json.error||"ラベル送信に失敗しました。");await update(ref(db,`products/${user.uid}/${id}`),{deliveryService:f.get("deliveryService"),shippingDate:f.get("shippingDate"),labelFileName:file.name,labelMemo:f.get("memo")||"",ebayStatus:"label_received",labelReceivedAt:Date.now(),updatedAt:Date.now()});labelDialog.close();e.target.reset();notice("ラベルを連絡しました。");await load()}catch(x){error(x.message)}};
function renderInvoices(data){const rows=Object.entries(data).sort(([a],[b])=>b.localeCompare(a));invoiceList.innerHTML=rows.length?rows.map(([month,x])=>`<div class="invoice-card"><div><b>${esc(month)} eBay請求書</b><div class="sub">${esc(x.note||"")}</div></div><div><b>¥${Number(x.amount||0).toLocaleString()}</b> <span class="badge ${x.received?"done":""}">${x.received?"受領済み":"未受領"}</span></div></div>`).join(""):`<div class="empty">eBay請求書はまだありません。</div>`}function notice(m){message.className="success";message.textContent=m}function error(m){loginError.textContent=m;loginError.classList.remove("hidden");message.className="error";message.textContent=m}
</script></body></html>
