<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気楽便｜eBay管理</title><style>
:root{--navy:#0f172a;--blue:#2563eb;--pale:#eff6ff;--line:#d9dee8;--ink:#0f172a;--muted:#64748b;--green:#16836b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#4f7df3 0%,#7551b8 100%);padding:14px 12px 48px}body.ebay-theme{--blue:#111827;--pale:#fff8d8;--navy:#111827;--line:#111827;background:linear-gradient(135deg,#f7c948 0%,#e5a62f 100%)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{width:min(1400px,100%);min-height:calc(100vh - 28px);margin:auto;padding:28px 22px 48px;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(15,23,42,.18)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{font-size:30px;font-weight:800;letter-spacing:.05em;color:var(--blue)}.sub{color:var(--muted);font-size:13px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 18px rgba(30,64,110,.06)}.panel{padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:20px;text-decoration:none;color:inherit;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#9bc5ee;box-shadow:0 8px 22px rgba(37,99,235,.1)}body.ebay-theme .card:hover{border-color:#111827;box-shadow:0 8px 22px rgba(183,121,0,.14)}.card h2,.card h3{margin:0 0 10px;color:var(--navy)}.metric{font-size:32px;font-weight:800;color:var(--blue)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.mini{padding:12px;background:var(--pale);border-radius:8px;text-align:center}.mini b{display:block;font-size:23px;color:var(--blue)}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#eef2f7;color:var(--navy)}.btn.green{background:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap}.login{max-width:470px;margin:12vh auto;padding:32px;text-align:center}.error{color:#b42318;background:#fff1f0;border-radius:8px;padding:12px;margin:10px 0}.success{color:#08745d;background:#e8faf5;border-radius:8px;padding:12px;margin:10px 0}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#6b7280;color:#fff;white-space:nowrap}body.ebay-theme th{background:#111827}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--pale);color:var(--blue);font-size:12px;font-weight:800}.badge.done{background:#e6f8f3;color:#08745d}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-title h1,.section-title h2{margin:0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;border-bottom:2px solid var(--line)}.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}.tab.active{background:none;color:var(--blue);border-bottom-color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:26px}.member-row{background:#fff8d8}.invoice-card{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:8px;margin-top:10px}@media(max-width:680px){body{padding:10px}.shell{padding:18px 12px 34px}.topbar{align-items:stretch;flex-direction:column}.brand{font-size:24px}.panel{padding:16px}.metrics{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions .btn{flex:1}.section-title{align-items:flex-start;flex-direction:column}.invoice-card{align-items:flex-start;flex-direction:column}}

</style><style>body.ebay-theme,body.ebay-theme .sub,body.ebay-theme .field label{color:#111827}body.ebay-theme input,body.ebay-theme select,body.ebay-theme textarea{border-color:#111827}body.ebay-theme .panel,body.ebay-theme .card,body.ebay-theme .table-wrap,body.ebay-theme .invoice-card{border-color:#111827}</style></head><body class="ebay-theme"><main class="shell"><section id="loginView" class="panel login"><div class="brand">お気楽便 eBay管理</div><button id="loginBtn" class="btn">Googleでログイン</button><div id="loginError" class="error hidden"></div></section><section id="appView" class="hidden"><header class="topbar"><div><div class="brand">eBay発送代行 管理</div><div id="userEmail" class="sub"></div></div><div class="actions"><a class="btn secondary" href="admin-portal.html">総合トップ</a><a class="btn secondary" href="admin.html">カメラ管理</a><button id="logoutBtn" class="btn secondary">ログアウト</button></div></header><div id="message" class="hidden"></div><div class="grid" style="margin-bottom:18px"><div class="card"><h3>eBay会員</h3><div id="memberCount" class="metric">0</div></div><div class="card"><h3>登録済み</h3><div id="registeredCount" class="metric">0</div></div><div class="card"><h3>未発送</h3><div id="unshippedCount" class="metric">0</div></div><div class="card"><h3>eBay請求書</h3><div id="invoiceCount" class="metric">0</div></div></div><div class="tabs"><button class="btn tab active" data-tab="products">商品・発送</button><button class="btn tab" data-tab="members">eBay会員</button><button class="btn tab" data-tab="invoices">eBay請求書</button></div>
<section id="productsTab" class="panel"><div class="section-title"><h2>eBay商品・発送</h2><span class="badge">カメラ商品とは別管理</span></div><div class="table-wrap"><table><thead><tr><th>会員</th><th>商品</th><th>注文番号／SKU</th><th>会員入力重量</th><th>梱包後情報</th><th>状態</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section id="membersTab" class="panel hidden"><h2>eBay利用会員</h2><div class="table-wrap"><table><thead><tr><th>会員</th><th>メール</th><th>eBay商品数</th><th>利用サービス</th></tr></thead><tbody id="memberRows"></tbody></table></div></section>
<section id="invoicesTab" class="hidden"><div class="panel"><h2>eBay請求書を登録</h2><form id="invoiceForm"><div class="grid"><div class="field"><label>会員 *</label><select name="uid" required></select></div><div class="field"><label>対象月 *</label><input name="month" type="month" required></div><div class="field"><label>請求額 *</label><input name="amount" type="number" min="0" required></div><div class="field"><label>メモ</label><input name="note"></div></div><button class="btn" type="submit">eBay請求書を保存</button></form></div><div class="panel"><div class="section-title"><h2>eBay請求書一覧</h2><span class="badge">独立区分</span></div><div class="table-wrap"><table><thead><tr><th>対象月</th><th>会員</th><th>金額</th><th>受領</th><th>メモ</th></tr></thead><tbody id="invoiceRows"></tbody></table></div></div></section></section></main>
<dialog id="editDialog"><form id="editForm" method="dialog" class="panel" style="max-width:560px;margin:0"><h2>梱包後情報</h2><input type="hidden" name="uid"><input type="hidden" name="id"><div class="grid"><div class="field"><label>梱包後サイズ *</label><input name="packedSize" required placeholder="例：40 × 30 × 20 cm"></div><div class="field"><label>梱包後重量 *</label><input name="packedWeight" required placeholder="例：1.2kg"></div><div class="field"><label>原産国（必要な場合）</label><input name="countryOfOrigin"></div></div><div class="actions"><button class="btn" value="save">保存</button><button class="btn secondary" value="cancel">閉じる</button></div></form></dialog>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get,set,update}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";const c={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"},a=initializeApp(c),auth=getAuth(a),db=getDatabase(a,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),p=new GoogleAuthProvider();let products=[],members=[],invoices={};const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));loginBtn.onclick=()=>signInWithPopup(auth,p).catch(e=>err(e.message));logoutBtn.onclick=()=>signOut(auth);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["products","members","invoices"].forEach(n=>$(`${n}Tab`).classList.toggle("hidden",n!==b.dataset.tab))});onAuthStateChanged(auth,async u=>{if(!u){loginView.classList.remove("hidden");appView.classList.add("hidden");return}try{if((await get(ref(db,`admins/${u.uid}`))).val()!==true)throw Error("管理者権限がありません。");userEmail.textContent=u.email||"";loginView.classList.add("hidden");appView.classList.remove("hidden");await load()}catch(e){err(e.message);await signOut(auth)}});
async function load(){const [m,s,p,i]=await Promise.all([get(ref(db,"members")),get(ref(db,"memberSettings")),get(ref(db,"products")),get(ref(db,"ebayInvoices")).catch(()=>({val:()=>({})}))]),settings=s.val()||{},active=Object.entries(m.val()||{}).filter(([,v])=>v===true).map(([uid])=>uid);members=active.filter(uid=>settings[uid]?.enabledServices?.ebay===true).map(uid=>({uid,...settings[uid]}));products=Object.entries(p.val()||{}).flatMap(([uid,v])=>Object.entries(v||{}).filter(([,x])=>x.serviceType==="ebay").map(([id,x])=>({uid,id,...x})));invoices=i.val()||{};render()}
function render(){memberCount.textContent=members.length;registeredCount.textContent=products.filter(x=>(x.ebayStatus||"registered")==="registered").length;unshippedCount.textContent=products.filter(x=>!["registered","shipped"].includes(x.ebayStatus||"registered")).length;invoiceCount.textContent=Object.values(invoices).reduce((n,v)=>n+Object.keys(v||{}).length,0);productRows.innerHTML=products.length?products.map(x=>`<tr><td>${esc(name(x.uid))}</td><td><b>${esc(x.productName)}</b></td><td>${esc(x.orderNumber)}<br><span class="sub">SKU ${esc(x.sku||"-")}</span></td><td>${esc(x.itemWeight||"-")}</td><td>${esc(x.packedSize||"-")} / ${esc(x.packedWeight||"-")}<br><span class="sub">原産国 ${esc(x.countryOfOrigin||"-")}</span></td><td><span class="badge ${x.ebayStatus==="shipped"?"done":""}">${status(x.ebayStatus)}</span></td><td>${buttons(x)}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">eBay商品はありません。</td></tr>`;memberRows.innerHTML=members.length?members.map(m=>`<tr><td>${esc(name(m.uid))}</td><td>${esc(m.email||"-")}</td><td>${products.filter(x=>x.uid===m.uid).length}</td><td>eBay${m.enabledServices?.camera!==false?"・カメラ":""}</td></tr>`).join(""):`<tr><td colspan="4" class="empty">eBay会員はまだいません。</td></tr>`;invoiceForm.uid.innerHTML=`<option value="">選択してください</option>${members.map(m=>`<option value="${m.uid}">${esc(name(m.uid))}</option>`).join("")}`;const rows=Object.entries(invoices).flatMap(([uid,v])=>Object.entries(v||{}).map(([month,x])=>({uid,month,...x}))).sort((a,b)=>b.month.localeCompare(a.month));invoiceRows.innerHTML=rows.length?rows.map(x=>`<tr class="${x.received?"member-row":""}"><td>${esc(x.month)}</td><td>${esc(name(x.uid))}</td><td>¥${Number(x.amount||0).toLocaleString()}</td><td><label><input type="checkbox" data-received data-uid="${x.uid}" data-month="${x.month}" ${x.received?"checked":""}> 受領済み</label></td><td>${esc(x.note||"")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">eBay請求書はまだありません。</td></tr>`;productRows.querySelectorAll("button[data-action]").forEach(b=>b.onclick=()=>act(b));invoiceRows.querySelectorAll("[data-received]").forEach(c=>c.onchange=async()=>{await update(ref(db,`ebayInvoices/${c.dataset.uid}/${c.dataset.month}`),{received:c.checked,receivedAt:c.checked?Date.now():null,updatedAt:Date.now()});await load()})}
function name(uid){const m=members.find(x=>x.uid===uid);return m?.displayName||m?.name||m?.email||uid}function status(s){return({registered:"登録済み",requested:"発送依頼済み",measured:"梱包情報回答済み",label_received:"ラベル受領済み",shipped:"発送済み"})[s||"registered"]||s}function buttons(x){const edit=`<button class="btn secondary" data-action="edit" data-uid="${x.uid}" data-id="${x.id}">梱包情報</button>`;return x.ebayStatus==="label_received"?`${edit} <button class="btn green" data-action="ship" data-uid="${x.uid}" data-id="${x.id}">発送済み</button>`:edit}async function act(b){const x=products.find(v=>v.uid===b.dataset.uid&&v.id===b.dataset.id);if(b.dataset.action==="ship"){if(!confirm("発送済みにしますか？"))return;await update(ref(db,`products/${x.uid}/${x.id}`),{ebayStatus:"shipped",shippedAt:Date.now(),updatedAt:Date.now()});await load();return}editForm.uid.value=x.uid;editForm.id.value=x.id;editForm.packedSize.value=x.packedSize||"";editForm.packedWeight.value=x.packedWeight||"";editForm.countryOfOrigin.value=x.countryOfOrigin||"";editDialog.showModal()}
editForm.onsubmit=async e=>{e.preventDefault();if(e.submitter?.value==="cancel"){editDialog.close();return}const f=new FormData(e.target);await update(ref(db,`products/${f.get("uid")}/${f.get("id")}`),{packedSize:f.get("packedSize"),packedWeight:f.get("packedWeight"),countryOfOrigin:f.get("countryOfOrigin"),ebayStatus:"measured",measuredAt:Date.now(),updatedAt:Date.now()});editDialog.close();await load()};invoiceForm.onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),uid=f.get("uid"),month=f.get("month");await set(ref(db,`ebayInvoices/${uid}/${month}`),{serviceType:"ebay",month,amount:Number(f.get("amount")),note:f.get("note").trim(),received:false,createdAt:Date.now(),updatedAt:Date.now()});e.target.reset();notice("eBay請求書を保存しました。");await load()};function notice(m){message.className="success";message.textContent=m}function err(m){loginError.textContent=m;loginError.classList.remove("hidden");message.className="error";message.textContent=m}
</script></body></html>
