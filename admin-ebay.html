<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気楽便｜eBay発送代行 管理</title>
<style>
:root{--accent:#4b5563;--dark:#374151;--line:#d9dee8;--muted:#6b7280;--white:#fff;--yellow:#f6c84d}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:14px 12px 48px;font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:#1f2937;background:linear-gradient(135deg,#f7cf62,#e7aa30)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.page{width:min(2000px,100%);min-height:calc(100vh - 28px);margin:auto;padding:28px 18px 48px;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18)}.login{max-width:520px;margin:80px auto;padding:36px;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18)}.brand{margin:0;color:var(--accent);font-size:30px;font-weight:800;letter-spacing:.05em}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}.user,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef2f7;color:#1f2937}.btn.danger{background:#fee2e2;color:#b91c1c}.tabs{display:flex;gap:18px;margin:28px 0 24px;border-bottom:2px solid var(--line);overflow-x:auto}.tab,.manual-tab{flex:none;padding:10px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.section{display:none}.section.show{display:block}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}.card,.panel{border:1px solid var(--line);border-radius:10px;background:#fff;padding:20px}.label,.muted{color:var(--muted);font-size:13px}.value{font-size:32px;color:var(--accent);font-weight:800;margin-top:7px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px}.section-head h2{margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#6b7280;color:#fff;text-align:left;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}.badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#f3f4f6;color:#374151;font-size:12px;font-weight:800}.badge.done{background:#dcfce7;color:#166534}.message{padding:12px;border-radius:8px;margin:12px 0}.error{background:#fff1f1;color:#b42318}.success{background:#ecfdf5;color:#047857}.empty{text-align:center;color:var(--muted);padding:30px}.invoice-received{background:#eef8ff}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.detail-list{display:grid;gap:10px}.detail-item{padding:14px;border:1px solid var(--line);border-radius:8px}.link{color:#374151;font-weight:700}.login .btn{width:100%;margin-top:15px}@media(max-width:700px){body{padding:10px}.page{padding:18px 12px}.topbar{align-items:stretch;flex-direction:column}.user{align-items:stretch;flex-direction:column}.tabs{gap:4px}.tab,.manual-tab{padding:9px 8px;font-size:13px}.actions .btn{flex:1}.stats,.grid{grid-template-columns:1fr}}
</style></head><body><main id="loginView" class="login"><h1 class="brand">お気楽便 eBay管理</h1><p>管理者としてログインしてください。</p><div id="loginError" class="message error hidden"></div><button id="loginBtn" class="btn">Googleで管理者ログイン</button></main>
<main id="appView" class="page hidden"><div id="message" class="message hidden"></div><header class="topbar"><h1 class="brand">お気楽便 eBay発送代行</h1><div class="user"><a class="btn secondary" href="admin-portal.html">総合トップ</a><span id="userEmail"></span><span class="badge">管理者</span><button id="logoutBtn" class="btn secondary">ログアウト</button></div></header>
<nav class="tabs"><button class="tab active" data-tab="members">会員一覧</button><button class="tab" data-tab="detail">会員詳細</button><button class="tab" data-tab="shipping">発送待ち情報</button><button class="tab" data-tab="invoices">請求書</button><button class="tab" data-tab="company">会社情報</button><button class="tab" data-tab="prices">価格表</button><button class="tab" data-tab="confirmation">確認結果ベース</button><button class="tab" data-tab="announcements">お知らせ</button><button class="tab" data-tab="discord">Discord通知</button><a class="manual-tab" href="okirakubin_member_manual.html" target="_blank" rel="noopener">マニュアル</a></nav>
<section id="membersSection" class="section show"><div class="stats"><div class="card"><div class="label">eBay会員</div><div id="memberCount" class="value">0</div></div><div class="card"><div class="label">登録済み</div><div id="registeredCount" class="value">0</div></div><div class="card"><div class="label">未発送</div><div id="unshippedCount" class="value">0</div></div></div><div class="section-head"><h2>eBay会員一覧</h2></div><div class="table-wrap"><table><thead><tr><th>会員番号</th><th>識別名</th><th>会員</th><th>商品数</th><th>操作</th></tr></thead><tbody id="memberRows"></tbody></table></div></section>
<section id="detailSection" class="section"><div class="section-head"><h2 id="detailTitle">会員詳細</h2></div><div id="detailEmpty" class="empty">会員一覧から会員を選択してください。</div><div id="detailContent" class="hidden"><div id="detailMeta" class="panel" style="margin-bottom:16px"></div><div id="detailProducts" class="detail-list"></div></div></section>
<section id="shippingSection" class="section"><div class="section-head"><h2>発送待ち情報</h2></div><div class="table-wrap"><table><thead><tr><th>会員</th><th>商品</th><th>注文番号／SKU</th><th>商品重量</th><th>梱包後情報</th><th>状態</th><th>操作</th></tr></thead><tbody id="shippingRows"></tbody></table></div></section>
<section id="invoicesSection" class="section"><div class="panel"><h2>eBay請求書を登録</h2><form id="invoiceForm"><div class="grid"><div class="field"><label>会員 *</label><select name="uid" required></select></div><div class="field"><label>対象月 *</label><input name="month" type="month" required></div><div class="field"><label>請求額 *</label><input name="amount" type="number" min="0" required></div><div class="field"><label>メモ</label><input name="note"></div></div><button class="btn">保存</button></form></div><div class="panel" style="margin-top:16px"><div class="section-head"><h2>eBay請求書一覧</h2><span id="invoiceCount" class="badge">0件</span></div><div class="table-wrap"><table><thead><tr><th>対象月</th><th>会員</th><th>金額</th><th>受領済み</th><th>メモ</th></tr></thead><tbody id="invoiceRows"></tbody></table></div></div></section>
<section id="companySection" class="section"><div class="panel"><h2>会社情報</h2><div id="companyContent" style="white-space:pre-wrap;line-height:1.8"></div></div></section><section id="pricesSection" class="section"><div class="panel"><h2>価格表</h2><div id="pricesContent" class="detail-list"></div></div></section><section id="confirmationSection" class="section"><div class="panel"><h2>確認結果ベース</h2><div id="confirmationContent" style="white-space:pre-wrap;line-height:1.8"></div></div></section><section id="announcementsSection" class="section"><div class="panel"><h2>お知らせ</h2><div id="announcementContent" class="detail-list"></div></div></section><section id="discordSection" class="section"><div class="panel"><h2>Discord通知</h2><p class="muted">eBay会員ごとの通知設定を確認できます。</p><div id="discordContent" class="detail-list"></div></div></section></main>
<dialog id="editDialog"><form id="editForm" method="dialog" class="panel" style="width:min(560px,90vw)"><h2>梱包後情報</h2><input type="hidden" name="uid"><input type="hidden" name="id"><div class="field"><label>梱包後サイズ *</label><input name="packedSize" required></div><div class="field"><label>梱包後重量 *</label><input name="packedWeight" required></div><div class="field"><label>原産国</label><input name="countryOfOrigin"></div><div class="actions"><button class="btn" value="save">保存</button><button class="btn secondary" value="cancel">閉じる</button></div></form></dialog>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get,set,update}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const cfg={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"};const firebaseApp=initializeApp(cfg),auth=getAuth(firebaseApp),db=getDatabase(firebaseApp,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),provider=new GoogleAuthProvider();let members=[],products=[],invoices={},selectedUid="",shared={};const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
$("loginBtn").onclick=()=>signInWithPopup(auth,provider).catch(e=>showError(e.message));$("logoutBtn").onclick=()=>signOut(auth);document.querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>showTab(button.dataset.tab));function showTab(name){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));document.querySelectorAll(".section").forEach(s=>s.classList.remove("show"));$(`${name}Section`)?.classList.add("show")}
onAuthStateChanged(auth,async user=>{if(!user){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");return}try{if((await get(ref(db,`admins/${user.uid}`))).val()!==true)throw Error("管理者権限がありません。");$("userEmail").textContent=user.email||"";$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");await load()}catch(e){showError(e.message);await signOut(auth)}});
async function load(){const [m,s,p,i,company,prices,confirmation,announcements]=await Promise.all([get(ref(db,"members")),get(ref(db,"memberSettings")),get(ref(db,"products")),get(ref(db,"ebayInvoices")).catch(()=>({val:()=>({})})),get(ref(db,"settings/companyInfo")).catch(()=>({val:()=>({})})),get(ref(db,"priceTable")).catch(()=>({val:()=>({})})),get(ref(db,"settings/confirmationTemplateBase")).catch(()=>({val:()=>({})})),get(ref(db,"announcements")).catch(()=>({val:()=>({})}))]);const settings=s.val()||{},active=Object.entries(m.val()||{}).filter(([,v])=>v===true).map(([uid])=>uid);members=active.filter(uid=>settings[uid]?.enabledServices?.ebay===true).map(uid=>({uid,...settings[uid]}));products=Object.entries(p.val()||{}).flatMap(([uid,v])=>Object.entries(v||{}).filter(([,x])=>x.serviceType==="ebay").map(([id,x])=>({uid,id,...x})));invoices=i.val()||{};shared={company:company.val()||{},prices:prices.val()||{},confirmation:confirmation.val()||{},announcements:announcements.val()||{}};render()}
function render(){$("memberCount").textContent=members.length;$("registeredCount").textContent=products.filter(x=>(x.ebayStatus||"registered")==="registered").length;$("unshippedCount").textContent=products.filter(x=>!["registered","shipped"].includes(x.ebayStatus||"registered")).length;$("memberRows").innerHTML=members.length?members.map(m=>`<tr><td>${esc(m.managementNumber||"-")}</td><td>${esc(m.adminDisplayName||"-")}</td><td><b>${esc(memberName(m))}</b><div class="muted">${esc(m.email||"")}</div></td><td>${products.filter(x=>x.uid===m.uid).length}</td><td><button class="btn secondary" data-member="${m.uid}">詳細</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">eBay会員はいません。</td></tr>`;document.querySelectorAll("[data-member]").forEach(b=>b.onclick=()=>selectMember(b.dataset.member));renderShipping();renderInvoices();renderShared();if(selectedUid)renderDetail()}
function memberName(m){return m?.name||m?.displayName||m?.email||m?.uid||"-"}function name(uid){return memberName(members.find(m=>m.uid===uid))}function status(s){return({registered:"登録済み",requested:"発送依頼済み",measured:"梱包情報確認済み",label_received:"ラベル受領済み",shipped:"発送済み"})[s||"registered"]||s}function selectMember(uid){selectedUid=uid;renderDetail();showTab("detail")}
function renderDetail(){const m=members.find(x=>x.uid===selectedUid),list=products.filter(x=>x.uid===selectedUid);if(!m)return;$("detailEmpty").classList.add("hidden");$("detailContent").classList.remove("hidden");$("detailTitle").textContent=`会員詳細｜${memberName(m)}`;$("detailMeta").innerHTML=`<div class="detail-grid"><div><span class="label">会員番号</span><br><b>${esc(m.managementNumber||"-")}</b></div><div><span class="label">識別名</span><br><b>${esc(m.adminDisplayName||"-")}</b></div><div><span class="label">メール</span><br>${esc(m.email||"-")}</div></div>`;$("detailProducts").innerHTML=list.length?list.map(x=>`<div class="detail-item"><b>${esc(x.productName)}</b><div class="muted">注文番号 ${esc(x.orderNumber)} ／ SKU ${esc(x.sku||"-")}</div><div>商品重量 ${esc(x.itemWeight||"-")} ／ 梱包後 ${esc(x.packedSize||"-")}・${esc(x.packedWeight||"-")}</div><span class="badge">${status(x.ebayStatus)}</span></div>`).join(""):`<div class="empty">商品はありません。</div>`}
function renderShipping(){const list=products.filter(x=>!["registered","shipped"].includes(x.ebayStatus||"registered"));$("shippingRows").innerHTML=list.length?list.map(x=>`<tr><td>${esc(name(x.uid))}</td><td><b>${esc(x.productName)}</b></td><td>${esc(x.orderNumber)}<div class="muted">SKU ${esc(x.sku||"-")}</div></td><td>${esc(x.itemWeight||"-")}</td><td>${esc(x.packedSize||"-")} / ${esc(x.packedWeight||"-")}<div class="muted">原産国 ${esc(x.countryOfOrigin||"-")}</div></td><td><span class="badge ${x.ebayStatus==="shipped"?"done":""}">${status(x.ebayStatus)}</span></td><td><button class="btn secondary" data-edit="${x.uid}|${x.id}">梱包情報</button>${x.ebayStatus==="label_received"?` <button class="btn" data-ship="${x.uid}|${x.id}">発送済み</button>`:""}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">発送待ち商品はありません。</td></tr>`;document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(...b.dataset.edit.split("|")));document.querySelectorAll("[data-ship]").forEach(b=>b.onclick=()=>ship(...b.dataset.ship.split("|")))}
function renderInvoices(){const rows=Object.entries(invoices).flatMap(([uid,v])=>Object.entries(v||{}).map(([month,x])=>({uid,month,...x}))).sort((a,b)=>b.month.localeCompare(a.month));$("invoiceCount").textContent=`${rows.length}件`;$("invoiceRows").innerHTML=rows.length?rows.map(x=>`<tr class="${x.received?"invoice-received":""}"><td>${esc(x.month)}</td><td>${esc(name(x.uid))}</td><td>${Number(x.amount||0).toLocaleString()}円</td><td><label><input type="checkbox" data-received="${x.uid}|${x.month}" ${x.received?"checked":""}> 受領済み</label></td><td>${esc(x.note||"")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">eBay請求書はありません。</td></tr>`;$("invoiceForm").uid.innerHTML=`<option value="">選択してください</option>${members.map(m=>`<option value="${m.uid}">${esc(memberName(m))}</option>`).join("")}`;document.querySelectorAll("[data-received]").forEach(c=>c.onchange=async()=>{const[uid,month]=c.dataset.received.split("|");await update(ref(db,`ebayInvoices/${uid}/${month}`),{received:c.checked,receivedAt:c.checked?Date.now():null,updatedAt:Date.now()});await load()})}
function renderShared(){const company=shared.company||{};$("companyContent").textContent=Object.entries(company).map(([k,v])=>`${k}：${typeof v==="object"?JSON.stringify(v):v}`).join("\n")||"会社情報は未登録です。";$("pricesContent").innerHTML=Object.keys(shared.prices||{}).length?`<div class="detail-item"><pre style="white-space:pre-wrap">${esc(JSON.stringify(shared.prices,null,2))}</pre></div>`:`<div class="empty">価格情報は未登録です。</div>`;$("confirmationContent").textContent=Object.keys(shared.confirmation||{}).length?JSON.stringify(shared.confirmation,null,2):"確認結果ベースは未登録です。";const notices=Object.values(shared.announcements||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$("announcementContent").innerHTML=notices.length?notices.map(n=>`<div class="detail-item"><b>${esc(n.title||"お知らせ")}</b><div>${esc(n.message||n.content||"")}</div></div>`).join(""):`<div class="empty">お知らせはありません。</div>`;$("discordContent").innerHTML=members.map(m=>`<div class="detail-item"><b>${esc(memberName(m))}</b><div class="muted">検品・発送通知：${m.discordWebhookUrl?"設定済み":"未設定"} ／ ラベル通知：${m.discordLabelWebhookUrl?"設定済み":"未設定"}</div></div>`).join("")||`<div class="empty">eBay会員はいません。</div>`}
function openEdit(uid,id){const x=products.find(p=>p.uid===uid&&p.id===id);$("editForm").uid.value=uid;$("editForm").id.value=id;$("editForm").packedSize.value=x?.packedSize||"";$("editForm").packedWeight.value=x?.packedWeight||"";$("editForm").countryOfOrigin.value=x?.countryOfOrigin||"";$("editDialog").showModal()}async function ship(uid,id){if(!confirm("発送済みにしますか？"))return;await update(ref(db,`products/${uid}/${id}`),{ebayStatus:"shipped",shippedAt:Date.now(),updatedAt:Date.now()});await load()}
$("editForm").onsubmit=async e=>{e.preventDefault();if(e.submitter?.value==="cancel"){$("editDialog").close();return}const f=new FormData(e.target);await update(ref(db,`products/${f.get("uid")}/${f.get("id")}`),{packedSize:f.get("packedSize"),packedWeight:f.get("packedWeight"),countryOfOrigin:f.get("countryOfOrigin"),ebayStatus:"measured",measuredAt:Date.now(),updatedAt:Date.now()});$("editDialog").close();await load()};$("invoiceForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await set(ref(db,`ebayInvoices/${f.get("uid")}/${f.get("month")}`),{serviceType:"ebay",month:f.get("month"),amount:Number(f.get("amount")),note:String(f.get("note")||"").trim(),received:false,createdAt:Date.now(),updatedAt:Date.now()});e.target.reset();showMessage("eBay請求書を保存しました。");await load()};function showMessage(t){$("message").textContent=t;$("message").className="message success"}function showError(t){$("loginError").textContent=t;$("loginError").classList.remove("hidden");$("message").textContent=t;$("message").className="message error"}
</script></body></html>
