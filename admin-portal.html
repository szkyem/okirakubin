<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>お気楽便｜管理総合トップ</title>
  <link rel="stylesheet" href="service-common.css">
</head>
<body>
<main class="shell">
  <section id="loginView" class="panel login">
    <div class="brand">お気楽便</div>
    <p>管理者としてログインしてください。</p>
    <button id="loginBtn" class="btn">Googleで管理者ログイン</button>
    <div id="loginError" class="error hidden"></div>
  </section>

  <section id="appView" class="hidden">
    <header class="topbar">
      <div><div class="brand">お気楽便 管理総合トップ</div><div id="userEmail" class="sub"></div></div>
      <button id="logoutBtn" class="btn secondary">ログアウト</button>
    </header>

    <section class="panel">
      <div class="section-title">
        <div><h1>サービス管理</h1><div class="sub">カメラとeBay発送代行を分けて確認できます。</div></div>
        <div class="mini"><b id="allMembers">0</b>会員（全体）</div>
      </div>
      <div id="serviceCards" class="grid"></div>
    </section>

    <section class="panel">
      <div class="section-title"><div><h2>会員管理</h2><div class="sub">サービス共通の会員手続きを管理します。</div></div></div>
      <div class="grid">
        <a class="card" href="admin.html?view=pendingMembers">
          <h3>会員仮登録</h3><div id="pendingCount" class="metric">0</div>
          <p class="sub">申請内容の確認、利用サービスの指定、会員登録を行います。</p><span class="btn">仮登録一覧を開く</span>
        </a>
        <a class="card" href="admin.html?view=inactiveMembers">
          <h3>非会員一覧</h3><div id="inactiveCount" class="metric">0</div>
          <p class="sub">停止中の会員確認と再有効化を行います。</p><span class="btn">非会員一覧を開く</span>
        </a>
      </div>
    </section>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const config={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"};
const firebaseApp=initializeApp(config);
const auth=getAuth(firebaseApp);
const db=getDatabase(firebaseApp,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app");
const provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);

$("loginBtn").onclick=()=>signInWithPopup(auth,provider).catch(error=>showError(error.message));
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(!user){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");return;}
  try{
    if((await get(ref(db,`admins/${user.uid}`))).val()!==true) throw new Error("管理者権限がありません。");
    const [members,settings,products,invoices,ebayInvoices,pending,inactive]=await Promise.all([
      get(ref(db,"members")),get(ref(db,"memberSettings")),get(ref(db,"products")),get(ref(db,"invoices")),
      get(ref(db,"ebayInvoices")).catch(()=>({val:()=>({})})),get(ref(db,"pendingMembers")),get(ref(db,"inactiveMembers"))
    ]);
    const active=Object.entries(members.val()||{}).filter(([,value])=>value===true).map(([uid])=>uid);
    const memberSettings=settings.val()||{};
    const allProducts=Object.values(products.val()||{}).flatMap(value=>Object.values(value||{}));
    const cameraProducts=allProducts.filter(item=>item.serviceType!=="ebay");
    const ebayProducts=allProducts.filter(item=>item.serviceType==="ebay");
    const cameraMembers=active.filter(uid=>memberSettings[uid]?.enabledServices?.camera!==false).length;
    const ebayMembers=active.filter(uid=>memberSettings[uid]?.enabledServices?.ebay===true).length;
    $("allMembers").textContent=active.length;
    $("pendingCount").textContent=Object.keys(pending.val()||{}).length;
    $("inactiveCount").textContent=Object.values(inactive.val()||{}).filter(Boolean).length;
    $("serviceCards").innerHTML=
      serviceCard("カメラ管理","admin.html",cameraMembers,cameraProducts.filter(item=>!item.shippingRequest&&!item.shootingDate).length,cameraProducts.filter(item=>item.shippingRequest&&item.status!=="shipped").length,countInvoices(invoices.val()))+
      serviceCard("eBay管理","admin-ebay.html",ebayMembers,ebayProducts.filter(item=>(item.ebayStatus||"registered")==="registered").length,ebayProducts.filter(item=>!["registered","shipped"].includes(item.ebayStatus||"registered")).length,countInvoices(ebayInvoices.val()));
    $("userEmail").textContent=user.email||"";
    $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");
  }catch(error){showError(error.message);await signOut(auth);}
});

function countInvoices(data){return Object.values(data||{}).reduce((total,value)=>total+Object.keys(value||{}).length,0);}
function serviceCard(name,url,members,registered,unshipped,invoices){return `<a class="card" href="${url}"><h2>${name}</h2><div class="metrics"><div class="mini"><b>${members}</b>会員</div><div class="mini"><b>${registered}</b>登録済み</div><div class="mini"><b>${unshipped}</b>未発送</div></div><div class="mini"><b>${invoices}</b>請求書</div><div style="margin-top:16px"><span class="btn">${name}を開く</span></div></a>`;}
function showError(message){$("loginError").textContent=message;$("loginError").classList.remove("hidden");}
</script>
</body>
</html>
