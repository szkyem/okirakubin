<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";const c={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"},a=initializeApp(c),auth=getAuth(a),db=getDatabase(a,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),p=new GoogleAuthProvider(),$=id=>document.getElementById(id);loginBtn.onclick=()=>signInWithPopup(auth,p).catch(e=>err(e.message));logoutBtn.onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{if(!u){loginView.classList.remove("hidden");appView.classList.add("hidden");return}try{if((await get(ref(db,`admins/${u.uid}`))).val()!==true)throw Error("管理者権限がありません。");const [members,settings,products,invoices,ebayInvoices]=await Promise.all([get(ref(db,"members")),get(ref(db,"memberSettings")),get(ref(db,"products")),get(ref(db,"invoices")),get(ref(db,"ebayInvoices")).catch(()=>({val:()=>({})}))]);const active=Object.entries(members.val()||{}).filter(([,v])=>v===true).map(([id])=>id),s=settings.val()||{},all=Object.values(products.val()||{}).flatMap(v=>Object.values(v||{})),camera=all.filter(x=>x.serviceType!=="ebay"),ebay=all.filter(x=>x.serviceType==="ebay"),camMembers=active.filter(id=>(s[id]?.enabledServices?.camera)!==false).length,ebayMembers=active.filter(id=>s[id]?.enabledServices?.ebay===true).length;allMembers.textContent=active.length;serviceCards.innerHTML=card("カメラ管理","admin.html",camMembers,camera.filter(x=>!x.shippingRequest&&!x.shootingDate).length,camera.filter(x=>x.shippingRequest&&x.status!=="shipped").len
