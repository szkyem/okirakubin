<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気楽便｜サービス選択</title><link rel="stylesheet" href="service-common.css"></head><body>
<main class="shell"><section id="login" class="panel login"><div class="brand">お気楽便</div><p>会員ページへログインしてください。</p><button id="loginBtn" class="btn">Googleでログイン</button><div id="loginError" class="error hidden"></div></section>
<section id="app" class="hidden"><header class="topbar"><div><div class="brand">お気楽便 総合トップ</div><div id="email" class="sub"></div></div><button id="logoutBtn" class="btn secondary">ログアウト</button></header><div class="panel"><h1 style="margin-top:0">利用するサービスを選択</h1><p class="sub">カメラとeBay発送代行は、商品・発送・請求書を分けて管理します。</p><div id="cards" class="grid"></div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const config={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"};const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);loginBtn.onclick=()=>signInWithPopup(auth,provider).catch(e=>show(e.message));logoutBtn.onclick=()=>signOut(auth);function show(m){loginError.textContent=m;loginError.classList.remove("hidden")};
onAuthStateChanged(auth,async user=>{if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}try{const [member,settings,products,invoices,ebayInvoices]=await Promise.all([get(ref(db,`members/${user.uid}`)),get(ref(db,`memberSettings/${user.uid}`)),get(ref(db,`products/${user.uid}`)),get(ref(db,`invoices/${user.uid}`)),get(ref(db,`ebayInvoices/${user.uid}`))]);if(member.val()!==true)throw new Error("このアカウントは会員登録されていません。");const s=settings.val()||{},services=s.enabledServices||{camera:true,ebay:false};if(services.camera!==false&&!services.ebay){location.replace("member.html");return}if(services.camera===false&&services.ebay){location.replace("member-ebay.html");return}const list=Object.values(products.val()||{}),camera=list.filter(x=>x.serviceType!=="ebay"),ebay=list.filter(x=>x.serviceType==="ebay");$("email").textContent=user.email||"";$("cards").innerHTML=`${serviceCard("カメラ発送代行","member.html",camera.filter(x=>!x.shippingRequest&&!x.shootingDate).length,camera.filter(x=>x.shippingRequest&&x.status!=="shipped").length,Object.keys(invoices.val()||{}).length)}${serviceCard("eBay発送代行","member-ebay.html",ebay.filter(x=>(x.ebayStatus||"registered")==="registered").length,ebay.filter(x=>!["registered","shipped"].includes(x.ebayStatus||"registered")).length,Object.keys(ebayInvoices.val()||{}).length)}`;$("login").classList.add("hidden");$("app").classList.remove("hidden")}catch(e){show(e.message);await signOut(auth)}});
function serviceCard(name,url,registered,unshipped,invoices){return`<a class="card" href="${url}"><h2>${name}</h2><div class="metrics"><div class="mini"><b>${registered}</b>登録済み</div><div class="mini"><b>${unshipped}</b>未発送</div><div class="mini"><b>${invoices}</b>請求書</div></div><span class="btn">管理画面を開く</span></a>`}
</script></body></html>
