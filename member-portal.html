<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気楽便｜サービス選択</title><style>
:root{--navy:#0f172a;--blue:#2563eb;--pale:#eff6ff;--line:#d9dee8;--ink:#0f172a;--muted:#64748b;--green:#16836b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:linear-gradient(135deg,#4f7df3 0%,#7551b8 100%);padding:14px 12px 48px}body.ebay-theme{--blue:#b77900;--pale:#fff8d8;--navy:#5c4100;--line:#eadba5;background:linear-gradient(135deg,#f7c948 0%,#e5a62f 100%)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{width:min(1400px,100%);min-height:calc(100vh - 28px);margin:auto;padding:28px 22px 48px;background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(15,23,42,.18)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{font-size:30px;font-weight:800;letter-spacing:.05em;color:var(--blue)}.sub{color:var(--muted);font-size:13px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 18px rgba(30,64,110,.06)}.panel{padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:20px;text-decoration:none;color:inherit;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#9bc5ee;box-shadow:0 8px 22px rgba(37,99,235,.1)}body.ebay-theme .card:hover{border-color:#d9ad3b;box-shadow:0 8px 22px rgba(183,121,0,.14)}.card h2,.card h3{margin:0 0 10px;color:var(--navy)}.metric{font-size:32px;font-weight:800;color:var(--blue)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.mini{padding:12px;background:var(--pale);border-radius:8px;text-align:center}.mini b{display:block;font-size:23px;color:var(--blue)}.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#eef2f7;color:var(--navy)}.btn.green{background:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap}.login{max-width:470px;margin:12vh auto;padding:32px;text-align:center}.error{color:#b42318;background:#fff1f0;border-radius:8px;padding:12px;margin:10px 0}.success{color:#08745d;background:#e8faf5;border-radius:8px;padding:12px;margin:10px 0}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#6b7280;color:#fff;white-space:nowrap}body.ebay-theme th{background:#8a650c}.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--pale);color:var(--blue);font-size:12px;font-weight:800}.badge.done{background:#e6f8f3;color:#08745d}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-title h1,.section-title h2{margin:0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;border-bottom:2px solid var(--line)}.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}.tab.active{background:none;color:var(--blue);border-bottom-color:var(--blue)}.empty{text-align:center;color:var(--muted);padding:26px}.member-row{background:#fff8d8}.invoice-card{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:8px;margin-top:10px}@media(max-width:680px){body{padding:10px}.shell{padding:18px 12px 34px}.topbar{align-items:stretch;flex-direction:column}.brand{font-size:24px}.panel{padding:16px}.metrics{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions .btn{flex:1}.section-title{align-items:flex-start;flex-direction:column}.invoice-card{align-items:flex-start;flex-direction:column}}

</style></head><body>
<main class="shell"><section id="login" class="panel login"><div class="brand">お気楽便</div><p>会員ページへログインしてください。</p><button id="loginBtn" class="btn">Googleでログイン</button><div id="loginError" class="error hidden"></div></section>
<section id="app" class="hidden"><header class="topbar"><div><div class="brand">お気楽便 総合トップ</div><div id="email" class="sub"></div></div><button id="logoutBtn" class="btn secondary">ログアウト</button></header><div class="panel"><h1 style="margin-top:0">利用するサービスを選択</h1><p class="sub">カメラとeBay発送代行は、商品・発送・請求書を分けて管理します。</p><div id="cards" class="grid"></div></div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import{getDatabase,ref,get}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const config={apiKey:"AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",authDomain:"okirakubin-manager.firebaseapp.com",projectId:"okirakubin-manager",storageBucket:"okirakubin-manager.firebasestorage.app",messagingSenderId:"387991576787",appId:"1:387991576787:web:db731b898f46dc8214f426"};const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app,"https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"),provider=new GoogleAuthProvider();
await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);loginBtn.onclick=()=>signInWithPopup(auth,provider).catch(e=>show(e.message));logoutBtn.onclick=()=>signOut(auth);function show(m){loginError.textContent=m;loginError.classList.remove("hidden")};
onAuthStateChanged(auth,async user=>{if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");return}try{const [member,settings,products,invoices,ebayInvoices]=await Promise.all([get(ref(db,`members/${user.uid}`)),get(ref(db,`memberSettings/${user.uid}`)),get(ref(db,`products/${user.uid}`)),get(ref(db,`invoices/${user.uid}`)),get(ref(db,`ebayInvoices/${user.uid}`)).catch(()=>({val:()=>({})}))]);if(member.val()!==true)throw new Error("このアカウントは会員登録されていません。");const s=settings.val()||{},services=s.enabledServices||{camera:true,ebay:false};if(services.camera!==false&&!services.ebay){location.replace("member.html");return}if(services.camera===false&&services.ebay){location.replace("member-ebay.html");return}const list=Object.values(products.val()||{}),camera=list.filter(x=>x.serviceType!=="ebay"),ebay=list.filter(x=>x.serviceType==="ebay");$("email").textContent=user.email||"";$("cards").innerHTML=`${serviceCard("カメラ発送代行","member.html",camera.filter(x=>!x.shippingRequest&&!x.shootingDate).length,camera.filter(x=>x.shippingRequest&&x.status!=="shipped").length,Object.keys(invoices.val()||{}).length)}${serviceCard("eBay発送代行","member-ebay.html",ebay.filter(x=>(x.ebayStatus||"registered")==="registered").length,ebay.filter(x=>!["registered","shipped"].includes(x.ebayStatus||"registered")).length,Object.keys(ebayInvoices.val()||{}).length)}`;$("login").classList.add("hidden");$("app").classList.remove("hidden")}catch(e){show(e.message);$("login").classList.add("hidden");$("app").classList.remove("hidden")}});
function serviceCard(name,url,registered,unshipped,invoices){return`<a class="card" href="${url}"><h2>${name}</h2><div class="metrics"><div class="mini"><b>${registered}</b>登録済み</div><div class="mini"><b>${unshipped}</b>未発送</div><div class="mini"><b>${invoices}</b>請求書</div></div><span class="btn">管理画面を開く</span></a>`}
</script></body></html>
