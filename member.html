<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おきらく便 - 会員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px}
button,input,textarea,select{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#1f2937}
button.secondary:hover{background:#dfe7f1}
button.danger{background:#fee2e2;color:#b91c1c}
button.danger:hover{background:#fecaca}
.container{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;max-width:1280px;margin:0 auto}
.login-container{max-width:520px;margin:80px auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px}
.login-title{font-size:28px;font-weight:800;color:#2563eb;margin-bottom:12px}
.login-text{color:#6b7280;margin-bottom:24px;line-height:1.7}
.login-button{width:100%;font-size:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;color:#2563eb}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800}
.logout{background:#eef2f7;color:#1f2937}
.tabs{display:flex;gap:10px;border-bottom:2px solid #e5e7eb;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.section{display:none}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat,.form{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:20px}
.stat-label{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:#2563eb}
.form{margin-top:16px}
.form-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.product-entry{border:1px solid #dbe3ef;border-radius:10px;background:#f8fafc;padding:18px;margin-bottom:16px}
.product-entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.product-entry-title{font-weight:800;color:#1f2937}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-group{margin-bottom:16px}
.form-group.full{grid-column:1/-1}
label{display:block;margin-bottom:8px;font-weight:700}
input,textarea,select{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:10px;font-size:14px;background:#fff}
textarea{min-height:88px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
.products-table{width:100%;border-collapse:collapse;min-width:980px}
.products-table th{background:#6b7280;color:#fff;text-align:left;font-size:13px;padding:10px 12px;white-space:nowrap}
.products-table td{border-top:1px solid #e5e7eb;padding:10px 12px;vertical-align:middle;font-size:14px}
.products-table tr:nth-child(even){background:#fafafa}
.shipping-cell{background:#fffde7;text-align:center;min-width:92px}
.shipping-check{width:auto}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.domestic{background:#dbeafe;color:#1d4ed8}
.status-pill.overseas{background:#dcfce7;color:#15803d}
.status-pill.return{background:#fee2e2;color:#b91c1c}
.status-pill.none{background:#f3f4f6;color:#6b7280}
.compact-btn{padding:7px 10px;font-size:12px}
.ship-filter{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px}
.ship-filter-btn{background:#fff;color:#9ca3af;border-bottom:2px solid #d1d5db;border-radius:0;min-width:160px}
.ship-filter-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.ship-filter-btn:hover{background:#f8fafc}
.bulk-action-bar{display:none;position:sticky;bottom:0;margin-top:12px;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 24px rgba(15,23,42,.12);z-index:5}
.bulk-action-bar.show{display:grid}
.bulk-btn{border-radius:0;padding:18px 12px;font-size:15px}
.bulk-btn.domestic{background:#334155}
.bulk-btn.overseas{background:#5acb88}
.bulk-btn.return{background:#f59e0b}
.origin-list{display:grid;gap:12px;margin-top:18px}
.origin-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;background:#fff}
.origin-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.origin-title{font-weight:800}
.origin-meta{font-size:13px;color:#4b5563;line-height:1.7}
.empty{padding:32px;text-align:center;color:#6b7280}
.error{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6}
.error.show{display:block}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.modal-body{line-height:1.8;white-space:pre-wrap}
.detail-section{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.detail-heading{font-weight:800;color:#2563eb;margin-bottom:8px}
.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.detail-label{color:#6b7280;font-weight:700}
.modal-form{display:grid;gap:14px}
.modal-section-title{background:#eaf2ff;color:#1d4ed8;font-weight:800;padding:9px 12px;margin:8px 0}
.required{display:inline-block;background:#ef4444;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;margin-left:8px}
.announcement-list{display:grid;gap:12px}
.announcement-card{border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc;padding:14px}
.announcement-date{color:#6b7280;font-size:12px;font-weight:800;margin-bottom:6px}
.announcement-message{font-weight:700;line-height:1.7;white-space:pre-wrap}
.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inquiry-box{display:flex;align-items:center;gap:8px;white-space:nowrap}
@media(max-width:700px){body{padding:16px}.container,.login-container{padding:24px}.header{align-items:stretch;flex-direction:column}.logout{width:100%}.form-grid{grid-template-columns:1fr}.ship-filter-btn{min-width:120px}.bulk-action-bar{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="login-container" id="loginArea">
  <div class="error" id="loginError"></div>
  <h1 class="login-title">おきらく便</h1>
  <p class="login-text">会員としてログインしてください。</p>
  <button class="login-button" id="loginBtn" type="button">Googleで会員ログイン</button>
</section>

<div class="container hidden" id="appArea">
  <div class="error" id="errorMessage"></div>

  <header class="header">
    <h1 class="title">おきらく便</h1>
    <div class="user">
      <span id="userEmail"></span>
      <span class="badge">会員</span>
      <button class="logout" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" type="button">トップ</button>
    <button class="tab" data-tab="register" type="button">商品登録</button>
    <button class="tab" data-tab="stored" type="button">保管商品</button>
    <button class="tab" data-tab="shipping" type="button">発送管理</button>
    <button class="tab" data-tab="origins" type="button">発送元登録</button>
  </nav>

  <section class="section show" id="overview">
    <div class="grid">
      <div class="stat"><div class="stat-label">登録済み商品</div><div class="stat-value" id="productCount">0</div></div>
      <div class="stat"><div class="stat-label">保管商品</div><div class="stat-value" id="storedCount">0</div></div>
      <div class="stat"><div class="stat-label">未発送</div><div class="stat-value" id="unshippedCount">0</div></div>
      <div class="stat"><div class="stat-label">発送済み</div><div class="stat-value" id="shippedCount">0</div></div>
    </div>

    <h2 style="margin-bottom:16px;">最近のお知らせ</h2>
    <div id="recentAnnouncements"></div>
  </section>

  <section class="section" id="register">
    <div class="form">
      <div class="form-header">
        <h2>商品を登録する</h2>
        <button class="secondary" id="addEntryBtn" type="button">追加</button>
      </div>

      <form id="productForm">
        <div id="productEntries"></div>
        <button type="submit" style="width:100%;">登録する</button>
      </form>
    </div>
  </section>

  <section class="section" id="stored">
    <h2 style="margin-bottom:16px;">保管商品</h2>

    <div class="ship-filter">
      <button class="ship-filter-btn active" id="storedFilterBtn" type="button">保管商品</button>
      <button class="ship-filter-btn" id="registeredStoredFilterBtn" type="button">登録済み商品</button>
    </div>

    <div id="storedList"></div>
  </section>

  <section class="section" id="shipping">
    <h2 style="margin-bottom:16px;">発送管理</h2>
    <div class="ship-filter">
      <button class="ship-filter-btn active" id="unshippedFilterBtn" type="button">未発送</button>
      <button class="ship-filter-btn" id="shippedFilterBtn" type="button">発送済み</button>
    </div>
    <div id="shippingList"></div>
  </section>

  <section class="section" id="origins">
    <div class="form">
      <div class="form-header">
        <h2>発送元を登録する</h2>
        <button class="secondary" id="clearOriginBtn" type="button">追加</button>
      </div>

      <form id="originForm">
        <input type="hidden" id="originId">

        <div class="form-grid">
          <div class="form-group">
            <label>発送元名 *</label>
            <input id="originName" type="text" required placeholder="例：自宅 / 倉庫A">
          </div>

          <div class="form-group">
            <label>郵便番号 *</label>
            <input id="originPostalCode" type="text" required placeholder="例：4370021">
          </div>

          <div class="form-group">
            <label>都道府県 *</label>
            <input id="originPrefecture" type="text" required placeholder="例：静岡県">
          </div>

          <div class="form-group">
            <label>住所 *</label>
            <input id="originAddress" type="text" required placeholder="例：袋井市広岡1290-8">
          </div>

          <div class="form-group">
            <label>アパート名、会社名など</label>
            <input id="originBuilding" type="text">
          </div>

          <div class="form-group">
            <label>お名前 *</label>
            <input id="originSenderName" type="text" required>
          </div>

          <div class="form-group">
            <label>電話番号</label>
            <input id="originPhone" type="text">
          </div>
        </div>

        <button type="submit" style="width:100%;">保存する</button>
      </form>
    </div>

    <div class="origin-list" id="originList"></div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="secondary compact-btn" id="modalCloseBtn" type="button">閉じる</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="shippingModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="shippingModalTitle">発送先情報</div>
      <button class="secondary compact-btn" id="shippingModalCloseBtn" type="button">閉じる</button>
    </div>

    <form class="modal-form" id="shippingForm">
      <input type="hidden" id="shippingRequestType">

      <div class="modal-section-title">発送先住所</div>

      <div class="form-grid">
        <div class="form-group">
          <label>宛名 <span class="required">必須</span></label>
          <input id="destName" type="text" required>
        </div>

        <div class="form-group">
          <label>郵便番号 <span class="required">必須</span></label>
          <input id="destPostalCode" type="text" required>
        </div>

        <div class="form-group">
          <label>都道府県 <span class="required">必須</span></label>
          <input id="destPrefecture" type="text" required>
        </div>

        <div class="form-group">
          <label>住所 <span class="required">必須</span></label>
          <input id="destAddress" type="text" required>
        </div>

        <div class="form-group">
          <label>アパート名、会社名など</label>
          <input id="destBuilding" type="text">
        </div>

        <div class="form-group">
          <label>電話番号</label>
          <input id="destPhone" type="text">
        </div>

        <div class="form-group">
          <label>配送希望日</label>
          <input id="deliveryDate" type="date">
        </div>

        <div class="form-group">
          <label>配送希望時間</label>
          <select id="deliveryTime">
            <option value="">なし</option>
            <option value="午前中">午前中</option>
            <option value="14-16時">14-16時</option>
            <option value="16-18時">16-18時</option>
            <option value="18-20時">18-20時</option>
            <option value="19-21時">19-21時</option>
          </select>
        </div>

        <div class="form-group full">
          <label>備考</label>
          <textarea id="shippingNote"></textarea>
        </div>
      </div>

      <div class="modal-section-title">発送元住所</div>

      <div class="form-group">
        <label>登録済み発送元 <span class="required">必須</span></label>
        <select id="originSelect" required></select>
      </div>

      <button type="submit" style="width:100%;">発送依頼を作成する</button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase,
  ref,
  get,
  set,
  update,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
  authDomain: "okirakubin-manager.firebaseapp.com",
  projectId: "okirakubin-manager",
  storageBucket: "okirakubin-manager.firebasestorage.app",
  messagingSenderId: "387991576787",
  appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const database = getDatabase(
  app,
  "https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let currentUser = null;
let productsCache = [];
let originsCache = [];
let announcementsCache = [];
let entryCount = 0;
let storedView = "stored";
let shippingView = "unshipped";
let selectedProductIds = new Set();

const loginArea = document.getElementById("loginArea");
const appArea = document.getElementById("appArea");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userEmail = document.getElementById("userEmail");
const loginError = document.getElementById("loginError");
const errorMessage = document.getElementById("errorMessage");
const productForm = document.getElementById("productForm");
const productEntries = document.getElementById("productEntries");
const addEntryBtn = document.getElementById("addEntryBtn");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const shippingModalBackdrop = document.getElementById("shippingModalBackdrop");
const shippingModalCloseBtn = document.getElementById("shippingModalCloseBtn");
const shippingForm = document.getElementById("shippingForm");
const shippingRequestType = document.getElementById("shippingRequestType");
const originSelect = document.getElementById("originSelect");
const registeredStoredFilterBtn = document.getElementById("registeredStoredFilterBtn");
const storedFilterBtn = document.getElementById("storedFilterBtn");
const unshippedFilterBtn = document.getElementById("unshippedFilterBtn");
const shippedFilterBtn = document.getElementById("shippedFilterBtn");
const originForm = document.getElementById("originForm");
const clearOriginBtn = document.getElementById("clearOriginBtn");

loginBtn.addEventListener("click", async () => {
  clearLoginError();

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error(error);
    showLoginError("ログインに失敗しました。もう一度お試しください。");
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  showLoginUI();
});

onAuthStateChanged(auth, async (user) => {
  clearLoginError();
  clearError();

  if (!user) {
    showLoginUI();
    return;
  }

  try {
    const memberSnapshot = await get(ref(database, `members/${user.uid}`));
    const isMember = memberSnapshot.exists() && memberSnapshot.val() === true;

    if (!isMember) {
      await signOut(auth);
      showLoginUI();
      showLoginError("このアカウントは会員として登録されていません。");
      return;
    }

    currentUser = user;

    await update(ref(database, `loginUsers/${user.uid}`), {
      uid: user.uid,
      name: user.displayName || "",
      email: user.email || "",
      role: "member",
      lastLoginAt: serverTimestamp()
    });

    showAppUI(user);
    resetEntries();
    await loadData();
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showLoginUI();
    showLoginError("会員情報の確認に失敗しました。Realtime Databaseのルールとデータを確認してください。");
  }
});

addEntryBtn.addEventListener("click", addProductEntry);

registeredStoredFilterBtn.addEventListener("click", () => {
  storedView = "registered";
  renderStoredList();
});

storedFilterBtn.addEventListener("click", () => {
  storedView = "stored";
  renderStoredList();
});

unshippedFilterBtn.addEventListener("click", () => {
  shippingView = "unshipped";
  renderShippingList();
});

shippedFilterBtn.addEventListener("click", () => {
  shippingView = "shipped";
  renderShippingList();
});

productForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();

  if (!currentUser) {
    showError("ログイン情報を確認できません。再度ログインしてください。");
    return;
  }

  const entries = [...document.querySelectorAll(".product-entry")];
  const payloads = entries.map((entry) => {
    return {
      name: entry.querySelector('[data-field="name"]').value.trim(),
      numbering: entry.querySelector('[data-field="numbering"]').value.trim(),
      workRequest: entry.querySelector('[data-field="workRequest"]').value,
      note: entry.querySelector('[data-field="note"]').value.trim(),
      purchaseUrl: entry.querySelector('[data-field="purchaseUrl"]').value.trim()
    };
  }).filter((item) => item.name || item.numbering || item.note || item.purchaseUrl);

  if (!payloads.length) {
    showError("登録する商品を入力してください。");
    return;
  }

  if (payloads.some((item) => !item.name || !item.numbering || !item.workRequest)) {
    showError("商品名、ナンバリング、作業依頼は必須です。");
    return;
  }

  try {
    const now = Date.now();

    await Promise.all(payloads.map((item, index) => {
      const productId = `${now}_${index}`;

      return set(ref(database, `products/${currentUser.uid}/${productId}`), {
        id: productId,
        ownerUid: currentUser.uid,
        ownerEmail: currentUser.email || "",
        name: item.name,
        numbering: item.numbering,
        workRequest: item.workRequest,
        note: item.note,
        purchaseUrl: item.purchaseUrl,
        shippingRequest: "",
        shippingStatus: "unshipped",
        shippingDestination: null,
        shippingOrigin: null,
        confirmationDate: "",
        confirmationResult: "",
        photoUrl: "",
        expectedSize: "",
        shootingDate: "",
        storageLocation: "",
        status: "registered",
        createdAt: now + index,
        updatedAt: now
      });
    }));

    productForm.reset();
    resetEntries();
    selectedProductIds.clear();
    await loadData();
    alert("商品を登録しました。");
  } catch (error) {
    console.error(error);
    showError("商品の登録に失敗しました。Realtime Databaseのルールを確認してください。");
  }
});

originForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();

  if (!currentUser) {
    showError("ログイン情報を確認できません。再度ログインしてください。");
    return;
  }

  const existingId = document.getElementById("originId").value;
  const originId = existingId || Date.now().toString();

  const data = {
    id: originId,
    name: document.getElementById("originName").value.trim(),
    postalCode: document.getElementById("originPostalCode").value.trim(),
    prefecture: document.getElementById("originPrefecture").value.trim(),
    address: document.getElementById("originAddress").value.trim(),
    building: document.getElementById("originBuilding").value.trim(),
    senderName: document.getElementById("originSenderName").value.trim(),
    phone: document.getElementById("originPhone").value.trim(),
    updatedAt: Date.now()
  };

  if (!data.name || !data.postalCode || !data.prefecture || !data.address || !data.senderName) {
    showError("発送元名、郵便番号、都道府県、住所、お名前は必須です。");
    return;
  }

  try {
    await set(ref(database, `shippingOrigins/${currentUser.uid}/${originId}`), data);
    originForm.reset();
    document.getElementById("originId").value = "";
    await loadData();
    alert("発送元を保存しました。");
  } catch (error) {
    console.error(error);
    showError("発送元の保存に失敗しました。Realtime Databaseのルールを確認してください。");
  }
});

clearOriginBtn.addEventListener("click", () => {
  originForm.reset();
  document.getElementById("originId").value = "";
});

shippingForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();

  if (!currentUser || !selectedProductIds.size) return;

  const selectedOrigin = originsCache.find((origin) => origin.id === originSelect.value);
  if (!selectedOrigin) {
    showError("発送元を選択してください。");
    return;
  }

  const destination = {
    name: document.getElementById("destName").value.trim(),
    postalCode: document.getElementById("destPostalCode").value.trim(),
    prefecture: document.getElementById("destPrefecture").value.trim(),
    address: document.getElementById("destAddress").value.trim(),
    building: document.getElementById("destBuilding").value.trim(),
    phone: document.getElementById("destPhone").value.trim(),
    deliveryDate: document.getElementById("deliveryDate").value,
    deliveryTime: document.getElementById("deliveryTime").value,
    note: document.getElementById("shippingNote").value.trim()
  };

  if (!destination.name || !destination.postalCode || !destination.prefecture || !destination.address) {
    showError("発送先の宛名、郵便番号、都道府県、住所は必須です。");
    return;
  }

  try {
    const now = Date.now();
    const requestType = shippingRequestType.value;

    await Promise.all([...selectedProductIds].map((productId) => {
      return update(ref(database, `products/${currentUser.uid}/${productId}`), {
        shippingRequest: requestType,
        shippingStatus: "unshipped",
        shippingDestination: destination,
        shippingOrigin: selectedOrigin,
        updatedAt: now
      });
    }));

    selectedProductIds.clear();
    shippingForm.reset();
    closeShippingModal();
    await loadData();
    alert("発送依頼を作成しました。");
  } catch (error) {
    console.error(error);
    showError("発送依頼の作成に失敗しました。");
  }
});

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
    document.querySelectorAll(".section").forEach((section) => section.classList.remove("show"));

    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
  });
});

modalCloseBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (event) => {
  if (event.target === modalBackdrop) closeModal();
});

shippingModalCloseBtn.addEventListener("click", closeShippingModal);
shippingModalBackdrop.addEventListener("click", (event) => {
  if (event.target === shippingModalBackdrop) closeShippingModal();
});

async function loadData() {
  if (!currentUser) return;

  try {
    const productsSnapshot = await get(ref(database, `products/${currentUser.uid}`));
    const originsSnapshot = await get(ref(database, `shippingOrigins/${currentUser.uid}`));

    productsCache = productsSnapshot.exists()
      ? Object.values(productsSnapshot.val()).sort((a, b) => {
          const aNumber = String(a.numbering || "");
          const bNumber = String(b.numbering || "");
          return aNumber.localeCompare(bNumber, "ja", { numeric: true });
        })
      : [];

    originsCache = originsSnapshot.exists()
      ? Object.values(originsSnapshot.val()).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ja"))
      : [];

    const registeredProducts = getRegisteredProducts();
    const storedProducts = getStoredProducts();
    const selectableIds = new Set([...registeredProducts, ...storedProducts].map((product) => product.id));
    selectedProductIds = new Set([...selectedProductIds].filter((id) => selectableIds.has(id)));

    document.getElementById("productCount").textContent = registeredProducts.length;
    document.getElementById("storedCount").textContent = storedProducts.length;
    document.getElementById("unshippedCount").textContent = productsCache.filter((product) => hasValue(product.shippingRequest) && product.shippingStatus !== "shipped").length;
    document.getElementById("shippedCount").textContent = productsCache.filter((product) => product.shippingStatus === "shipped").length;

    document.getElementById("recentProducts").innerHTML =
      registeredProducts.slice(0, 5).length ? productTable(registeredProducts.slice(0, 5), false, true) : emptyHtml("商品が登録されていません");

    renderStoredList();
    renderShippingList();
    renderOriginList();
  } catch (error) {
    console.error(error);
    showError("データの読み込みに失敗しました。");
  }
}

function getRegisteredProducts() {
  return productsCache.filter((product) => {
    return !hasValue(product.shippingRequest) && !hasValue(product.shootingDate);
  });
}

function getStoredProducts() {
  return productsCache.filter((product) => {
    return !hasValue(product.shippingRequest) && hasValue(product.shootingDate);
  });
}

function renderStoredList() {
  registeredStoredFilterBtn.classList.toggle("active", storedView === "registered");
  storedFilterBtn.classList.toggle("active", storedView === "stored");

  const products = storedView === "registered"
    ? getRegisteredProducts()
    : getStoredProducts();

  const emptyMessage = storedView === "registered"
    ? "登録済み商品はありません"
    : "保管商品はありません";

  document.getElementById("storedList").innerHTML =
    products.length ? productTable(products, false, true) + bulkActionBar() : emptyHtml(emptyMessage);
}

function renderShippingList() {
  unshippedFilterBtn.classList.toggle("active", shippingView === "unshipped");
  shippedFilterBtn.classList.toggle("active", shippingView === "shipped");

  const filtered = productsCache.filter((product) => {
    if (!hasValue(product.shippingRequest)) return false;
    if (shippingView === "shipped") return product.shippingStatus === "shipped";
    return product.shippingStatus !== "shipped";
  });

  document.getElementById("shippingList").innerHTML =
    filtered.length ? productTable(filtered, true, false) : emptyHtml(shippingView === "shipped" ? "発送済みの商品はありません" : "未発送の商品はありません");
}

function renderOriginList() {
  document.getElementById("originList").innerHTML = originsCache.length
    ? originsCache.map(originCard).join("")
    : emptyHtml("発送元が登録されていません");

  originSelect.innerHTML = originsCache.length
    ? `<option value="">選択してください</option>${originsCache.map((origin) => `<option value="${escapeAttr(origin.id)}">${escapeHtml(originLabel(origin))}</option>`).join("")}`
    : `<option value="">発送元を先に登録してください</option>`;
}

function resetEntries() {
  productEntries.innerHTML = "";
  entryCount = 0;
  addProductEntry();
}

function addProductEntry() {
  entryCount += 1;

  const entry = document.createElement("div");
  entry.className = "product-entry";
  entry.innerHTML = `
    <div class="product-entry-head">
      <div class="product-entry-title">登録項目 ${entryCount}</div>
      <button class="danger compact-btn" type="button" data-remove-entry>削除</button>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>商品名 *</label>
        <input type="text" data-field="name" required placeholder="例：SONY SEL1855">
      </div>

      <div class="form-group">
        <label>ナンバリング *</label>
        <input type="text" data-field="numbering" required placeholder="例：20250525">
      </div>

      <div class="form-group">
        <label>作業依頼 *</label>
        <select data-field="workRequest" required>
          <option value="">選択してください</option>
          <option value="検品+写真">検品+写真</option>
          <option value="写真のみ">写真のみ</option>
          <option value="検品のみ">検品のみ</option>
          <option value="保管のみ">保管のみ</option>
        </select>
      </div>

      <div class="form-group">
        <label>購入先URL</label>
        <input type="url" data-field="purchaseUrl" placeholder="https://example.com">
      </div>

      <div class="form-group full">
        <label>備考欄</label>
        <textarea data-field="note" placeholder="備考を入力してください"></textarea>
      </div>
    </div>
  `;

  entry.querySelector("[data-remove-entry]").addEventListener("click", () => {
    if (document.querySelectorAll(".product-entry").length === 1) {
      entry.querySelectorAll("input,textarea").forEach((input) => input.value = "");
      entry.querySelector("select").selectedIndex = 0;
      return;
    }

    entry.remove();
  });

  productEntries.appendChild(entry);
}

function productTable(products, showShippingStatus = false, isSelectableList = false) {
  return `
    <div class="table-wrap">
      <table class="products-table">
        <thead>
          <tr>
            <th>発送</th>
            <th>商品名</th>
            <th>ナンバリング</th>
            <th>発送情報</th>
            <th>情報</th>
            <th>撮影日</th>
            ${showShippingStatus ? "<th>状態</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${products.map((product) => productRow(product, showShippingStatus, isSelectableList)).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function productRow(product, showShippingStatus = false, isSelectableList = false) {
  return `
    <tr>
      <td class="shipping-cell">
        ${
          isSelectableList
            ? `<input class="shipping-check" type="checkbox" ${selectedProductIds.has(product.id) ? "checked" : ""} onchange="toggleProductSelection('${escapeAttr(product.id)}', this.checked)">`
            : shippingPill(product.shippingRequest)
        }
      </td>
      <td>${escapeHtml(product.name)}</td>
      <td>${escapeHtml(product.numbering || "-")}</td>
      <td>
        ${
          hasValue(product.shippingRequest)
            ? `<button class="secondary compact-btn" type="button" onclick="showShippingInfo('${escapeAttr(product.id)}')">詳細</button>`
            : "-"
        }
      </td>
      <td>
        <button class="secondary compact-btn" type="button" onclick="showInfo('${escapeAttr(product.id)}')">詳細</button>
      </td>
      <td>${escapeHtml(product.shootingDate || "-")}</td>
      ${showShippingStatus ? `<td>${shippingStatusText(product)}</td>` : ""}
    </tr>
  `;
}

function bulkActionBar() {
  return `
    <div class="bulk-action-bar ${selectedProductIds.size ? "show" : ""}">
      <button type="button" class="bulk-btn domestic" onclick="openShippingModal('国内発送')">選択中を国内発送する</button>
      <button type="button" class="bulk-btn overseas" onclick="openShippingModal('海外発送')">選択中を海外発送する</button>
      <button type="button" class="bulk-btn return" onclick="openShippingModal('返品依頼')">選択中を返品依頼する</button>
    </div>
  `;
}

function originCard(origin) {
  return `
    <div class="origin-card">
      <div class="origin-card-head">
        <div class="origin-title">${escapeHtml(origin.name)}</div>
        <button class="secondary compact-btn" type="button" onclick="editOrigin('${escapeAttr(origin.id)}')">変更</button>
      </div>
      <div class="origin-meta">
        ${escapeHtml(origin.postalCode)} ${escapeHtml(origin.prefecture)} ${escapeHtml(origin.address)} ${escapeHtml(origin.building || "")}<br>
        ${escapeHtml(origin.senderName)} ${origin.phone ? " / " + escapeHtml(origin.phone) : ""}
      </div>
    </div>
  `;
}

function shippingPill(value) {
  const className = value === "国内発送" ? "domestic" : value === "海外発送" ? "overseas" : value === "返品依頼" ? "return" : "none";
  return `<span class="status-pill ${className}">${escapeHtml(value || "未選択")}</span>`;
}

function shippingStatusText(product) {
  return product.shippingStatus === "shipped"
    ? `<span class="status-pill domestic">発送済み</span>`
    : `<span class="status-pill none">未発送</span>`;
}

function originLabel(origin) {
  return `${origin.postalCode || ""} ${origin.prefecture || ""} ${origin.address || ""}`;
}

window.toggleProductSelection = function(productId, checked) {
  if (checked) {
    selectedProductIds.add(productId);
  } else {
    selectedProductIds.delete(productId);
  }

  renderStoredList();
};

window.openShippingModal = function(type) {
  if (!selectedProductIds.size) return;

  if (!originsCache.length) {
    showError("発送元を先に登録してください。");
    document.querySelector('[data-tab="origins"]').click();
    return;
  }

  clearError();
  shippingRequestType.value = type;
  document.getElementById("shippingModalTitle").textContent = `${type}の発送先情報`;
  shippingModalBackdrop.classList.add("show");
};

window.editOrigin = function(originId) {
  const origin = originsCache.find((item) => item.id === originId);
  if (!origin) return;

  document.getElementById("originId").value = origin.id;
  document.getElementById("originName").value = origin.name || "";
  document.getElementById("originPostalCode").value = origin.postalCode || "";
  document.getElementById("originPrefecture").value = origin.prefecture || "";
  document.getElementById("originAddress").value = origin.address || "";
  document.getElementById("originBuilding").value = origin.building || "";
  document.getElementById("originSenderName").value = origin.senderName || "";
  document.getElementById("originPhone").value = origin.phone || "";
  window.scrollTo({ top: 0, behavior: "smooth" });
};

window.showShippingInfo = function(productId) {
  const product = productsCache.find((item) => item.id === productId);
  if (!product) return;

  openModal("発送情報", shippingDetailHtml(product), true);
};

window.showInfo = function(productId) {
  const product = productsCache.find((item) => item.id === productId);
  if (!product) return;

  openModal("商品情報", productDetailHtml(product), true);
};

function productDetailHtml(product) {
  return `
    <div class="detail-section">
      <div class="detail-heading">会員記載情報</div>
      <div class="detail-grid">
        <div class="detail-label">商品名</div><div>${escapeHtml(product.name || "-")}</div>
        <div class="detail-label">ナンバリング</div><div>${escapeHtml(product.numbering || "-")}</div>
        <div class="detail-label">作業依頼</div><div>${escapeHtml(product.workRequest || "-")}</div>
        <div class="detail-label">備考欄</div><div>${escapeHtml(product.note || "-")}</div>
        <div class="detail-label">購入先URL</div><div>${product.purchaseUrl ? `<a href="${escapeAttr(product.purchaseUrl)}" target="_blank" rel="noopener">${escapeHtml(product.purchaseUrl)}</a>` : "-"}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-heading">管理者記載情報</div>
      <div class="detail-grid">
        <div class="detail-label">確認日</div><div>${escapeHtml(product.confirmationDate || "-")}</div>
        <div class="detail-label">確認結果</div><div>${escapeHtml(product.confirmationResult || "-")}</div>
        <div class="detail-label">写真URL</div><div>${product.photoUrl ? `<a href="${escapeAttr(product.photoUrl)}" target="_blank" rel="noopener">${escapeHtml(product.photoUrl)}</a>` : "-"}</div>
        <div class="detail-label">予想サイズ</div><div>${escapeHtml(product.expectedSize || "-")}</div>
        <div class="detail-label">保管場所</div><div>${escapeHtml(product.storageLocation || "-")}</div>
      </div>
    </div>
  `;
}

function shippingDetailHtml(product) {
  const destination = product.shippingDestination || {};
  const origin = product.shippingOrigin || {};

  return `
    <div class="detail-section">
      <div class="detail-heading">発送内容</div>
      <div class="detail-grid">
        <div class="detail-label">発送種別</div><div>${escapeHtml(product.shippingRequest || "-")}</div>
        <div class="detail-label">状態</div><div>${product.shippingStatus === "shipped" ? "発送済み" : "未発送"}</div>
        <div class="detail-label">配送希望日</div><div>${escapeHtml(destination.deliveryDate || "-")}</div>
        <div class="detail-label">配送希望時間</div><div>${escapeHtml(destination.deliveryTime || "-")}</div>
        <div class="detail-label">備考</div><div>${escapeHtml(destination.note || "-")}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-heading">発送先</div>
      <div class="detail-grid">
        <div class="detail-label">宛名</div><div>${escapeHtml(destination.name || "-")}</div>
        <div class="detail-label">郵便番号</div><div>${escapeHtml(destination.postalCode || "-")}</div>
        <div class="detail-label">都道府県</div><div>${escapeHtml(destination.prefecture || "-")}</div>
        <div class="detail-label">住所</div><div>${escapeHtml(destination.address || "-")}</div>
        <div class="detail-label">建物名</div><div>${escapeHtml(destination.building || "-")}</div>
        <div class="detail-label">電話番号</div><div>${escapeHtml(destination.phone || "-")}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-heading">発送元</div>
      <div class="detail-grid">
        <div class="detail-label">発送元名</div><div>${escapeHtml(origin.name || "-")}</div>
        <div class="detail-label">郵便番号</div><div>${escapeHtml(origin.postalCode || "-")}</div>
        <div class="detail-label">都道府県</div><div>${escapeHtml(origin.prefecture || "-")}</div>
        <div class="detail-label">住所</div><div>${escapeHtml(origin.address || "-")}</div>
        <div class="detail-label">建物名</div><div>${escapeHtml(origin.building || "-")}</div>
        <div class="detail-label">お名前</div><div>${escapeHtml(origin.senderName || "-")}</div>
        <div class="detail-label">電話番号</div><div>${escapeHtml(origin.phone || "-")}</div>
      </div>
    </div>
  `;
}

function openModal(title, body, isHtml = false) {
  modalTitle.textContent = title;

  if (isHtml) {
    modalBody.innerHTML = body;
  } else {
    modalBody.textContent = body;
  }

  modalBackdrop.classList.add("show");
}

function closeModal() {
  modalBackdrop.classList.remove("show");
  modalBody.textContent = "";
}

function closeShippingModal() {
  shippingModalBackdrop.classList.remove("show");
}

function showLoginUI() {
  currentUser = null;
  loginArea.classList.remove("hidden");
  appArea.classList.add("hidden");
}

function showAppUI(user) {
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  userEmail.textContent = user.email || user.displayName || user.uid;
}

function emptyHtml(message) {
  return `<div class="empty"><h3>${escapeHtml(message)}</h3></div>`;
}

function showLoginError(message) {
  loginError.textContent = message;
  loginError.classList.add("show");
}

function clearLoginError() {
  loginError.textContent = "";
  loginError.classList.remove("show");
}

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.classList.add("show");
}

function clearError() {
  errorMessage.textContent = "";
  errorMessage.classList.remove("show");
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}
</script>
