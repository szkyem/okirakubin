<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おきらく便 - 会員</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
    color: #1f2937;
    background: linear-gradient(135deg, #4f7cff 0%, #263a66 100%);
    padding: 24px;
}

.container {
    max-width: 960px;
    margin: 0 auto;
    padding: 36px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 18px 50px rgba(31, 41, 55, 0.18);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 28px;
    border-bottom: 1px solid #e5e7eb;
}

h1 {
    font-size: 28px;
    color: #2563eb;
}

.logout-btn {
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 700;
    cursor: pointer;
    background: #eef2f7;
    color: #1f2937;
}

.logout-btn:hover {
    background: #dfe7f1;
}

.content h2 {
    font-size: 24px;
    margin-bottom: 16px;
}

.content p {
    font-size: 18px;
    line-height: 1.8;
}

@media (max-width: 640px) {
    body {
        padding: 16px;
    }

    .container {
        padding: 24px;
    }

    .header {
        align-items: stretch;
        flex-direction: column;
    }

    .logout-btn {
        width: 100%;
    }
}
</style>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>おきらく便</h1>
        <button class="logout-btn" id="logoutBtn" type="button">ログアウト</button>
    </header>

    <main class="content">
        <h2>目次</h2>
        <p>会員ページ</p>
    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
    getAuth,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
    authDomain: "okirakubin-manager.firebaseapp.com",
    projectId: "okirakubin-manager",
    storageBucket: "okirakubin-manager.firebasestorage.app",
    messagingSenderId: "387991576787",
    appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const logoutBtn = document.getElementById("logoutBtn");

onAuthStateChanged(auth, (user) => {
    if (!user) {
        location.href = "index.html";
    }
});

logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    location.href = "index.html";
});
</script>
</body>
</html>
