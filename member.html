<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気楽便 - 会員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px}
button,input,textarea,select{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#1f2937}
button.secondary:hover{background:#dfe7f1}
button.danger{background:#fee2e2;color:#b91c1c}
button.danger:hover{background:#fecaca}
.container{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;max-width:2000px;margin:0 auto}
.login-container{max-width:520px;margin:80px auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px}
.login-title{font-size:28px;font-weight:800;color:#2563eb;margin-bottom:12px}
.login-text{color:#6b7280;margin-bottom:24px;line-height:1.7}
.login-button{width:100%;font-size:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;color:#2563eb}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800}
.logout{background:#eef2f7;color:#1f2937}
.tabs{display:flex;gap:10px;border-bottom:2px solid #e5e7eb;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.section{display:none}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat,.form{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:20px}
.stat{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.stat:hover{border-color:#bfdbfe;box-shadow:0 8px 22px rgba(37,99,235,.1);transform:translateY(-1px)}
.stat-label{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:#2563eb}
.form{margin-top:16px}
.form-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.product-entry{border:1px solid #dbe3ef;border-radius:8px;background:#f8fafc;padding:12px;margin-bottom:10px}
.product-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.product-entry-title{font-weight:800;color:#1f2937}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form-group{margin-bottom:8px}
.form-group.full{grid-column:1/-1}
label{display:block;margin-bottom:5px;font-weight:700}
input,textarea,select{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:8px 10px;font-size:14px;background:#fff}
textarea{min-height:62px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
.products-table{width:100%;border-collapse:collapse;min-width:760px}
.products-table th{background:#6b7280;color:#fff;text-align:left;font-size:13px;padding:8px 10px;white-space:nowrap}
.products-table td{border-top:1px solid #e5e7eb;padding:8px 10px;vertical-align:middle;font-size:14px}
.products-table tr:nth-child(even){background:#fafafa}
.shipping-cell{background:#fffde7;text-align:center;width:46px;min-width:46px;max-width:46px;padding-left:6px!important;padding-right:6px!important}
.member-meta{font-size:12px;color:#64748b;margin-top:4px;line-height:1.35}
.bundle-note{display:inline-flex;align-items:center;border-radius:999px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:3px 8px;font-size:12px;font-weight:800;margin-top:5px;white-space:nowrap}
.bundle-label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid #cbd5e1;color:#1f2937;background:#fff;padding:5px 10px;font-size:12px;font-weight:800;line-height:1;white-space:nowrap}
.bundle-count{display:inline-flex;margin-left:8px;color:#475569;font-size:12px;font-weight:800;white-space:nowrap}
.dash-mark{color:#1f2937;font-size:14px;font-weight:400;line-height:1}
.dash-mark::before{content:"-"}
.products-table tr.bundle-first td:first-child{box-shadow:inset 3px 0 0 #2563eb}
.products-table tr.bundle-middle td:first-child,.products-table tr.bundle-last td:first-child{position:relative;padding-left:30px}
.products-table tr.bundle-middle td:first-child::before,.products-table tr.bundle-last td:first-child::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:#cbd5e1}
.products-table tr.bundle-middle td:first-child::after,.products-table tr.bundle-last td:first-child::after{content:"";position:absolute;left:14px;top:50%;width:12px;height:1px;background:#cbd5e1}
.products-table tr.bundle-last td:first-child::before{bottom:50%}
.shipping-check{width:auto}
.checkbox-line{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700;color:var(--ink);cursor:default}
.checkbox-line span{pointer-events:none}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.domestic{background:#dbeafe;color:#1d4ed8}
.status-pill.overseas{background:#dcfce7;color:#15803d}
.status-pill.return{background:#fee2e2;color:#b91c1c}
.status-pill.none{background:#f3f4f6;color:#6b7280}
.compact-btn{padding:7px 10px;font-size:12px}
.ship-filter{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px}
.ship-filter-btn{background:#fff;color:#9ca3af;border-bottom:2px solid #d1d5db;border-radius:0;min-width:160px}
.ship-filter-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.ship-filter-btn:hover{background:#f8fafc}
.section-tools{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.section-search{width:min(360px,100%);min-height:40px}
.bulk-action-bar{display:none;position:sticky;bottom:0;margin-top:12px;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 24px rgba(15,23,42,.12);z-index:5}
.bulk-action-bar.show{display:grid}
.bulk-btn{border-radius:0;padding:18px 12px;font-size:15px}
.bulk-btn.domestic{background:#334155}
.bulk-btn.overseas{background:#5acb88}
.bulk-btn.return{background:#f59e0b}
.origin-list{display:grid;gap:12px;margin-top:18px}
.origin-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;background:#fff}
.origin-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.origin-title{font-weight:800}
.origin-meta{font-size:13px;color:#4b5563;line-height:1.7}
.empty{padding:32px;text-align:center;color:#6b7280}
.error{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6}
.error.show{display:block}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.modal-title{font-size:20px;font-weight:800}
.modal-body{line-height:1.45;white-space:normal}
.detail-section{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;color:#2563eb;margin-bottom:8px}
.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:5px 10px;font-size:14px}
.detail-label{color:#6b7280;font-weight:700}
.confirmation-table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:8px;background:#fff}
.confirmation-table{width:100%;min-width:560px;border-collapse:collapse;font-size:13px;line-height:1.45}
.confirmation-table th{padding:7px 9px;background:#475569;color:#fff;text-align:left}
.confirmation-table td{border-top:1px solid #e5e7eb;padding:6px 8px;vertical-align:middle}
.confirmation-table .confirmation-section td{background:#f4d2cc;color:#111827;font-weight:800;border-top:1px solid #1f2937;border-bottom:1px solid #1f2937}
.modal-form{display:grid;gap:14px}
.modal-section-title{background:#eaf2ff;color:#1d4ed8;font-weight:800;padding:9px 12px;margin:8px 0}
.required{display:inline-block;background:#ef4444;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;margin-left:8px}
.announcement-list{display:grid;gap:12px}
.announcement-card{border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc;padding:14px}
.announcement-date{color:#6b7280;font-size:12px;font-weight:800;margin-bottom:6px}
.announcement-message{font-weight:700;line-height:1.7;white-space:pre-wrap}
.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inquiry-box{display:flex;align-items:center;gap:8px;white-space:nowrap}
.invoice-year{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:16px}
.invoice-year-title{font-size:18px;font-weight:800;margin-bottom:14px;color:#1f2937}
.invoice-grid{display:grid;grid-template-columns:repeat(6, minmax(108px, 1fr));gap:10px}
.invoice-month-card{min-height:104px;border:1px solid #dbe3ef;border-radius:8px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.invoice-month-card.available{background:#eff6ff;border-color:#bfdbfe}
.invoice-month{font-size:18px;font-weight:800;color:#1f2937;text-align:center}
.invoice-downloads{display:flex;gap:6px}
.invoice-downloads button{padding:6px 8px;font-size:12px}
.invoice-empty{font-size:12px;color:#9ca3af}
@media(max-width:700px){
  body{padding:10px;font-size:14px;overflow-x:hidden}
  .container,.login-container{width:100%;padding:18px;border-radius:8px}
  .login-container{margin:42px auto}
  .title,.login-title{font-size:24px}
  .header{align-items:stretch;flex-direction:column;gap:12px;margin-bottom:18px}
  .user{align-items:stretch;flex-direction:column;gap:8px}
  .badge{width:max-content}
  .logout{width:100%}
  .tabs{gap:4px;overflow-x:auto;flex-wrap:nowrap;margin-bottom:18px}
  .tab{min-width:96px;padding:9px 8px;font-size:13px;white-space:nowrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:14px}
  .stat-value{font-size:26px}
  .form{padding:14px}
  .form-header{align-items:stretch;flex-direction:column}
  .form-header button{width:100%}
  .product-entry{padding:10px}
  .product-entry-head{align-items:stretch;flex-direction:column}
  .form-grid{grid-template-columns:1fr;gap:8px}
  .form-group.full{grid-column:auto}
  input,textarea,select{font-size:16px}
  .ship-filter{justify-content:flex-start;overflow-x:auto}
  .ship-filter-btn{min-width:132px;padding:9px 10px;font-size:13px}
  .section-tools{justify-content:stretch}
  .section-search{width:100%}
  .table-wrap{overflow-x:auto}
  .products-table{min-width:640px}
  .products-table th,.products-table td{padding:7px 8px;font-size:13px}
  .bulk-action-bar{grid-template-columns:1fr;position:static}
  .bulk-btn{padding:14px 10px;font-size:14px}
  .invoice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .invoice-month-card{width:100%}
  .modal-backdrop{align-items:flex-start;padding:10px}
  .modal{width:100%;max-width:none;min-width:0;max-height:calc(100vh - 20px);padding:12px}
  .modal-head{align-items:stretch;flex-direction:column}
  .modal-title{font-size:18px}
  .detail-heading{align-items:stretch;flex-direction:column}
  .detail-grid{grid-template-columns:112px 1fr;gap:6px 10px;font-size:13px}
  .detail-label{margin-top:0}
  .detail-section{padding:9px 10px;margin-bottom:7px}
  .origin-card-head{align-items:stretch;flex-direction:column}
  button{min-height:40px}
}
</style>
</head>
<body>

<section class="login-container" id="loginArea">
  <div class="error" id="loginError"></div>
  <h1 class="login-title">お気楽便</h1>
  <p class="login-text">会員としてログインしてください。</p>
  <button class="login-button" id="loginBtn" type="button">Googleで会員ログイン</button>
  <div style="margin-top:16px;border-top:1px solid #d7dde8;padding-top:16px;">
    <label for="emailLinkInput" style="display:block;margin-bottom:8px;font-weight:700;">メールリンクでログイン</label>
    <input id="emailLinkInput" type="email" autocomplete="email" placeholder="メールアドレス" style="width:100%;margin-bottom:10px;">
    <button class="secondary" id="emailLinkBtn" type="button" style="width:100%;">ログインリンクを送信</button>
    <p class="muted" style="margin-top:8px;font-size:12px;">届いたメールのリンクからログインできます。</p>
  </div>
</section>

<div class="container hidden" id="appArea">
  <div class="error" id="errorMessage"></div>

  <header class="header">
    <h1 class="title">お気楽便</h1>
    <div class="user">
      <span id="userEmail"></span>
      <span class="badge" id="memberBadge">会員</span>
      <button class="secondary compact-btn" id="memberSettingsBtn" type="button">設定変更</button>
      <button class="logout" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" type="button">トップ</button>
    <button class="tab" data-tab="register" type="button">商品登録</button>
    <button class="tab" data-tab="stored" type="button">保管商品</button>
    <button class="tab" data-tab="shipping" type="button">発送管理</button>
    <button class="tab" data-tab="origins" type="button">発送元登録</button>
    <button class="tab" data-tab="invoices" type="button">請求書DL</button>
    <button class="tab" data-tab="basicInfo" type="button">基本情報</button>
  </nav>

  <section class="section show" id="overview">
    <div class="grid">
      <div class="stat" onclick="goToStoredView('registered')"><div class="stat-label">登録済み商品</div><div class="stat-value" id="productCount">0</div></div>
      <div class="stat" onclick="goToStoredView('stored')"><div class="stat-label">保管商品</div><div class="stat-value" id="storedCount">0</div></div>
      <div class="stat" onclick="goToShippingView('unshipped')"><div class="stat-label">未発送</div><div class="stat-value" id="unshippedCount">0</div></div>
      <div class="stat" onclick="goToShippingView('shipped')"><div class="stat-label">発送済み</div><div class="stat-value" id="shippedCount">0</div></div>
    </div>

    <h2 style="margin-bottom:16px;">最近のお知らせ</h2>
    <div id="recentAnnouncements"></div>
  </section>

  <section class="section" id="basicInfo">
    <h2 style="margin-bottom:16px;">基本情報</h2>
    <div id="basicInfoBox"></div>

    <h2 style="margin:24px 0 16px;">過去のお知らせ</h2>
    <div id="pastAnnouncements"></div>
  </section>

  <section class="section" id="register">
    <div class="form">
      <div class="form-header">
        <h2>商品を登録する</h2>
        <button class="secondary" id="addEntryBtn" type="button">追加</button>
      </div>

      <form id="productForm">
        <div id="productEntries"></div>
        <button id="registerProductsBtn" type="button" style="width:100%;">登録する</button>
      </form>
    </div>
  </section>

  <section class="section" id="stored">
    <h2 style="margin-bottom:16px;">保管商品</h2>

    <div class="ship-filter">
      <button class="ship-filter-btn active" id="storedFilterBtn" type="button">保管商品</button>
      <button class="ship-filter-btn" id="registeredStoredFilterBtn" type="button">登録済み商品</button>
    </div>

    <div class="section-tools">
      <input id="storedSearchInput" class="section-search" type="search" placeholder="商品名・ナンバリングで検索">
    </div>

    <div id="storedList"></div>
  </section>

  <section class="section" id="shipping">
    <h2 style="margin-bottom:16px;">発送管理</h2>
    <div class="ship-filter">
      <button class="ship-filter-btn active" id="unshippedFilterBtn" type="button">未発送</button>
      <button class="ship-filter-btn" id="shippedFilterBtn" type="button">発送済み</button>
    </div>
    <div class="section-tools">
      <input id="shippingSearchInput" class="section-search" type="search" placeholder="商品名・ナンバリングで検索">
    </div>
    <div id="shippingList"></div>
  </section>

  <section class="section" id="origins">
    <div class="form">
      <div class="form-header">
        <h2>発送元を登録する（ご自身のご自宅を登録）</h2>
        <button class="secondary" id="clearOriginBtn" type="button">追加</button>
      </div>

      <form id="originForm">
        <input type="hidden" id="originId">

        <div class="form-grid">
          <div class="form-group">
            <label>発送元名 *</label>
            <input id="originName" type="text" required placeholder="例：自宅 / 倉庫A">
          </div>

          <div class="form-group">
            <label>郵便番号 *</label>
            <input id="originPostalCode" type="text" required placeholder="例：420-8601">
          </div>

          <div class="form-group">
            <label>都道府県 *</label>
            <input id="originPrefecture" type="text" required placeholder="例：静岡県">
          </div>

          <div class="form-group">
            <label>住所 *</label>
            <input id="originAddress" type="text" required placeholder="例：静岡市葵区葵区追手町1-1">
          </div>

          <div class="form-group">
            <label>アパート名、会社名など</label>
            <input id="originBuilding" type="text">
          </div>

          <div class="form-group">
            <label>お名前 *</label>
            <input id="originSenderName" type="text" required>
          </div>

          <div class="form-group">
            <label>電話番号</label>
            <input id="originPhone" type="text">
          </div>
        </div>

        <button type="submit" style="width:100%;">保存する</button>
      </form>
    </div>

    <div class="origin-list" id="originList"></div>
  </section>

  <section class="section" id="invoices">
    <h2 style="margin-bottom:16px;">請求書ダウンロード</h2>
    <div id="invoiceList"></div>
  </section>
  <section class="section" id="settings">
    <div class="form">
      <div class="form-header">
        <h2>会員設定</h2>
      </div>

      <div class="detail-section">
        <div class="detail-heading">ログインメール</div>
        <div class="detail-grid">
          <div class="detail-label">現在のメール</div>
          <div id="currentLoginEmail">-</div>
        </div>
      </div>

      <form id="emailChangeForm">
        <div class="form-grid">
          <div class="form-group full">
            <label>新しいメールアドレス</label>
            <input id="newLoginEmail" type="email" placeholder="new@example.com" autocomplete="email">
          </div>
        </div>
        <button type="submit" style="width:100%;">移行先メールを登録する</button>
      </form>

      <p class="member-meta" style="margin-top:12px;">
        移行先のGoogleアカウントのメールを登録します。登録後にログアウトし、新しいGoogleアカウントでログインすると既存データを引き継ぎます。
      </p>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="secondary compact-btn" id="modalCloseBtn" type="button">閉じる</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="shippingModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="shippingModalTitle">発送先情報</div>
      <button class="secondary compact-btn" id="shippingModalCloseBtn" type="button">閉じる</button>
    </div>

    <form class="modal-form" id="shippingForm">
      <input type="hidden" id="shippingRequestType">

      <div class="modal-section-title">発送先住所</div>

      <div class="form-grid">
        <div class="form-group">
          <label>宛名 <span class="required">必須</span></label>
          <input id="destName" type="text" required>
        </div>

        <div class="form-group">
          <label>郵便番号 <span class="required">必須</span></label>
          <input id="destPostalCode" type="text" required>
        </div>

        <div class="form-group">
          <label>都道府県 <span class="required">必須</span></label>
          <input id="destPrefecture" type="text" required>
        </div>

        <div class="form-group">
          <label>住所 <span class="required">必須</span></label>

onAuthStateChanged(auth, async (user) => {
  clearLoginError();
  clearError();

  if (!user) {
    showLoginUI();
    return;
  }

  try {
    const params = new URLSearchParams(location.search);
    const proxyUid = params.get("proxyUid") || "";
    const wantsAdminProxy = params.get("adminProxy") === "1" && proxyUid;
    let isMember = false;
    let migrationLoginError = "";

    if (wantsAdminProxy) {
      const adminSnapshot = await get(ref(database, `admins/${user.uid}`));
      if (adminSnapshot.val() !== true) {
        await signOut(auth);
        showLoginUI();
        showLoginError("管理者としてログインしてください。");
        return;
      }

      const targetMemberSnapshot = await get(ref(database, `members/${proxyUid}`));
      if (targetMemberSnapshot.val() !== true) {
        await signOut(auth);
        showLoginUI();
        showLoginError("対象会員が見つかりません。");
        return;
      }

      isAdminProxyMode = true;
      activeMemberUid = proxyUid;
      isMember = true;
    } else {
      await recordLoginAttemptForAdminRegistration(user);

      const memberSnapshot = await get(ref(database, `members/${user.uid}`));
      isMember = memberSnapshot.exists() && memberSnapshot.val() === true;

      if (isMember) {
        const emailAllowed = await validateMemberLoginEmail(user);
        if (!emailAllowed) {
          await signOut(auth);
          showLoginUI();
          showLoginError("このメールアドレスではログインできません。メール変更後は新しいメールでログインしてください。");
          return;
        }
      }

      if (!isMember) {
        const repairResult = await repairMemberRecordFromSettings(user);
        isMember = repairResult.activated === true;
        migrationLoginError = repairResult.message || "";
      }

      if (!isMember) {
        const migrationResult = await activateAccountMigration(user);
        isMember = migrationResult.activated === true;
        migrationLoginError = migrationResult.message || migrationLoginError || "";
      }

      if (!isMember) {
        const hasPending = await hasPendingMemberRegistration(user);
        if (hasPending) {
          migrationLoginError = "管理者の本登録待ちです。管理者に本登録を依頼してください。";
        }
      }

      activeMemberUid = user.uid;
    }

    if (!isMember) {
      await signOut(auth);
      showLoginUI();
      showLoginError(migrationLoginError || "このアカウントは会員として登録されていません。");
      return;
    }

    currentUser = user;

    const loginUpdate = {
      uid: user.uid,
      email: user.email || "",
      role: "member",
      lastLoginAt: serverTimestamp()
    };

    if (user.displayName) {
      loginUpdate.name = user.displayName;
    }

    if (!isAdminProxyMode) {
      await update(ref(database, `loginUsers/${user.uid}`), loginUpdate);
      await syncAuthEmailToDatabase(user);
    }

    showAppUI(user);
    applyProxyModeBanner();
    resetEntries();
    await loadData();
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showLoginUI();
    showLoginError("会員情報の確認に失敗しました。Realtime Databaseのルールとデータを確認してください。");
  }
});

  if (!email) {
    showLoginUI();
    showLoginError("メールアドレスを確認できないため、ログインできませんでした。");
    return;

  try {
    await signInWithEmailLink(auth, email, location.href);
    localStorage.removeItem("okirakubinEmailForSignIn");
    history.replaceState({}, document.title, location.pathname);
  } catch (error) {
    console.error(error);
    showLoginUI();
    showLoginError("メールリンクでのログインに失敗しました。リンクを再送信してください。");
  }
}



async function recordLoginAttemptForAdminRegistration(user) {
  if (!user?.uid) return;

  const email = String(user.email || "").trim().toLowerCase();
  const now = Date.now();
  const payload = {
    uid: user.uid,
    email,
    role: "pending",
    loginAttemptAt: now,
    lastLoginAt: now
  };

  if (user.displayName) payload.name = user.displayName;

  try {
    await update(ref(database, `loginUsers/${user.uid}`), payload);
  } catch (error) {
    console.warn("login attempt record failed", error);
  }
}

async function hasPendingMemberRegistration(user) {
  const email = String(user?.email || "").trim().toLowerCase();
  if (!email) return false;

  try {
    const key = emailKey(email);
    const pendingSnapshot = await get(ref(database, `pendingMembers/${key}`));
    return pendingSnapshot.exists();
  } catch (error) {
    console.warn("pending member check failed", error);
    return false;
  }
}
async function repairMemberRecordFromSettings(user) {
  const email = String(user?.email || "").trim().toLowerCase();
  if (!user?.uid || !email) return { activated: false, message: "" };

  const settingsSnapshot = await get(ref(database, `memberSettings/${user.uid}`)).catch(() => ({ exists: () => false, val: () => null }));
  if (!settingsSnapshot.exists()) return { activated: false, message: "" };

  const settings = settingsSnapshot.val() || {};
  const settingsEmail = String(settings.email || "").trim().toLowerCase();
  const pendingEmail = String(settings.pendingEmail || "").trim().toLowerCase();
  const pendingEmailKey = String(settings.pendingEmailKey || "").trim();
  const currentEmailKey = emailKey(email);
  const emailMatches = settingsEmail === email || pendingEmail === email || pendingEmailKey === currentEmailKey;

  if (!emailMatches) {
    return {
      activated: false,
      message: "会員設定はありますが、ログイン中のメールアドレスと一致しません。管理者に確認してください。"
    };
  }

  const now = Date.now();
  try {
    await update(ref(database), {
      [`members/${user.uid}`]: true,
      [`loginUsers/${user.uid}/uid`]: user.uid,
      [`loginUsers/${user.uid}/email`]: email,
      [`loginUsers/${user.uid}/role`]: "member",
      [`loginUsers/${user.uid}/name`]: settings.name || user.displayName || "",
      [`loginUsers/${user.uid}/lastLoginAt`]: serverTimestamp(),
      [`memberSettings/${user.uid}/email`]: email,
      [`memberSettings/${user.uid}/membershipRepairedAt`]: now,
      [`memberSettings/${user.uid}/updatedAt`]: now
    });
    return { activated: true, message: "" };
  } catch (error) {
    console.error(error);
    return {
      activated: false,
      message: "会員設定はありますが、membersへの補修登録に失敗しました。Realtime Databaseの members 書き込みルールを確認してください。"
    };
  }
}
async function validateMemberLoginEmail(user) {
  const authEmail = String(user?.email || "").trim().toLowerCase();
  if (!user?.uid || !authEmail) return false;

  const settingsSnapshot = await get(ref(database, `memberSettings/${user.uid}`)).catch(() => ({ exists: () => false, val: () => ({}) }));
  const settings = settingsSnapshot.exists() ? settingsSnapshot.val() || {} : {};
  const registeredEmail = String(settings.email || "").trim().toLowerCase();
  const pendingEmail = String(settings.pendingEmail || "").trim().toLowerCase();

  if (!registeredEmail && !pendingEmail) return true;
  if (authEmail === registeredEmail) return true;
  if (pendingEmail && authEmail === pendingEmail) return true;

  return false;
}

async function syncAuthEmailToDatabase(user) {
  const email = String(user?.email || "").trim();

  const now = Date.now();

    [`loginUsers/${user.uid}/email`]: email,
    [`loginUsers/${user.uid}/emailSyncedAt`]: now,
    [`memberSettings/${user.uid}/email`]: email,
    [`memberSettings/${user.uid}/pendingEmail`]: null,
    [`memberSettings/${user.uid}/emailSyncedAt`]: now,
    [`memberSettings/${user.uid}/updatedAt`]: now

}

async function requestLoginEmailChange() {
  clearError();

  if (!currentUser || isAdminProxyMode) {
    showError("メールアドレス移行は会員本人のログイン時のみ利用できます。");
    return;
  }

  const newEmail = String(newLoginEmail?.value || "").trim().toLowerCase();
  const currentEmail = String(currentUser.email || "").trim().toLowerCase();

  if (!newEmail) {
    showError("移行先のメールアドレスを入力してください。");
    return;
  }

  if (newEmail === currentEmail) {
    showError("現在のメールアドレスと同じです。");
    return;
  }

  const ok = confirm(
    `ログイン先を ${newEmail} のGoogleアカウントへ移行します。\n\n` +
    "登録後はいったんログアウトし、新しいGoogleアカウントでログインしてください。\n" +
    "新しいアカウントでログインした時点で、商品・請求書・発送元などの会員データを引き継ぎます。"
  );
  if (!ok) return;

  try {
    const now = Date.now();
    const key = emailKey(newEmail);
    await update(ref(database), {
      [`accountMigrationRequests/${key}`]: {
        fromUid: currentUser.uid,
        oldEmail: currentEmail,
        newEmail,
        status: "pending",
        requestedAt: now,
        updatedAt: now
      },
      [`accountMigrationRequestsByOldUid/${currentUser.uid}`]: {
        emailKey: key,
        fromUid: currentUser.uid,
        oldEmail: currentEmail,
        newEmail,
        status: "pending",
        requestedAt: now,
        updatedAt: now
      },
      [`memberSettings/${currentUser.uid}/email`]: currentEmail,
      [`memberSettings/${currentUser.uid}/pendingEmail`]: newEmail,
      [`memberSettings/${currentUser.uid}/emailMigrationRequestedAt`]: now,
      [`memberSettings/${currentUser.uid}/updatedAt`]: now
    });

    if (newLoginEmail) newLoginEmail.value = "";
    alert("移行先メールを登録しました。ログアウト後、新しいGoogleアカウントで会員ログインしてください。");
  } catch (error) {
    console.error(error);
    showError("移行先メールの登録に失敗しました。Realtime Databaseのルールを確認してください。");
  }
}

async function activateAccountMigration(user) {
  const newEmail = String(user.email || "").trim().toLowerCase();
  if (!user?.uid || !newEmail) return { activated: false, message: "" };

  const key = emailKey(newEmail);
  let requestSnapshot;
  try {
    requestSnapshot = await get(ref(database, `accountMigrationRequests/${key}`));
  } catch (error) {
    console.error(error);
    return {
      activated: false,
      message: `移行予約の確認に失敗しました。Realtime Databaseの accountMigrationRequests/${key} を読めるルールになっているか確認してください。`
    };
  }

  if (!requestSnapshot.exists()) {
    return {
      activated: false,
      message: `このメールアドレスの移行予約が見つかりません。旧メールでログインし、設定変更から移行先メールを登録してください。確認キー: accountMigrationRequests/${key}`
    };
  }

  const request = requestSnapshot.val() || {};
  const fromUid = String(request.fromUid || "").trim();
  if (!fromUid || fromUid === user.uid || request.status === "completed") {
    return {
      activated: false,
      message: "移行予約の内容が不正、またはすでに完了しています。管理者に確認してください。"
    };
  }

  const oldUidRequestSnapshot = await get(ref(database, `accountMigrationRequestsByOldUid/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null }));
  const oldUidRequest = oldUidRequestSnapshot.exists() ? oldUidRequestSnapshot.val() || {} : {};
  if (oldUidRequest.newEmail && String(oldUidRequest.newEmail).trim().toLowerCase() !== newEmail) {
    return {
      activated: false,
      message: "移行予約のメールアドレスが一致しません。旧メールで移行先メールを登録し直してください。"
    };
  }

  const memberSnapshot = await get(ref(database, `members/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null }));

  const [settingsSnapshot, loginSnapshot, productsSnapshot, originsSnapshot, invoicesSnapshot, discordSnapshot] = await Promise.all([
    get(ref(database, `memberSettings/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null })),
    get(ref(database, `loginUsers/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null })),
    get(ref(database, `products/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null })),
    get(ref(database, `shippingOrigins/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null })),
    get(ref(database, `invoices/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null })),
    get(ref(database, `discordNotificationQueue/${fromUid}`)).catch(() => ({ exists: () => false, val: () => null }))
  ]);

  const hasOldData = memberSnapshot.val() === true || settingsSnapshot.exists() || loginSnapshot.exists() || productsSnapshot.exists();
  if (!hasOldData) {
    return {
      activated: false,
      message: "移行予約はありますが、旧UID側の会員データが見つかりません。旧UIDの memberSettings / loginUsers / products のいずれかを復元するか、管理者側で本登録し直してください。"
    };
  }

  const now = Date.now();
  const oldSettings = settingsSnapshot.exists() ? settingsSnapshot.val() || {} : {};
  const oldLogin = loginSnapshot.exists() ? loginSnapshot.val() || {} : {};
  const oldEmail = String(request.oldEmail || oldSettings.email || oldLogin.email || "").trim().toLowerCase();

  const updates = {
    [`members/${user.uid}`]: true,
    [`members/${fromUid}`]: null,
    [`memberSettings/${user.uid}`]: {
      ...oldSettings,
      email: newEmail,
      pendingEmail: null,
      previousEmail: oldEmail,
      migratedFromUid: fromUid,
      migratedAt: now,
      updatedAt: now
    },
    [`memberSettings/${fromUid}`]: null,
    [`loginUsers/${user.uid}`]: {
      ...oldLogin,
      uid: user.uid,
      email: newEmail,
      name: oldLogin.name || oldSettings.name || user.displayName || "",
      role: "member",
      migratedFromUid: fromUid,
      migratedAt: now,
      lastLoginAt: serverTimestamp()
    },
    [`loginUsers/${fromUid}`]: null,
    [`accountMigrationRequests/${key}`]: null,
    [`accountMigrationRequestsByOldUid/${fromUid}`]: null
  };

  const products = productsSnapshot.exists() ? productsSnapshot.val() : null;
  if (products) {
    updates[`products/${user.uid}`] = remapOwnerFields(products, user.uid, newEmail, now);
    updates[`products/${fromUid}`] = null;
  }

  const origins = originsSnapshot.exists() ? originsSnapshot.val() : null;
  if (origins) {
    updates[`shippingOrigins/${user.uid}`] = origins;
    updates[`shippingOrigins/${fromUid}`] = null;
  }

  const invoices = invoicesSnapshot.exists() ? invoicesSnapshot.val() : null;
  if (invoices) {
    updates[`invoices/${user.uid}`] = remapInvoiceOwnerFields(invoices, user.uid, newEmail, now);
    updates[`invoices/${fromUid}`] = null;
  }

  const discordQueue = discordSnapshot.exists() ? discordSnapshot.val() : null;
  if (discordQueue) {
    updates[`discordNotificationQueue/${user.uid}`] = discordQueue;
    updates[`discordNotificationQueue/${fromUid}`] = null;
  }

  await update(ref(database), updates);
  return { activated: true, message: "" };
}

function remapOwnerFields(records, uid, email, now) {
  return Object.fromEntries(Object.entries(records || {}).map(([key, value]) => {
    if (!value || typeof value !== "object" || Array.isArray(value)) return [key, value];
    return [key, {
      ...value,
      ownerUid: uid,
      ownerEmail: email,
      updatedAt: now
    }];
  }));
}

function remapInvoiceOwnerFields(records, uid, email, now) {
  return Object.fromEntries(Object.entries(records || {}).map(([key, value]) => {
    if (!value || typeof value !== "object" || Array.isArray(value)) return [key, value];
    return [key, {
      ...value,
      uid,
      email,
      updatedAt: now
    }];
  }));
}

async function activatePendingMember(user) {
  const email = String(user.email || "").trim().toLowerCase();
  if (!email) return false;

  const key = emailKey(email);
  const pendingSnapshot = await get(ref(database, `pendingMembers/${key}`));

  if (!pendingSnapshot.exists()) return false;

  const pending = pendingSnapshot.val() || {};
  const now = Date.now();

  await update(ref(database), {
    [`members/${user.uid}`]: true,
    [`memberSettings/${user.uid}`]: {
      managementNumber: pending.managementNumber || "",
      planType: pending.planType || "",
      driveBaseUrl: pending.driveBaseUrl || "",
      discordWebhookUrl: pending.discordWebhookUrl || "",
      pendingEmailKey: key,
      activatedAt: now,
      updatedAt: now
    },
    [`loginUsers/${user.uid}`]: {
      uid: user.uid,
      name: pending.name || user.displayName || "",
      email,
      role: "member",
      createdAt: now,
      lastLoginAt: now
    }
  });

  return true;
}

async function loadData() {
  if (!currentUser) return;

  try {
    const productsSnapshot = await get(ref(database, `products/${dataUid()}`));
    const originsSnapshot = await get(ref(database, `shippingOrigins/${dataUid()}`));
    const announcementsSnapshot = await get(ref(database, "announcements"));
    const basicInfoSnapshot = await get(ref(database, "settings/basicInfo")).catch(() => ({ exists: () => false, val: () => ({}) }));
    const invoicesSnapshot = await get(ref(database, `invoices/${dataUid()}`)).catch(() => ({ exists: () => false, val: () => ({}) }));
    const memberSettingsSnapshot = await get(ref(database, `memberSettings/${dataUid()}`)).catch(() => ({ exists: () => false, val: () => ({}) }));
    const loginUserSnapshot = await get(ref(database, `loginUsers/${dataUid()}`)).catch(() => ({ exists: () => false, val: () => ({}) }));
    const companyInfoSnapshot = await get(ref(database, "settings/companyInfo")).catch(() => ({ exists: () => false, val: () => ({}) }));

    productsCache = productsSnapshot.exists()
      ? Object.values(productsSnapshot.val()).sort((a, b) => {
          const aNumber = String(a.numbering || "");
          const bNumber = String(b.numbering || "");
          return aNumber.localeCompare(bNumber, "ja", { numeric: true });
        })
      : [];

    originsCache = originsSnapshot.exists()
      ? Object.values(originsSnapshot.val()).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ja"))
      : [];
    announcementsCache = announcementsSnapshot.exists()
      ? Object.values(announcementsSnapshot.val()).sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0))
      : [];

    basicInfoCache = basicInfoSnapshot.exists() ? basicInfoSnapshot.val() : {};

    invoicesCache = invoicesSnapshot.exists() ? invoicesSnapshot.val() : {};
    memberProfileCache = {
      ...(loginUserSnapshot.exists() ? loginUserSnapshot.val() : {}),
      ...(memberSettingsSnapshot.exists() ? memberSettingsSnapshot.val() : {})
    };
    companyInfoCache = companyInfoSnapshot.exists() ? companyInfoSnapshot.val() : {};
    renderMemberBadge();

    const registeredProducts = getRegisteredProducts();
    const storedProducts = getStoredProducts();
    const selectableIds = new Set(storedProducts.map((product) => product.id));
    selectedProductIds = new Set([...selectedProductIds].filter((id) => selectableIds.has(id)));

    document.getElementById("productCount").textContent = registeredProducts.length;
    document.getElementById("storedCount").textContent = storedProducts.length;
    document.getElementById("unshippedCount").textContent = groupedShippingItems(productsCache.filter((product) => hasValue(product.shippingRequest) && product.shippingStatus !== "shipped")).length;
    document.getElementById("shippedCount").textContent = groupedShippingItems(productsCache.filter((product) => product.shippingStatus === "shipped")).length;
    document.getElementById("basicInfoBox").innerHTML = basicInfoHtml();
    document.getElementById("recentAnnouncements").innerHTML = recentAnnouncementsHtml();
    document.getElementById("pastAnnouncements").innerHTML = pastAnnouncementsHtml();

    renderStoredList();
    renderShippingList();
    renderOriginList();
    renderInvoiceList();
  } catch (error) {
    console.error(error);
    showError("データの読み込みに失敗しました。");
  }
}

function getRegisteredProducts() {

  });
}

function renderShippingList() {
  unshippedFilterBtn.classList.toggle("active", shippingView === "unshipped");
  shippedFilterBtn.classList.toggle("active", shippingView === "shipped");

  const searchKeyword = normalizeSearch(shippingSearchInput.value);
  const filtered = productsCache
    .filter((product) => {
      if (!hasValue(product.shippingRequest)) return false;
      if (shippingView === "shipped") return product.shippingStatus === "shipped";
      return product.shippingStatus !== "shipped";
    })
    .filter((product) => {
      if (!searchKeyword) return true;
      return normalizeSearch(`${product.name || ""} ${product.numbering || ""}`).includes(searchKeyword);
    });
  const shippingItems = groupedShippingItems(filtered)
    .sort((a, b) => sortByShippingDateAndNumbering(a, b));

  document.getElementById("shippingList").innerHTML =
    shippingItems.length ? productTable(shippingItems, { mode: "shipping" }) : emptyHtml(searchKeyword ? "検索条件に一致する商品はありません" : (shippingView === "shipped" ? "発送済みの商品はありません" : "未発送の商品はありません"));
}

function groupedShippingItems(products) {
  const groups = new Map();
  const singles = [];

  products.forEach((product) => {
    const groupId = shipmentDisplayGroupKey(product);
    if (!groupId) {
      singles.push(product);
      return;
    }

    if (!groups.has(groupId)) groups.set(groupId, []);
    groups.get(groupId).push(product);
  });

  const grouped = [...groups.entries()].flatMap(([groupId, groupProducts]) => {
    const sortedProducts = groupProducts.slice().sort((a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true }));

    return sortedProducts.map((product, index) => ({
      ...product,
      shipmentGroupId: groupId,
      shipmentGroupCount: sortedProducts.length,
      bundleRole: index === 0 ? "parent" : "child",
      bundlePosition: sortedProducts.length === 1 ? "" : index === 0 ? "first" : index === sortedProducts.length - 1 ? "last" : "middle"
    }));
  });

  return [...grouped, ...singles];
}

function productTable(products, options = {}) {
  const mode = options.mode || "registered";
  const isRegistered = mode === "registered";
  const isStored = mode === "stored";
  const isShipping = mode === "shipping";

  return `
    <div class="table-wrap">
      <table class="products-table">
        <thead>
          <tr>
            ${isStored || isShipping ? "<th>発送</th>" : ""}
            <th>商品名</th>
            <th>ナンバリング</th>
            ${isShipping ? "<th>発送情報</th>" : ""}
            <th>${isShipping ? "商品情報" : "情報"}</th>
            ${isStored ? "<th>撮影日</th><th>料金</th>" : ""}
            ${isShipping ? shippingMetaHeaderHtml() : ""}
          </tr>
        </thead>
        <tbody>
          ${products.map((product) => productRow(product, mode)).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function productRow(product, mode = "registered") {
  const isRegistered = mode === "registered";
  const isStored = mode === "stored";
  const isShipping = mode === "shipping";

  return `
    <tr class="${bundleRowClass(product)}">
      ${isStored ? `
        <td class="shipping-cell">
          <input class="shipping-check" type="checkbox" ${selectedProductIds.has(product.id) ? "checked" : ""} onchange="toggleProductSelection('${escapeAttr(product.id)}', this.checked)">
        </td>
      ` : ""}
      ${isShipping ? `<td>${shippingCellHtml(product)}</td>` : ""}
      <td>${escapeHtml(product.name)}</td>
      <td>${escapeHtml(product.numbering || "-")}</td>
      ${isShipping ? `<td>${shippingInfoButtonHtml(product)}</td>` : ""}
      <td>
        <button class="secondary compact-btn" type="button" onclick="showInfo('${escapeAttr(product.id)}')">詳細</button>
      </td>
      ${isStored ? `<td>${escapeHtml(product.shootingDate || "-")}</td><td>${feeButtonHtml(product)}</td>` : ""}
      ${isShipping ? shippingMetaCellsHtml(product) : ""}
    </tr>
  `;
}

function shippingMetaHeaderHtml() {
  if (shippingView === "shipped") {

function bundleRowClass(product) {

function shipmentDisplayGroupKey(product) {
  if (product.shipmentGroupId) return `group_${product.shipmentGroupId}`;

  if (product.shippingStatus === "shipped" && hasValue(product.shippedDate)) {
    return [
      "shipped",
      product.shippedDate || "",
      product.shippingRequest || "",
      compactAddressKey(product.shippingDestination),
      compactAddressKey(product.shippingOrigin)

function compactAddressKey(value) {
  if (!value || typeof value !== "object") return "";
  return [
    value.name,
    value.postalCode,
    value.prefecture,
    value.address,
    value.building,
    value.phone,
    value.senderName

  return product.shippingStatus === "shipped"

}

function canEditProduct(product) {

function optionSummary(product) {
  const options = [];
  const optionObject = product.options || {};
  const optionLabels = Array.isArray(product.optionLabels) ? product.optionLabels : [];

  if (isOptionEnabled(product.optionVideo) || isOptionEnabled(optionObject.video)) options.push("動画撮影");
  if (isOptionEnabled(product.optionThanksCard) || isOptionEnabled(optionObject.thanksCard)) options.push("Thanksカード同梱");
  if (isOptionEnabled(product.optionOkirakuInsert) || isOptionEnabled(optionObject.okirakuInsert) || isOptionEnabled(product.optionOkirakuThanksCard) || isOptionEnabled(optionObject.okirakuThanksCard) || isOptionEnabled(product.optionFlyer) || isOptionEnabled(optionObject.flyer)) {
    options.push("お気楽便Thanksカード・チラシ同梱");
  }

  optionLabels.forEach((label) => {
    if (label && !options.includes(label)) options.push(label);
  });

  return options.length ? options.join("、") : "-";
}

function isOptionEnabled(value) {
  return value === true || value === "true" || value === "on" || value === 1 || value === "1";
}

function linkOrDash(value) {
  if (!hasValue(value)) return "-";
  return `<a href="${escapeAttr(value)}" target="_blank" rel="noopener">${escapeHtml(value)}</a>`;
}

function workRequestOptions(current) {
  const options = ["検品+写真", "写真のみ", "検品のみ", "保管のみ"];
  return `<option value="">選択してください</option>${options.map((option) => `
    <option value="${escapeAttr(option)}" ${String(current || "") === option ? "selected" : ""}>${escapeHtml(option)}</option>
  `).join("")}`;
}

function sortByShippingDateAndNumbering(a, b) {
  const groupCompare = String(a.shipmentGroupId || a.id || "").localeCompare(String(b.shipmentGroupId || b.id || ""), "ja", { numeric: true });
  if (a.shipmentGroupId && a.shipmentGroupId === b.shipmentGroupId) {
    if (a.bundleRole !== b.bundleRole) return a.bundleRole === "parent" ? -1 : 1;
  }

  const fallbackDate = shippingView === "shipped" ? "0000-00-00" : "9999-99-99";
  const dateCompare = String(b.shippedDate || fallbackDate).localeCompare(String(a.shippedDate || fallbackDate));
  if (dateCompare !== 0) return dateCompare;

  if (a.shipmentGroupId || b.shipmentGroupId) {
    if (groupCompare !== 0) return groupCompare;
  }

  return String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true });
}

function formatDate(value) {
  if (!value) return "-";

  const date = new Date(Number(value));
  if (Number.isNaN(date.getTime())) return "-";

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}/${month}/${day}`;
}

window.saveProductEdit = async function(event, productId) {
  event.preventDefault();
  clearError();

  if (!currentUser) return;

  const product = productsCache.find((item) => item.id === productId) || {};
  const formData = new FormData(event.target);
  const data = {
    name: String(formData.get("name") || "").trim(),
    numbering: String(formData.get("numbering") || "").trim(),
    workRequest: String(formData.get("workRequest") || "").trim(),
    bodyCount: String(formData.get("bodyCount") || "").trim(),
    lensCount: String(formData.get("lensCount") || "").trim(),
    optionVideo: formData.get("optionVideo") === "on",
    optionThanksCard: formData.get("optionThanksCard") === "on",
    optionOkirakuInsert: formData.get("optionOkirakuInsert") === "on",
    optionComment: String(formData.get("optionComment") || "").trim(),
    purchaseUrl: String(formData.get("purchaseUrl") || "").trim(),
    note: product.note || "",
    updatedAt: Date.now()
  };

  if (!data.name || !data.numbering || !data.workRequest || !data.bodyCount || !data.lensCount) {
    showError("商品名、ナンバリング、作業依頼、ボディ本数、レンズ本数は必須です。");
    return;
  }

  data.options = {
    video: data.optionVideo,
    thanksCard: data.optionThanksCard,
    okirakuThanksCard: data.optionOkirakuInsert,
    flyer: data.optionOkirakuInsert,
    okirakuInsert: data.optionOkirakuInsert,
    comment: data.optionComment
  };
  data.optionOkirakuThanksCard = data.optionOkirakuInsert;
  data.optionFlyer = data.optionOkirakuInsert;
  data.optionLabels = optionLabelsFromValues(data.optionVideo, data.optionThanksCard, data.optionOkirakuInsert);

  try {
    await update(ref(database, `products/${dataUid()}/${productId}`), data);
    closeModal();
    await loadData();
  } catch (error) {
    console.error(error);
    showError("登録内容の保存に失敗しました。Realtime Databaseのルールを確認してください。");
  }
};

window.sendProductInquiry = async function(event, productId) {
  event.preventDefault();
  clearError();

  if (!currentUser) return;

  const formData = new FormData(event.target);
  const title = String(formData.get("title") || "").trim();
  const message = String(formData.get("message") || "").trim();

  if (!message) {
    showError("お問い合わせ内容を入力してください。");
    return;
  }

  try {
    const now = Date.now();
    const inquiryId = `${now}`;

    await set(ref(database, `products/${dataUid()}/${productId}/inquiries/${inquiryId}`), {
      id: inquiryId,
      title,
      message,
      createdAt: now,
      createdBy: currentUser.uid,
      createdByEmail: currentUser.email || ""
    });

    await update(ref(database, `products/${dataUid()}/${productId}`), {
      latestInquiryAt: now,
      latestInquiryTitle: title,
      updatedAt: now
    });

    closeModal();
    await loadData();
    alert("お問い合わせを送信しました。");
  } catch (error) {
    console.error(error);
    showError("お問い合わせの送信に失敗しました。Realtime Databaseのルールを確認してください。");
  }
};

function buildPdfInvoiceRows(items) {
  return items
    .map((item) => {
      const hasInspection = item.inspectionFee !== "-";
      const hasShipping = item.shippingFee !== "-";
      const inspectionFee = hasInspection ? feeValue(item.inspectionFee) : 0;
      const shippingFee = hasShipping ? feeValue(item.shippingFee) : 0;
      const dates = [item.inspectionDate, item.shippingDate].filter((date) => hasValue(date) && date !== "-").sort();
      const noteParts = [`${item.name || "-"} / ${item.numbering || "-"}`];
      if (item.shippingNote) noteParts.push(item.shippingNote);
      if (item.options && item.options !== "-") noteParts.push(item.options);

      return {
        date: dates[0] || "-",
        numbering: item.numbering || "-",
        hasInspection,
        inspectionFee,
        hasShipping,
        shippingFee,
        total: inspectionFee + shippingFee,
        note: noteParts.join(" / ")
      };
    })
    .filter((row) => row.total > 0 || row.hasShipping)
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || ""), "ja", { numeric: true }));
}

function confirmationResultDisplayHtml(product) {
  const values = product.confirmationTemplate || {};
  const entries = Object.entries(values).filter(([key, entry]) => {
    if (key === "productNote") return false;
    if (!entry || typeof entry !== "object") return false;
    return hasValue(entry.value) || hasValue(entry.comment) || hasValue(entry.defaultComment);
  }).map(([, entry]) => entry);

  if (!entries.length) {
    return confirmationResultTextTableHtml(product.confirmationResult) || escapeHtml(product.confirmationResult || "-").replace(/\n/g, "<br>");
  }

  const entryByLabel = new Map(entries.map((entry) => [entry.label, entry]));
  const usedLabels = new Set();
  const groups = memberConfirmationRows().map((group) => {
    const rows = group.rows.map((row) => {
      const entry = entryByLabel.get(row.label);
      usedLabels.add(row.label);
      return {
        label: entry?.label || row.label,
        value: entry?.value || "-",
        comment: entry?.comment || entry?.defaultComment || "-"
      };
    });
    return { section: group.section, rows };
  });

  entries
    .filter((entry) => !usedLabels.has(entry.label))
    .forEach((entry) => {
      const sectionName = entry.section || "その他";
      let group = groups.find((item) => item.section === sectionName);
      if (!group) {
        group = { section: sectionName, rows: [] };
        groups.push(group);
      }
      group.rows.push({
        label: entry.label || "-",
        value: entry.value || "-",
        comment: entry.comment || entry.defaultComment || "-"
      });
  });

  const body = groups.map((group) => `
    <tr class="confirmation-section"><td colspan="3">＜${escapeHtml(group.section)}＞</td></tr>
    ${group.rows.map((row) => `
      <tr>
        <td>${escapeHtml(row.label || "-")}</td>
        <td>${escapeHtml(row.value || "-")}</td>
        <td>${lineBreaks(row.comment || "-")}</td>
      </tr>
    `).join("")}
  `).join("");

  return `
    <div class="confirmation-table-wrap">
      <table class="confirmation-table">
        <thead>
          <tr>
            <th>項目</th>
            <th>結果</th>
            <th>コメント</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

function confirmationResultTextTableHtml(text) {
  const source = String(text || "").replace(/\s+/g, " ").trim();
  if (!source || source === "-") return "";

  const groups = memberConfirmationRows()
    .map((group, groupIndex, allGroups) => {
      const sectionMarker = `＜${group.section}＞`;
      const sectionStart = source.indexOf(sectionMarker);

      const nextSectionStart = allGroups
        .slice(groupIndex + 1)
        .map((nextGroup) => source.indexOf(`＜${nextGroup.section}＞`, Math.max(sectionStart, 0) + sectionMarker.length))
        .filter((index) => index !== -1)
        .sort((a, b) => a - b)[0];

      const sectionText = sectionStart === -1
        ? ""
        : source.slice(sectionStart + sectionMarker.length, nextSectionStart || source.length).trim();
      const rows = group.rows
        .map((row, rowIndex) => {
          const rowStart = sectionText.indexOf(row.label);
          if (rowStart === -1) return { label: row.label, value: "-", comment: "-" };

          const nextRowStart = group.rows
            .slice(rowIndex + 1)
            .map((nextRow) => sectionText.indexOf(nextRow.label, rowStart + row.label.length))
            .filter((index) => index !== -1)
            .sort((a, b) => a - b)[0];

          const rawValue = sectionText.slice(rowStart + row.label.length, nextRowStart || sectionText.length).trim();
          const parsed = splitConfirmationResultValue(rawValue);
          return { label: row.label, value: parsed.value, comment: parsed.comment };
        })

      return { section: group.section, rows };
    })
    .filter((group) => group.rows.length);

  if (!groups.length) return "";
  return confirmationResultTableHtml(groups);
}

function splitConfirmationResultValue(rawValue) {
  const value = String(rawValue || "").trim();
  if (!value) return { value: "-", comment: "-" };

  const candidates = ["ほとんどない", "使用感あり", "欠損なし", "破損なし", "汚れなし", "曇りあり", "カビ", "チリの混入小", "雨玉にきず", "コーティング剥がれあり", "した", "可能", "できる", "OK", "効かない", "ない", "ある", "良好", "要確認", "その他", "-"]
    .sort((a, b) => b.length - a.length);

  const matched = candidates.find((option) => value.startsWith(option));
  if (!matched) return { value, comment: "-" };

  const comment = value.slice(matched.length).trim();
  return { value: matched, comment: comment || "-" };
}

function confirmationResultTableHtml(groups) {
  const body = groups.map((group) => `
    <tr class="confirmation-section"><td colspan="3">＜${escapeHtml(group.section)}＞</td></tr>

}

function feeDetailLine(product, type) {
  const isInspection = type === "inspection";
  const date = isInspection ? product.shootingDate : product.shippedDate;
  const month = hasValue(date) ? String(date).slice(0, 7) : "";
  const invoiceItem = findInvoiceItem(month, product.id);
  const billedAmount = invoiceItem
    ? isInspection ? invoiceItem.inspectionFee : invoiceItem.shippingFee
    : null;
  const isBilled = billedAmount !== null && billedAmount !== undefined && billedAmount !== "-";

  if (isBilled) {
    return {
      label: isInspection ? "検品代金" : "送料",
      date: date || "-",
      month: month || "-",
      amount: feeValue(billedAmount),
      status: "請求済み"
    };
  }

  if (isInspection) {
    const hasInspection = hasValue(product.shootingDate);
    return {
      label: "検品代金",
      date: product.shootingDate || "-",
      month: month || "-",
      amount: hasInspection ? inspectionFeeFor(product) : "-",
      status: hasInspection ? "請求予定" : "-"
    };
  }

  const hasShipping = hasValue(product.shippedDate) || hasValue(product.shippingRequest);
  const shippingMonth = hasValue(product.shippedDate) ? String(product.shippedDate).slice(0, 7) : "-";
  return {
    label: "送料",
    date: product.shippedDate || "-",
    month: shippingMonth,
    amount: hasShipping ? scheduledShippingFeeFor(product) : "-",
    status: hasShipping ? "請求予定" : "-"
  };
}

function findInvoiceItem(month, productId) {
  if (!month) return null;
  const invoice = invoicesCache?.[month];
  if (!invoice) return null;
  return Object.values(invoice.items || {}).find((item) => item.productId === productId) || null;
}

function inspectionFeeFor(product) {
  if (product.workRequest === "保管のみ") return 0;
  if (product.workRequest === "返品対応" || shippingKey(product.shippingRequest) === "return") return PRICE_TABLE.returnHandling;
  if (product.workRequest === "写真のみ") return PRICE_TABLE.photoOnly;
  if (product.workRequest === "検品のみ") return PRICE_TABLE.inspectionOnly;

  let fee = PRICE_TABLE.inspectionBase + Math.max(0, numberValue(product.bodyCount) + numberValue(product.lensCount) - 1) * PRICE_TABLE.additionalKitItem;

  if (isOptionEnabled(product.optionVideo) || isOptionEnabled(product.options?.video)) {
    fee += PRICE_TABLE.video;
  }

  return fee;
}

function scheduledShippingFeeFor(product) {
  if (product.shippedDate && shipmentDisplayGroupKey(product)) {
    const month = String(product.shippedDate).slice(0, 7);
    const chargedIds = chargedShippingProductIds(productsCache, month);
    if (!chargedIds.has(product.id)) return 0;
  }

  return shippingFeeFor(product);
}

function shippingFeeFor(product) {
  if (product.shippingStatus === "cash_on_delivery") return 0;
  if (hasValue(product.shippingPrice)) return numberValue(product.shippingPrice);

  const tablePrice = autoShippingPriceFor(product, product.shippingSize, product.shippingStatus);
  if (hasValue(tablePrice)) return numberValue(tablePrice);

  return 0;
}

function autoShippingPriceFor(product, size, status = product?.shippingStatus) {
  if (status === "cash_on_delivery") return 0;

  const normalizedSize = String(size || "").trim();
  if (!normalizedSize) return "";
  if (normalizedSize === "海外発送") return PRICE_TABLE.overseasHandling;

  const rates = SHIPPING_RATE_TABLE[normalizedSize];
  const region = shippingRegionFor(product?.shippingDestination?.prefecture);
  if (!rates || !region || !hasValue(rates[region])) return "";

  return rates[region];
}

function chargedShippingProductIds(products, month) {
  const groups = new Map();
  const chargedIds = new Set();

  products
    .filter((product) => matchesMonth(product.shippedDate, month))
    .forEach((product) => {
      const groupKey = shipmentDisplayGroupKey(product) || product.id;

      if (!groups.has(groupKey)) groups.set(groupKey, []);
      groups.get(groupKey).push(product);
    });

  groups.forEach((groupProducts) => {
    const first = groupProducts
      .slice()
      .sort((a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true }))[0];

    if (first?.id) chargedIds.add(first.id);
  });

  return chargedIds;
}

function shippingKey(value) {
  if (value === "国内発送") return "domestic";
  if (value === "海外発送") return "overseas";
  if (value === "返品依頼") return "return";
  return "";
}

function shippingRegionFor(prefecture) {
  const value = String(prefecture || "").trim();
  if (!value) return "";
  if (value === "静岡県") return "shizuoka";
  if (value === "北海道") return "hokkaido";
  if (value === "沖縄県") return "okinawa";

  const kyushu = ["福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県"];
  if (kyushu.includes(value)) return "kyushu";

  const tohokuChugokuShikoku = [
    "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
    "鳥取県", "島根県", "岡山県", "広島県", "山口県",
    "徳島県", "香川県", "愛媛県", "高知県"
  ];
  if (tohokuChugokuShikoku.includes(value)) return "tohokuChugokuShikoku";

  return "main";
}

function matchesMonth(dateValue, selectedMonth) {
  if (!dateValue || !selectedMonth) return false;
  return normalizeInvoiceMonth(dateValue) === selectedMonth;
}

function normalizeInvoiceMonth(value) {
  if (!hasValue(value)) return "";

  if (typeof value === "number") {
    const date = new Date(value);
    if (!Number.isNaN(date.getTime())) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
    }
  }

  const text = String(value || "").trim();
  const match = text.match(/^(\d{4})[-\/年\.\s](\d{1,2})/);
  if (!match) return "";

  return `${match[1]}-${String(Number(match[2])).padStart(2, "0")}`;
}

function closeModal() {
  modalBackdrop.classList.remove("show");
  modalBody.textContent = "";
}

function closeShippingModal() {
  shippingModalBackdrop.classList.remove("show");
}

function showLoginUI() {
  currentUser = null;
  memberProfileCache = {};
  if (memberBadge) memberBadge.textContent = "会員";
  loginArea.classList.remove("hidden");
  appArea.classList.add("hidden");
}

function showAppUI(user) {
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  userEmail.textContent = user.email || user.displayName || user.uid;
  renderMemberBadge();
  renderMemberSettings();
}

function renderMemberBadge() {
  if (!memberBadge) return;
  const managementNumber = String(memberProfileCache.managementNumber || "").trim();
  memberBadge.textContent = managementNumber ? `会員番号 ${managementNumber}` : "会員";
}

function emptyHtml(message) {
  return `<div class="empty"><h3>${escapeHtml(message)}</h3></div>`;
}

function downloadCsv(rows, filename) {
  const csv = rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function csvCell(value) {
  return `"${String(value ?? "").replaceAll('"', '""')}"`;
}

function feeValue(value) {
  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  const cleaned = String(value ?? "").replace(/[^\d.-]/g, "");
  const parsed = Number(cleaned);
  return Number.isFinite(parsed) ? parsed : 0;
}

function numberValue(value) {
  const parsed = Number(String(value ?? "").replace(/[^\d.-]/g, ""));
  return Number.isFinite(parsed) ? parsed : 0;
}

function yen(value) {
  return Number(feeValue(value)).toLocaleString("ja-JP");
}

function lineBreaks(value) {
  return escapeHtml(value || "").replace(/\n/g, "<br>");
}

function todayString() {
  const date = new Date();
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function formatDateOnly(value) {
  if (!value) return "-";
  const date = new Date(Number(value));
  if (Number.isNaN(date.getTime())) return "-";
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}/${month}/${day}`;
}

function showLoginError(message) {
  loginError.textContent = message;
  loginError.classList.add("show");
}

function clearLoginError() {
  loginError.textContent = "";
  loginError.classList.remove("show");
}

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.classList.add("show");
}

function clearError() {
  errorMessage.textContent = "";
  errorMessage.classList.remove("show");
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function normalizeSearch(value) {
  return String(value || "")
    .toLocaleLowerCase("ja-JP")
    .replace(/\s+/g, "");
}

function emailKey(email) {
  return String(email || "")
    .trim()
    .toLowerCase()
    .replace(/[.#$/\[\]]/g, "_");
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}
</script>
