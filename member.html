<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お気楽便 - 会員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px}
button,input,textarea,select{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#1f2937}
button.secondary:hover{background:#dfe7f1}
button.danger{background:#fee2e2;color:#b91c1c}
button.danger:hover{background:#fecaca}
.container{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;max-width:1280px;margin:0 auto}
.login-container{max-width:520px;margin:80px auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px}
.login-title{font-size:28px;font-weight:800;color:#2563eb;margin-bottom:12px}
.login-text{color:#6b7280;margin-bottom:24px;line-height:1.7}
.login-button{width:100%;font-size:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;color:#2563eb}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800}
.logout{background:#eef2f7;color:#1f2937}
.tabs{display:flex;gap:10px;border-bottom:2px solid #e5e7eb;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.section{display:none}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat,.form{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:20px}
.stat-label{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:#2563eb}
.form{margin-top:16px}
.form-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.product-entry{border:1px solid #dbe3ef;border-radius:10px;background:#f8fafc;padding:18px;margin-bottom:16px}
.product-entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.product-entry-title{font-weight:800;color:#1f2937}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-group{margin-bottom:16px}
.form-group.full{grid-column:1/-1}
label{display:block;margin-bottom:8px;font-weight:700}
input,textarea,select{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:10px;font-size:14px;background:#fff}
textarea{min-height:88px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
.products-table{width:100%;border-collapse:collapse;min-width:760px}
.products-table th{background:#6b7280;color:#fff;text-align:left;font-size:13px;padding:8px 10px;white-space:nowrap}
.products-table td{border-top:1px solid #e5e7eb;padding:8px 10px;vertical-align:middle;font-size:14px}
.products-table tr:nth-child(even){background:#fafafa}
.shipping-cell{background:#fffde7;text-align:center;width:46px;min-width:46px;max-width:46px;padding-left:6px!important;padding-right:6px!important}
.member-meta{font-size:12px;color:#64748b;margin-top:4px;line-height:1.35}
.bundle-note{display:inline-flex;align-items:center;border-radius:999px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;padding:3px 8px;font-size:12px;font-weight:800;margin-top:5px;white-space:nowrap}
.bundle-label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid #111;color:#111;background:#f3f4f6;padding:5px 10px;font-size:12px;font-weight:800;line-height:1;white-space:nowrap}
.dash-mark{color:#1f2937;font-size:14px;font-weight:400;line-height:1}
.dash-mark::before{content:"-"}
.products-table tr.bundle-first td{box-shadow:inset 0 2px 0 #111}
.products-table tr.bundle-middle td,.products-table tr.bundle-last td{border-top-color:transparent}
.products-table tr.bundle-last td{box-shadow:inset 0 -2px 0 #111}
.products-table tr.bundle-first td:first-child{box-shadow:inset 2px 0 0 #111,inset 0 2px 0 #111}
.products-table tr.bundle-first td:last-child{box-shadow:inset -2px 0 0 #111,inset 0 2px 0 #111}
.products-table tr.bundle-middle td:first-child{box-shadow:inset 2px 0 0 #111}
.products-table tr.bundle-middle td:last-child{box-shadow:inset -2px 0 0 #111}
.products-table tr.bundle-last td:first-child{box-shadow:inset 2px 0 0 #111,inset 0 -2px 0 #111}
.products-table tr.bundle-last td:last-child{box-shadow:inset -2px 0 0 #111,inset 0 -2px 0 #111}
.products-table tr.bundle-single td{box-shadow:inset 0 2px 0 #111,inset 0 -2px 0 #111}
.products-table tr.bundle-single td:first-child{box-shadow:inset 2px 0 0 #111,inset 0 2px 0 #111,inset 0 -2px 0 #111}
.products-table tr.bundle-single td:last-child{box-shadow:inset -2px 0 0 #111,inset 0 2px 0 #111,inset 0 -2px 0 #111}
.shipping-check{width:auto}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.domestic{background:#dbeafe;color:#1d4ed8}
.status-pill.overseas{background:#dcfce7;color:#15803d}
.status-pill.return{background:#fee2e2;color:#b91c1c}
.status-pill.none{background:#f3f4f6;color:#6b7280}
.compact-btn{padding:7px 10px;font-size:12px}
.ship-filter{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px}
.ship-filter-btn{background:#fff;color:#9ca3af;border-bottom:2px solid #d1d5db;border-radius:0;min-width:160px}
.ship-filter-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.ship-filter-btn:hover{background:#f8fafc}
.section-tools{display:flex;justify-content:flex-end;margin:-4px 0 14px}
.section-search{width:min(360px,100%);min-height:40px}
.bulk-action-bar{display:none;position:sticky;bottom:0;margin-top:12px;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 24px rgba(15,23,42,.12);z-index:5}
.bulk-action-bar.show{display:grid}
.bulk-btn{border-radius:0;padding:18px 12px;font-size:15px}
.bulk-btn.domestic{background:#334155}
.bulk-btn.overseas{background:#5acb88}
.bulk-btn.return{background:#f59e0b}
.origin-list{display:grid;gap:12px;margin-top:18px}
.origin-card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;background:#fff}
.origin-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.origin-title{font-weight:800}
.origin-meta{font-size:13px;color:#4b5563;line-height:1.7}
.empty{padding:32px;text-align:center;color:#6b7280}
.error{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6}
.error.show{display:block}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.modal-body{line-height:1.8;white-space:pre-wrap}
.detail-section{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.detail-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;color:#2563eb;margin-bottom:8px}
.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.detail-label{color:#6b7280;font-weight:700}
.modal-form{display:grid;gap:14px}
.modal-section-title{background:#eaf2ff;color:#1d4ed8;font-weight:800;padding:9px 12px;margin:8px 0}
.required{display:inline-block;background:#ef4444;color:#fff;border-radius:4px;padding:2px 6px;font-size:11px;margin-left:8px}
.announcement-list{display:grid;gap:12px}
.announcement-card{border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc;padding:14px}
.announcement-date{color:#6b7280;font-size:12px;font-weight:800;margin-bottom:6px}
.announcement-message{font-weight:700;line-height:1.7;white-space:pre-wrap}
.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inquiry-box{display:flex;align-items:center;gap:8px;white-space:nowrap}
.invoice-year{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:16px}
.invoice-year-title{font-size:18px;font-weight:800;margin-bottom:14px;color:#1f2937}
.invoice-grid{display:grid;grid-template-columns:repeat(2,120px);gap:12px}
.invoice-month-card{width:120px;aspect-ratio:1/1;border:1px solid #dbe3ef;border-radius:8px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.invoice-month-card.available{background:#eff6ff;border-color:#bfdbfe}
.invoice-month{font-size:18px;font-weight:800;color:#1f2937}
.invoice-downloads{display:flex;gap:6px}
.invoice-downloads button{padding:6px 8px;font-size:12px}
.invoice-empty{font-size:12px;color:#9ca3af}
@media(max-width:700px){
  body{padding:10px;font-size:14px;overflow-x:hidden}
  .container,.login-container{width:100%;padding:18px;border-radius:8px}
  .login-container{margin:42px auto}
  .title,.login-title{font-size:24px}
  .header{align-items:stretch;flex-direction:column;gap:12px;margin-bottom:18px}
  .user{align-items:stretch;flex-direction:column;gap:8px}
  .badge{width:max-content}
  .logout{width:100%}
  .tabs{gap:4px;overflow-x:auto;flex-wrap:nowrap;margin-bottom:18px}
  .tab{min-width:96px;padding:9px 8px;font-size:13px;white-space:nowrap}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:14px}
  .stat-value{font-size:26px}
  .form{padding:14px}
  .form-header{align-items:stretch;flex-direction:column}
  .form-header button{width:100%}
  .product-entry{padding:14px}
  .product-entry-head{align-items:stretch;flex-direction:column}
  .form-grid{grid-template-columns:1fr;gap:10px}
  .form-group.full{grid-column:auto}
  input,textarea,select{font-size:16px}
  .ship-filter{justify-content:flex-start;overflow-x:auto}
  .ship-filter-btn{min-width:132px;padding:9px 10px;font-size:13px}
  .section-tools{justify-content:stretch}
  .section-search{width:100%}
  .table-wrap{overflow-x:auto}
  .products-table{min-width:640px}
  .products-table th,.products-table td{padding:7px 8px;font-size:13px}
  .bulk-action-bar{grid-template-columns:1fr;position:static}
  .bulk-btn{padding:14px 10px;font-size:14px}
  .invoice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .invoice-month-card{width:100%}
  .modal-backdrop{align-items:flex-start;padding:10px}
  .modal{width:100%;max-width:none;min-width:0;max-height:calc(100vh - 20px);padding:16px}
  .modal-head{align-items:stretch;flex-direction:column}
  .modal-title{font-size:18px}
  .detail-heading{align-items:stretch;flex-direction:column}
  .detail-grid{grid-template-columns:1fr;gap:4px}
  .detail-label{margin-top:8px}
  .origin-card-head{align-items:stretch;flex-direction:column}
  button{min-height:40px}
}
</style>
</head>
<body>

<section class="login-container" id="loginArea">
  <div class="error" id="loginError"></div>
  <h1 class="login-title">お気楽便</h1>
  <p class="login-text">会員としてログインしてください。</p>
  <button class="login-button" id="loginBtn" type="button">Googleで会員ログイン</button>
</section>

<div class="container hidden" id="appArea">
  <div class="error" id="errorMessage"></div>

  <header class="header">
    <h1 class="title">お気楽便</h1>
    <div class="user">
      <span id="userEmail"></span>
      <span class="badge">会員</span>
      <button class="logout" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" type="button">トップ</button>
    <button class="tab" data-tab="register" type="button">商品登録</button>
    <button class="tab" data-tab="stored" type="button">保管商品</button>
    <button class="tab" data-tab="shipping" type="button">発送管理</button>
    <button class="tab" data-tab="origins" type="button">発送元登録</button>
    <button class="tab" data-tab="invoices" type="button">請求書DL</button>
  </nav>

  <section class="section show" id="overview">
    <div class="grid">
      <div class="stat"><div class="stat-label">登録済み商品</div><div class="stat-value" id="productCount">0</div></div>
      <div class="stat"><div class="stat-label">保管商品</div><div class="stat-value" id="storedCount">0</div></div>
      <div class="stat"><div class="stat-label">未発送</div><div class="stat-value" id="unshippedCount">0</div></div>
      <div class="stat"><div class="stat-label">発送済み</div><div class="stat-value" id="shippedCount">0</div></div>
    </div>

    <h2 style="margin-bottom:16px;">最近のお知らせ</h2>
    <div id="recentAnnouncements"></div>
  </section>

  <section class="section" id="register">
    <div class="form">
      <div class="form-header">
        <h2>商品を登録する</h2>
        <button class="secondary" id="addEntryBtn" type="button">追加</button>
      </div>

      <form id="productForm">
        <div id="productEntries"></div>
        <button id="registerProductsBtn" type="button" style="width:100%;">登録する</button>
      </form>
    </div>
  </section>

  <section class="section" id="stored">
    <h2 style="margin-bottom:16px;">保管商品</h2>

    <div class="ship-filter">
      <button class="ship-filter-btn active" id="storedFilterBtn" type="button">保管商品</button>
      <button class="ship-filter-btn" id="registeredStoredFilterBtn" type="button">登録済み商品</button>
    </div>

    <div class="section-tools">
      <input id="storedSearchInput" class="section-search" type="search" placeholder="商品名・ナンバリングで検索">
    </div>

    <div id="storedList"></div>
  </section>

  <section class="section" id="shipping">
    <h2 style="margin-bottom:16px;">発送管理</h2>
    <div class="ship-filter">
      <button class="ship-filter-btn active" id="unshippedFilterBtn" type="button">未発送</button>
      <button class="ship-filter-btn" id="shippedFilterBtn" type="button">発送済み</button>
    </div>
    <div class="section-tools">
      <input id="shippingSearchInput" class="section-search" type="search" placeholder="商品名・ナンバリングで検索">
    </div>
    <div id="shippingList"></div>
  </section>

  <section class="section" id="origins">
    <div class="form">
      <div class="form-header">
        <h2>発送元を登録する</h2>
        <button class="secondary" id="clearOriginBtn" type="button">追加</button>
      </div>

      <form id="originForm">
        <input type="hidden" id="originId">

        <div class="form-grid">
          <div class="form-group">
            <label>発送元名 *</label>
            <input id="originName" type="text" required placeholder="例：自宅 / 倉庫A">
          </div>

          <div class="form-group">
            <label>郵便番号 *</label>
            <input id="originPostalCode" type="text" required placeholder="例：4370021">
          </div>

          <div class="form-group">
            <label>都道府県 *</label>
            <input id="originPrefecture" type="text" required placeholder="例：静岡県">
          </div>

          <div class="form-group">
            <label>住所 *</label>
            <input id="originAddress" type="text" required placeholder="例：袋井市広岡1290-8">
          </div>

          <div class="form-group">
            <label>アパート名、会社名など</label>
            <input id="originBuilding" type="text">
          </div>

          <div class="form-group">
            <label>お名前 *</label>
            <input id="originSenderName" type="text" required>
          </div>

          <div class="form-group">
            <label>電話番号</label>
            <input id="originPhone" type="text">
          </div>
        </div>

        <button type="submit" style="width:100%;">保存する</button>
      </form>
    </div>

    <div class="origin-list" id="originList"></div>
  </section>

  <section class="section" id="invoices">
    <h2 style="margin-bottom:16px;">請求書ダウンロード</h2>
    <div id="invoiceList"></div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="secondary compact-btn" id="modalCloseBtn" type="button">閉じる</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="shippingModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="shippingModalTitle">発送先情報</div>
      <button class="secondary compact-btn" id="shippingModalCloseBtn" type="button">閉じる</button>
    </div>

    <form class="modal-form" id="shippingForm">
      <input type="hidden" id="shippingRequestType">

      <div class="modal-section-title">発送先住所</div>

      <div class="form-grid">
        <div class="form-group">
          <label>宛名 <span class="required">必須</span></label>
          <input id="destName" type="text" required>
        </div>

        <div class="form-group">
          <label>郵便番号 <span class="required">必須</span></label>
          <input id="destPostalCode" type="text" required>
        </div>

        <div class="form-group">
          <label>都道府県 <span class="required">必須</span></label>
          <input id="destPrefecture" type="text" required>
        </div>

        <div class="form-group">
          <label>住所 <span class="required">必須</span></label>
          <input id="destAddress" type="text" required>
        </div>

        <div class="form-group">
          <label>アパート名、会社名など</label>
          <input id="destBuilding" type="text">
        </div>

        <div class="form-group">
          <label>電話番号</label>
          <input id="destPhone" type="text">
        </div>

        <div class="form-group">
          <label>配送希望日</label>
          <input id="deliveryDate" type="date">
        </div>

        <div class="form-group">
          <label>配送希望時間</label>
          <select id="deliveryTime">
            <option value="">なし</option>
            <option value="午前中">午前中</option>
            <option value="14-16時">14-16時</option>
            <option value="16-18時">16-18時</option>
            <option value="18-20時">18-20時</option>
            <option value="19-21時">19-21時</option>
          </select>
        </div>

        <div class="form-group full">
          <label>備考</label>
          <textarea id="shippingNote"></textarea>
        </div>
      </div>

      <div class="modal-section-title">発送元住所</div>

      <div class="form-group">
        <label>登録済み発送元 <span class="required">必須</span></label>
        <select id="originSelect" required></select>
      </div>

      <button type="submit" style="width:100%;">発送依頼を作成する</button>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase,
  ref,
  get,
  set,
  update,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
  authDomain: "okirakubin-manager.firebaseapp.com",
  projectId: "okirakubin-manager",
  storageBucket: "okirakubin-manager.firebasestorage.app",
  messagingSenderId: "387991576787",
  appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const database = getDatabase(
  app,
  "https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let currentUser = null;
let productsCache = [];
let originsCache = [];
let announcementsCache = [];
let invoicesCache = {};
let entryCount = 0;
let storedView = "stored";
let shippingView = "unshipped";
let selectedProductIds = new Set();

const loginArea = document.getElementById("loginArea");
const appArea = document.getElementById("appArea");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

onAuthStateChanged(auth, async (user) => {
  clearLoginError();
  clearError();

  if (!user) {
    showLoginUI();
    return;
  }

  try {
    const memberSnapshot = await get(ref(database, `members/${user.uid}`));
    const isMember = memberSnapshot.exists() && memberSnapshot.val() === true;

    if (!isMember) {
      await signOut(auth);
      showLoginUI();
      showLoginError("このアカウントは会員として登録されていません。");
      return;
    }

    currentUser = user;

    await update(ref(database, `loginUsers/${user.uid}`), {
      uid: user.uid,
      name: user.displayName || "",
      email: user.email || "",
      role: "member",
      lastLoginAt: serverTimestamp()
    });

    showAppUI(user);
    resetEntries();
    await loadData();
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showLoginUI();
    showLoginError("会員情報の確認に失敗しました。Realtime Databaseのルールとデータを確認してください。");
  }
});

    return;
  }

  const entries = [...document.querySelectorAll(".product-entry")];
  const payloads = entries.map((entry) => {
    return {
      name: entry.querySelector('[data-field="name"]').value.trim(),
      numbering: entry.querySelector('[data-field="numbering"]').value.trim(),
      workRequest: entry.querySelector('[data-field="workRequest"]').value,
      bodyCount: entry.querySelector('[data-field="bodyCount"]').value.trim(),
      lensCount: entry.querySelector('[data-field="lensCount"]').value.trim(),

      note: entry.querySelector('[data-field="note"]').value.trim(),

    return;
  }

  try {
    const now = Date.now();

    await Promise.all(payloads.map((item, index) => {
      const productId = `${now}_${index}`;

      return set(ref(database, `products/${currentUser.uid}/${productId}`), {
        id: productId,
        ownerUid: currentUser.uid,
        ownerEmail: currentUser.email || "",
        name: item.name,
        numbering: item.numbering,
        workRequest: item.workRequest,
        bodyCount: item.bodyCount,
        lensCount: item.lensCount,
        optionVideo: item.optionVideo,
        optionThanksCard: item.optionThanksCard,
        optionOkirakuThanksCard: item.optionOkirakuInsert,
        optionFlyer: item.optionOkirakuInsert,
        optionOkirakuInsert: item.optionOkirakuInsert,
        optionComment: item.optionComment,
        options: {
          video: item.optionVideo,
          thanksCard: item.optionThanksCard,
          okirakuThanksCard: item.optionOkirakuInsert,
          flyer: item.optionOkirakuInsert,
          okirakuInsert: item.optionOkirakuInsert,
          comment: item.optionComment
        },
        optionLabels: optionLabelsFromValues(item.optionVideo, item.optionThanksCard, item.optionOkirakuInsert),
        note: item.note,
        purchaseUrl: item.purchaseUrl,
        shippingRequest: "",
        shippingStatus: "unshipped",
        shippingDestination: null,
        shippingOrigin: null,
        confirmationDate: "",
        confirmationResult: "",
        photoUrl: "",
        expectedSize: "",
        shootingDate: "",
        storageLocation: "",
        status: "registered",
        createdAt: now + index,
        updatedAt: now

    }));

    productForm.reset();
    resetEntries();
    selectedProductIds.clear();

  } catch (error) {
    console.error(error);
    showError("商品の登録に失敗しました。Realtime Databaseのルールを確認してください。");
  }
});

shippingForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();

  if (!currentUser || !selectedProductIds.size) return;

  const selectedOrigin = originsCache.find((origin) => origin.id === originSelect.value);
  if (!selectedOrigin) {
    showError("発送元を選択してください。");
    return;
  }

  const destination = {
    name: document.getElementById("destName").value.trim(),
    postalCode: document.getElementById("destPostalCode").value.trim(),
    prefecture: document.getElementById("destPrefecture").value.trim(),
    address: document.getElementById("destAddress").value.trim(),
    building: document.getElementById("destBuilding").value.trim(),
    phone: document.getElementById("destPhone").value.trim(),
    deliveryDate: document.getElementById("deliveryDate").value,
    deliveryTime: document.getElementById("deliveryTime").value,
    note: document.getElementById("shippingNote").value.trim()
  };

  if (!destination.name || !destination.postalCode || !destination.prefecture || !destination.address) {
    showError("発送先の宛名、郵便番号、都道府県、住所は必須です。");
    return;
  }

  try {
    const now = Date.now();
    const requestType = shippingRequestType.value;
    const selectedIds = [...selectedProductIds];
    const selectedProducts = productsCache.filter((product) => selectedProductIds.has(product.id));
    const shipmentGroupId = `${now}_${requestType}`;
    const shipmentGroupCount = selectedIds.length;
    const shipmentGroupNames = selectedProducts.map((product) => product.name || "").filter(Boolean).join(" / ");
    const shipmentGroupNumberings = selectedProducts.map((product) => product.numbering || "").filter(Boolean).join(" / ");

    await Promise.all(selectedIds.map((productId) => {
      return update(ref(database, `products/${currentUser.uid}/${productId}`), {
        shippingRequest: requestType,
        shippingStatus: "unshipped",
        shippingDestination: destination,
        shippingOrigin: selectedOrigin,
        shipmentGroupId,
        shipmentGroupCount,
        shipmentGroupNames,
        shipmentGroupNumberings,
        updatedAt: now
      });
    }));

    selectedProductIds.clear();
    shippingForm.reset();
    closeShippingModal();
    await loadData();
    alert("発送依頼を作成しました。");
  } catch (error) {
    console.error(error);
    showError("発送依頼の作成に失敗しました。");
  }
});

async function loadData() {
  if (!currentUser) return;

  try {
    const productsSnapshot = await get(ref(database, `products/${currentUser.uid}`));
    const originsSnapshot = await get(ref(database, `shippingOrigins/${currentUser.uid}`));
    const announcementsSnapshot = await get(ref(database, "announcements"));
    const invoicesSnapshot = await get(ref(database, `invoices/${currentUser.uid}`)).catch(() => ({ exists: () => false, val: () => ({}) }));

    productsCache = productsSnapshot.exists()
      ? Object.values(productsSnapshot.val()).sort((a, b) => {
          const aNumber = String(a.numbering || "");
          const bNumber = String(b.numbering || "");
          return aNumber.localeCompare(bNumber, "ja", { numeric: true });
        })
      : [];

    originsCache = originsSnapshot.exists()
      ? Object.values(originsSnapshot.val()).sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ja"))
      : [];

    announcementsCache = announcementsSnapshot.exists()
      ? Object.values(announcementsSnapshot.val()).sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0))
      : [];

    invoicesCache = invoicesSnapshot.exists() ? invoicesSnapshot.val() : {};

    const registeredProducts = getRegisteredProducts();
    const storedProducts = getStoredProducts();
    const selectableIds = new Set(storedProducts.map((product) => product.id));
    selectedProductIds = new Set([...selectedProductIds].filter((id) => selectableIds.has(id)));

    document.getElementById("productCount").textContent = registeredProducts.length;
    document.getElementById("storedCount").textContent = storedProducts.length;
    document.getElementById("unshippedCount").textContent = groupedShippingItems(productsCache.filter((product) => hasValue(product.shippingRequest) && product.shippingStatus !== "shipped")).length;
    document.getElementById("shippedCount").textContent = groupedShippingItems(productsCache.filter((product) => product.shippingStatus === "shipped")).length;

    document.getElementById("recentAnnouncements").innerHTML = recentAnnouncementsHtml();

    renderStoredList();
    renderShippingList();
    renderOriginList();
    renderInvoiceList();
  } catch (error) {
    console.error(error);
    showError("データの読み込みに失敗しました。");
  }
}

function getRegisteredProducts() {
  return productsCache.filter((product) => {
    return !hasValue(product.shippingRequest) && !hasValue(product.shootingDate);
  });
}

function getStoredProducts() {
  return productsCache.filter((product) => {
    return !hasValue(product.shippingRequest) && hasValue(product.shootingDate);
  });
}

function renderStoredList() {
  registeredStoredFilterBtn.classList.toggle("active", storedView === "registered");
  storedFilterBtn.classList.toggle("active", storedView === "stored");

  const baseProducts = storedView === "registered"
    ? getRegisteredProducts()
    : getStoredProducts();
  const searchKeyword = normalizeSearch(storedSearchInput.value);
  const products = searchKeyword
    ? baseProducts.filter((product) => normalizeSearch(`${product.name || ""} ${product.numbering || ""}`).includes(searchKeyword))
    : baseProducts;

  const emptyMessage = storedView === "registered"
    ? "登録済み商品はありません"
    : "保管商品はありません";

  document.getElementById("storedList").innerHTML =
    products.length ? productTable(products, { mode: storedView }) + (storedView === "stored" ? bulkActionBar() : "") : emptyHtml(searchKeyword ? "検索条件に一致する商品はありません" : emptyMessage);
}

function renderShippingList() {
  unshippedFilterBtn.classList.toggle("active", shippingView === "unshipped");
  shippedFilterBtn.classList.toggle("active", shippingView === "shipped");

  const searchKeyword = normalizeSearch(shippingSearchInput.value);
  const filtered = productsCache
    .filter((product) => {
      if (!hasValue(product.shippingRequest)) return false;
      if (shippingView === "shipped") return product.shippingStatus === "shipped";
      return product.shippingStatus !== "shipped";
    })
    .filter((product) => {
      if (!searchKeyword) return true;
      return normalizeSearch(`${product.name || ""} ${product.numbering || ""}`).includes(searchKeyword);
    });
  const shippingItems = groupedShippingItems(filtered)
    .sort((a, b) => sortByShippingDateAndNumbering(a, b));

  document.getElementById("shippingList").innerHTML =
    shippingItems.length ? productTable(shippingItems, { mode: "shipping" }) : emptyHtml(searchKeyword ? "検索条件に一致する商品はありません" : (shippingView === "shipped" ? "発送済みの商品はありません" : "未発送の商品はありません"));
}

function groupedShippingItems(products) {
  const groups = new Map();
  const singles = [];

  products.forEach((product) => {
    const groupId = shipmentDisplayGroupKey(product);
    if (!groupId) {
      singles.push(product);
      return;
    }

    if (!groups.has(groupId)) groups.set(groupId, []);
    groups.get(groupId).push(product);
  });

  const grouped = [...groups.entries()].flatMap(([groupId, groupProducts]) => {
    const sortedProducts = groupProducts.slice().sort((a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true }));

    return sortedProducts.map((product, index) => ({
      ...product,
      shipmentGroupId: groupId,
      shipmentGroupCount: sortedProducts.length,
      bundleRole: index === 0 ? "parent" : "child",
      bundlePosition: sortedProducts.length === 1 ? "" : index === 0 ? "first" : index === sortedProducts.length - 1 ? "last" : "middle"
    }));
  });

  return [...grouped, ...singles];
}

function productTable(products, options = {}) {
  const mode = options.mode || "registered";
  const isRegistered = mode === "registered";
  const isStored = mode === "stored";
  const isShipping = mode === "shipping";

  return `
    <div class="table-wrap">
      <table class="products-table">
        <thead>
          <tr>
            ${isStored || isShipping ? "<th>発送</th>" : ""}
            <th>商品名</th>
            <th>ナンバリング</th>
            ${isShipping ? "<th>発送情報</th>" : ""}
            <th>${isShipping ? "商品情報" : "情報"}</th>
            ${isStored ? "<th>撮影日</th>" : ""}
            ${isShipping ? `<th>発送日</th><th>状態</th><th>${shippingView === "shipped" ? "追跡番号" : "お問い合わせ"}</th>` : ""}
          </tr>
        </thead>
        <tbody>
          ${products.map((product) => productRow(product, mode)).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function productRow(product, mode = "registered") {
  const isRegistered = mode === "registered";
  const isStored = mode === "stored";
  const isShipping = mode === "shipping";

  return `
    <tr class="${bundleRowClass(product)}">
      ${isStored ? `
        <td class="shipping-cell">
          <input class="shipping-check" type="checkbox" ${selectedProductIds.has(product.id) ? "checked" : ""} onchange="toggleProductSelection('${escapeAttr(product.id)}', this.checked)">
        </td>
      ` : ""}
      ${isShipping ? `<td>${shippingCellHtml(product)}</td>` : ""}
      <td>${escapeHtml(product.name)}</td>
      <td>${escapeHtml(product.numbering || "-")}</td>
      ${isShipping ? `<td>${shippingInfoButtonHtml(product)}</td>` : ""}
      <td>
        <button class="secondary compact-btn" type="button" onclick="showInfo('${escapeAttr(product.id)}')">詳細</button>
      </td>
      ${isStored ? `<td>${escapeHtml(product.shootingDate || "-")}</td>` : ""}
      ${isShipping ? `<td>${bundleChildDash(product) || escapeHtml(product.shippedDate || "-")}</td><td>${shippingStatusText(product)}</td><td>${shippingView === "shipped" ? trackingNumberHtml(product) : inquiryControl(product)}</td>` : ""}
    </tr>
  `;
}

function bulkActionBar() {
  return `
    <div class="bulk-action-bar ${selectedProductIds.size ? "show" : ""}">
      <button type="button" class="bulk-btn domestic" onclick="openShippingModal('国内発送')">選択中を国内発送する</button>
      <button type="button" class="bulk-btn overseas" onclick="openShippingModal('海外発送')">選択中を海外発送する</button>
      <button type="button" class="bulk-btn return" onclick="openShippingModal('返品依頼')">選択中を返品依頼する</button>
    </div>
  `;
}

function inquiryControl(product) {
  if (product.bundleRole === "child") return `<span class="dash-mark" aria-label="同梱"></span>`;
  if (shippingView === "shipped") return "-";

  return `
    <label class="inquiry-box">
      <input class="shipping-check" type="checkbox" onchange="if(this.checked){openInquiryModal('${escapeAttr(product.id)}'); this.checked=false;}">
      お問い合わせ
    </label>
  `;
}

function trackingNumberHtml(product) {
  if (product.bundleRole === "child") return `<span class="bundle-label">同梱</span>`;
  const trackingNumber = product.trackingNumber || product.trackingNo || product.shippingTrackingNumber || product.shippingTrackingNo || "";
  return hasValue(trackingNumber) ? escapeHtml(trackingNumber) : "-";
}

function shippingCellHtml(product) {
  return product.bundleRole === "child" ? `<span class="bundle-label">同梱</span>` : shippingPill(product.shippingRequest);
}

function shippingInfoButtonHtml(product) {
  return product.bundleRole === "child"
    ? `<span class="dash-mark" aria-label="同梱"></span>`
    : `<button class="secondary compact-btn" type="button" onclick="showShippingInfo('${escapeAttr(product.id)}')">詳細</button>`;
}

function bundleChildDash(product) {
  return product.bundleRole === "child" ? `<span class="dash-mark" aria-label="同梱"></span>` : "";
}

function bundleRowClass(product) {
  return product.bundlePosition ? `bundle-${product.bundlePosition}` : "";
}

function shipmentDisplayGroupKey(product) {
  if (product.shipmentGroupId) return `group_${product.shipmentGroupId}`;

  if (product.shippingStatus === "shipped" && hasValue(product.shippedDate)) {
    return [
      "shipped",
      product.shippedDate || "",
      product.shippingRequest || "",
      compactAddressKey(product.shippingDestination),
      compactAddressKey(product.shippingOrigin)
    ].join("_");
  }

  return "";
}

function compactAddressKey(value) {
  if (!value || typeof value !== "object") return "";
  return [
    value.name,
    value.postalCode,
    value.prefecture,
    value.address,
    value.building,
    value.phone,
    value.senderName
  ].map((item) => String(item || "").trim()).join("|");
}

function shipmentGroupNote(product, enabled) {
  return enabled && product.shipmentGroupCount > 1
    ? `<div class="bundle-note">同梱 ${escapeHtml(product.shipmentGroupCount)}点</div>`
    : "";
}

function recentAnnouncementsHtml() {
  const recent = announcementsCache.slice(0, 5);

  if (!recent.length) {
    return emptyHtml("お知らせはまだありません");
  }

  return `
    <div class="announcement-list">
      ${recent.map((item) => `
        <div class="announcement-card">
          <div class="announcement-date">${escapeHtml(formatDate(item.createdAt))}</div>
          <div class="announcement-message">${escapeHtml(item.message || "-")}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function optionLabelsFromValues(optionVideo, optionThanksCard, optionOkirakuInsert) {
  const labels = [];
  if (isOptionEnabled(optionVideo)) labels.push("動画撮影");
  if (isOptionEnabled(optionThanksCard)) labels.push("Thanksカード同梱");
  if (isOptionEnabled(optionOkirakuInsert)) labels.push("お気楽便Thanksカード・チラシ同梱");
  return labels;
}

function originCard(origin) {

    <div class="origin-card">
      <div class="origin-card-head">
        <div class="origin-title">${escapeHtml(origin.name)}</div>
        <button class="secondary compact-btn" type="button" onclick="editOrigin('${escapeAttr(origin.id)}')">変更</button>
      </div>
      <div class="origin-meta">
        ${escapeHtml(origin.postalCode)} ${escapeHtml(origin.prefecture)} ${escapeHtml(origin.address)} ${escapeHtml(origin.building || "")}<br>
        ${escapeHtml(origin.senderName)} ${origin.phone ? " / " + escapeHtml(origin.phone) : ""}
      </div>
    </div>
  `;
}

function shippingPill(value) {
  const className = value === "国内発送" ? "domestic" : value === "海外発送" ? "overseas" : value === "返品依頼" ? "return" : "none";
  return `<span class="status-pill ${className}">${escapeHtml(value || "未選択")}</span>`;
}

function shippingStatusText(product) {
  if (product.bundleRole === "child") return `<span class="bundle-label">同梱</span>`;
  return product.shippingStatus === "shipped"
    ? `<span class="status-pill domestic">発送済み</span>`
    : `<span class="status-pill none">未発送</span>`;
}

function canEditProduct(product) {
  return !hasValue(product.shippingRequest) && !hasValue(product.shootingDate);
}

function optionSummary(product) {
  const options = [];
  const optionObject = product.options || {};
  const optionLabels = Array.isArray(product.optionLabels) ? product.optionLabels : [];

  if (isOptionEnabled(product.optionVideo) || isOptionEnabled(optionObject.video)) options.push("動画撮影");
  if (isOptionEnabled(product.optionThanksCard) || isOptionEnabled(optionObject.thanksCard)) options.push("Thanksカード同梱");
  if (isOptionEnabled(product.optionOkirakuInsert) || isOptionEnabled(optionObject.okirakuInsert) || isOptionEnabled(product.optionOkirakuThanksCard) || isOptionEnabled(optionObject.okirakuThanksCard) || isOptionEnabled(product.optionFlyer) || isOptionEnabled(optionObject.flyer)) {
    options.push("お気楽便Thanksカード・チラシ同梱");
  }

  optionLabels.forEach((label) => {
    if (label && !options.includes(label)) options.push(label);
  });

  return options.length ? options.join("、") : "-";
}

function isOptionEnabled(value) {
  return value === true || value === "true" || value === "on" || value === 1 || value === "1";
}

function linkOrDash(value) {
  if (!hasValue(value)) return "-";
  return `<a href="${escapeAttr(value)}" target="_blank" rel="noopener">${escapeHtml(value)}</a>`;
}

function workRequestOptions(current) {
  const options = ["検品+写真", "写真のみ", "検品のみ", "保管のみ"];
  return `<option value="">選択してください</option>${options.map((option) => `
    <option value="${escapeAttr(option)}" ${String(current || "") === option ? "selected" : ""}>${escapeHtml(option)}</option>
  `).join("")}`;
}

function sortByShippingDateAndNumbering(a, b) {
  const groupCompare = String(a.shipmentGroupId || a.id || "").localeCompare(String(b.shipmentGroupId || b.id || ""), "ja", { numeric: true });
  if (a.shipmentGroupId && a.shipmentGroupId === b.shipmentGroupId) {
    if (a.bundleRole !== b.bundleRole) return a.bundleRole === "parent" ? -1 : 1;
  }

  const dateCompare = String(a.shippedDate || "9999-99-99").localeCompare(String(b.shippedDate || "9999-99-99"));
  if (dateCompare !== 0) return dateCompare;

  if (a.shipmentGroupId || b.shipmentGroupId) {
    if (groupCompare !== 0) return groupCompare;
  }

  return String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true });
}

function formatDate(value) {
  if (!value) return "-";

  const date = new Date(Number(value));
  if (Number.isNaN(date.getTime())) return "-";

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}/${month}/${day}`;
}

function originLabel(origin) {

}

window.saveProductEdit = async function(event, productId) {
  event.preventDefault();
  clearError();

  if (!currentUser) return;

  const formData = new FormData(event.target);
  const data = {
    name: String(formData.get("name") || "").trim(),
    numbering: String(formData.get("numbering") || "").trim(),
    workRequest: String(formData.get("workRequest") || "").trim(),
    bodyCount: String(formData.get("bodyCount") || "").trim(),
    lensCount: String(formData.get("lensCount") || "").trim(),
    optionVideo: formData.get("optionVideo") === "on",
    optionThanksCard: formData.get("optionThanksCard") === "on",
    optionOkirakuInsert: formData.get("optionOkirakuInsert") === "on",
    optionComment: String(formData.get("optionComment") || "").trim(),
    purchaseUrl: String(formData.get("purchaseUrl") || "").trim(),
    note: String(formData.get("note") || "").trim(),
    updatedAt: Date.now()
  };

  if (!data.name || !data.numbering || !data.workRequest || !data.bodyCount || !data.lensCount) {
    showError("商品名、ナンバリング、作業依頼、ボディ本数、レンズ本数は必須です。");
    return;
  }

  data.options = {
    video: data.optionVideo,
    thanksCard: data.optionThanksCard,
    okirakuThanksCard: data.optionOkirakuInsert,
    flyer: data.optionOkirakuInsert,
    okirakuInsert: data.optionOkirakuInsert,
    comment: data.optionComment
  };
  data.optionOkirakuThanksCard = data.optionOkirakuInsert;
  data.optionFlyer = data.optionOkirakuInsert;
  data.optionLabels = optionLabelsFromValues(data.optionVideo, data.optionThanksCard, data.optionOkirakuInsert);

  try {
    await update(ref(database, `products/${currentUser.uid}/${productId}`), data);
    closeModal();
    await loadData();
  } catch (error) {
    console.error(error);
    showError("登録内容の保存に失敗しました。Realtime Databaseのルールを確認してください。");
  }
};

window.openInquiryModal = function(productId) {
  const product = productsCache.find((item) => item.id === productId);
  if (!product) return;

  const title = `${product.name || "-"} ${product.numbering || "-"}について`;

  openModal("お問い合わせ", `
    <form class="modal-form" onsubmit="sendProductInquiry(event, '${escapeAttr(product.id)}')">
      <div class="form-group">
        <label>タイトル</label>
        <input name="title" type="text" readonly value="${escapeAttr(title)}">
      </div>

      <div class="form-group">
        <label>お問い合わせ内容 <span class="required">必須</span></label>
        <textarea name="message" required placeholder="管理者へ伝えたい内容を入力してください"></textarea>
      </div>

      <button type="submit" style="width:100%;">送信する</button>
    </form>
  `, true);
};

window.sendProductInquiry = async function(event, productId) {
  event.preventDefault();
  clearError();

  if (!currentUser) return;

  const formData = new FormData(event.target);
  const title = String(formData.get("title") || "").trim();
  const message = String(formData.get("message") || "").trim();

  if (!message) {
    showError("お問い合わせ内容を入力してください。");
    return;
  }

  try {
    const now = Date.now();
    const inquiryId = `${now}`;

    await set(ref(database, `products/${currentUser.uid}/${productId}/inquiries/${inquiryId}`), {
      id: inquiryId,
      title,
      message,
      createdAt: now,
      createdBy: currentUser.uid,
      createdByEmail: currentUser.email || ""
    });

    await update(ref(database, `products/${currentUser.uid}/${productId}`), {
      latestInquiryAt: now,
      latestInquiryTitle: title,
      updatedAt: now
    });

    closeModal();
    await loadData();
    alert("お問い合わせを送信しました。");
  } catch (error) {
    console.error(error);
    showError("お問い合わせの送信に失敗しました。Realtime Databaseのルールを確認してください。");
  }
};

window.downloadInvoiceCsv = function(month) {
  const invoice = invoicesCache?.[month];
  if (!invoice) return;

  const items = Object.values(invoice.items || {});
  const rows = [
    ["請求月", invoice.month || ""],
    ["会員", invoice.memberName || ""],
    ["管理番号", invoice.managementNumber || ""],
    [],
    ["商品名", "ナンバリング", "作業内容", "検品日", "検品料金", "発送日", "発送料金", "合計"],
    ...items.map((item) => [
      item.name || "",
      item.numbering || "",
      item.workRequest || "",
      item.inspectionDate || "-",
      item.inspectionFee ?? "-",
      item.shippingDate || "-",
      item.shippingFee ?? "-",
      item.total || 0
    ]),
    [],
    ["検品料金合計", invoice.totalInspectionFee || 0],
    ["発送料金合計", invoice.totalShippingFee || 0],
    ["合計", invoice.grandTotal || 0]
  ];

  downloadCsv(rows, `${invoice.memberName || "会員"}_${month}_請求書.csv`);
};

        会員：${escapeHtml(invoice.memberName || "-")}<br>
        管理番号：${escapeHtml(invoice.managementNumber || "-")}
      </div>
      <table>
        <thead>
          <tr>
            <th>商品名</th>
            <th>ナンバリング</th>
            <th>検品日</th>
            <th>検品料金</th>
            <th>発送日</th>

        <div class="detail-label">住所</div><div>${escapeHtml(origin.address || "-")}</div>
        <div class="detail-label">建物名</div><div>${escapeHtml(origin.building || "-")}</div>
        <div class="detail-label">お名前</div><div>${escapeHtml(origin.senderName || "-")}</div>
        <div class="detail-label">電話番号</div><div>${escapeHtml(origin.phone || "-")}</div>
      </div>
    </div>
  `;
}

function shipmentProductsFor(product) {
  const groupKey = shipmentDisplayGroupKey(product);
  if (!groupKey) return [product];

  const products = productsCache
    .filter((item) => shipmentDisplayGroupKey(item) === groupKey)
    .sort((a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true }));

  return products.length ? products : [product];
}

function shipmentProductsDetailHtml(products) {
  return products.map((product, index) => `
    <div class="detail-section">
      <div class="detail-heading">同梱商品 ${index + 1} / ${escapeHtml(product.name || "-")} / ${escapeHtml(product.numbering || "-")}</div>
    </div>
    ${productDetailHtml(product)}
  `).join("");
}

function openModal(title, body, isHtml = false) {
  modalTitle.textContent = title;

  if (isHtml) {
    modalBody.innerHTML = body;
  } else {
    modalBody.textContent = body;
  }

  modalBackdrop.classList.add("show");
}

function closeModal() {
  modalBackdrop.classList.remove("show");
  modalBody.textContent = "";
}

function closeShippingModal() {
  shippingModalBackdrop.classList.remove("show");
}

function showLoginUI() {
  currentUser = null;
  loginArea.classList.remove("hidden");
  appArea.classList.add("hidden");
}

function showAppUI(user) {
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  userEmail.textContent = user.email || user.displayName || user.uid;
}

function emptyHtml(message) {
  return `<div class="empty"><h3>${escapeHtml(message)}</h3></div>`;
}

function downloadCsv(rows, filename) {
  const csv = rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function csvCell(value) {
  return `"${String(value ?? "").replaceAll('"', '""')}"`;
}

function showLoginError(message) {
  loginError.textContent = message;
  loginError.classList.add("show");
}

function clearLoginError() {
  loginError.textContent = "";
  loginError.classList.remove("show");
}

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.classList.add("show");
}

function clearError() {
  errorMessage.textContent = "";
  errorMessage.classList.remove("show");
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function normalizeSearch(value) {
  return String(value || "")
    .toLocaleLowerCase("ja-JP")
    .replace(/\s+/g, "");
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}
</script>
</body>
</html>
