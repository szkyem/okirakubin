<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おきらく便 - 会員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px}
button,input,textarea,select{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#1f2937}
button.secondary:hover{background:#dfe7f1}
button.danger{background:#fee2e2;color:#b91c1c}
button.danger:hover{background:#fecaca}
.container{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;max-width:1280px;margin:0 auto}
.login-container{max-width:520px;margin:80px auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px}
.login-title{font-size:28px;font-weight:800;color:#2563eb;margin-bottom:12px}
.login-text{color:#6b7280;margin-bottom:24px;line-height:1.7}
.login-button{width:100%;font-size:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;color:#2563eb}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800}
.logout{background:#eef2f7;color:#1f2937}
.tabs{display:flex;gap:10px;border-bottom:2px solid #e5e7eb;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.section{display:none}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:24px}
.stat,.form{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:20px}
.stat-label{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:#2563eb}
.form{margin-top:16px}
.form-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.product-entry{border:1px solid #dbe3ef;border-radius:10px;background:#f8fafc;padding:18px;margin-bottom:16px}
.product-entry-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.product-entry-title{font-weight:800;color:#1f2937}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-group{margin-bottom:16px}
.form-group.full{grid-column:1/-1}
label{display:block;margin-bottom:8px;font-weight:700}
input,textarea,select{width:100%;border:1px solid #e5e7eb;border-radius:6px;padding:10px;font-size:14px;background:#fff}
textarea{min-height:88px;resize:vertical}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px}
.products-table{width:100%;border-collapse:collapse;min-width:980px}
.products-table th{background:#6b7280;color:#fff;text-align:left;font-size:13px;padding:10px 12px;white-space:nowrap}
.products-table td{border-top:1px solid #e5e7eb;padding:10px 12px;vertical-align:middle;font-size:14px}
.products-table tr:nth-child(even){background:#fafafa}
.shipping-cell{background:#fffde7;text-align:center;min-width:92px}
.shipping-check{width:auto}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.domestic{background:#dbeafe;color:#1d4ed8}
.status-pill.overseas{background:#dcfce7;color:#15803d}
.status-pill.return{background:#fee2e2;color:#b91c1c}
.status-pill.none{background:#f3f4f6;color:#6b7280}
.compact-btn{padding:7px 10px;font-size:12px}
.note-preview{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2563eb;text-decoration:underline;background:none;padding:0;font-weight:700}
.ship-filter{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:18px}
.ship-filter-btn{background:#fff;color:#9ca3af;border-bottom:2px solid #d1d5db;border-radius:0;min-width:160px}
.ship-filter-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.ship-filter-btn:hover{background:#f8fafc}
.bulk-action-bar{display:none;position:sticky;bottom:0;margin-top:12px;grid-template-columns:repeat(3,1fr);box-shadow:0 -8px 24px rgba(15,23,42,.12);z-index:5}
.bulk-action-bar.show{display:grid}
.bulk-btn{border-radius:0;padding:18px 12px;font-size:15px}
.bulk-btn.domestic{background:#334155}
.bulk-btn.overseas{background:#5acb88}
.bulk-btn.return{background:#f59e0b}
.empty{padding:32px;text-align:center;color:#6b7280}
.error{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6}
.error.show{display:block}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:560px;width:100%;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.modal-body{line-height:1.8;white-space:pre-wrap}
@media(max-width:700px){body{padding:16px}.container,.login-container{padding:24px}.header{align-items:stretch;flex-direction:column}.logout{width:100%}.form-grid{grid-template-columns:1fr}.ship-filter-btn{min-width:120px}.bulk-action-bar{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="login-container" id="loginArea">
  <div class="error" id="loginError"></div>
  <h1 class="login-title">おきらく便</h1>
  <p class="login-text">会員としてログインしてください。</p>
  <button class="login-button" id="loginBtn" type="button">Googleで会員ログイン</button>
</section>

<div class="container hidden" id="appArea">
  <div class="error" id="errorMessage"></div>

  <header class="header">
    <h1 class="title">おきらく便</h1>
    <div class="user">
      <span id="userEmail"></span>
      <span class="badge">会員</span>
      <button class="logout" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview" type="button">概要</button>
    <button class="tab" data-tab="register" type="button">商品登録</button>
    <button class="tab" data-tab="products" type="button">商品一覧</button>
    <button class="tab" data-tab="shipping" type="button">発送管理</button>
  </nav>

  <section class="section show" id="overview">
    <div class="grid">
      <div class="stat"><div class="stat-label">登録済み商品</div><div class="stat-value" id="productCount">0</div></div>
      <div class="stat"><div class="stat-label">未発送</div><div class="stat-value" id="unshippedCount">0</div></div>
      <div class="stat"><div class="stat-label">発送済み</div><div class="stat-value" id="shippedCount">0</div></div>
    </div>

    <h2 style="margin-bottom:16px;">最近の商品</h2>
    <div id="recentProducts"></div>
  </section>

  <section class="section" id="register">
    <div class="form">
      <div class="form-header">
        <h2>商品を登録する</h2>
        <button class="secondary" id="addEntryBtn" type="button">追加</button>
      </div>

      <form id="productForm">
        <div id="productEntries"></div>
        <button type="submit" style="width:100%;">登録する</button>
      </form>
    </div>
  </section>

  <section class="section" id="products">
    <h2 style="margin-bottom:16px;">登録済み商品</h2>
    <div id="productsList"></div>
  </section>

  <section class="section" id="shipping">
    <h2 style="margin-bottom:16px;">発送管理</h2>
    <div class="ship-filter">
      <button class="ship-filter-btn active" id="unshippedFilterBtn" type="button">未発送</button>
      <button class="ship-filter-btn" id="shippedFilterBtn" type="button">発送済み</button>
    </div>
    <div id="shippingList"></div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="secondary compact-btn" id="modalCloseBtn" type="button">閉じる</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase,
  ref,
  get,
  set,
  update,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
  authDomain: "okirakubin-manager.firebaseapp.com",
  projectId: "okirakubin-manager",
  storageBucket: "okirakubin-manager.firebasestorage.app",
  messagingSenderId: "387991576787",
  appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const database = getDatabase(
  app,
  "https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let currentUser = null;
let productsCache = [];
let entryCount = 0;
let shippingView = "unshipped";
let selectedProductIds = new Set();

const loginArea = document.getElementById("loginArea");
const appArea = document.getElementById("appArea");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userEmail = document.getElementById("userEmail");
const loginError = document.getElementById("loginError");
const errorMessage = document.getElementById("errorMessage");
const productForm = document.getElementById("productForm");
const productEntries = document.getElementById("productEntries");
const addEntryBtn = document.getElementById("addEntryBtn");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const unshippedFilterBtn = document.getElementById("unshippedFilterBtn");
const shippedFilterBtn = document.getElementById("shippedFilterBtn");

loginBtn.addEventListener("click", async () => {
  clearLoginError();

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error(error);
    showLoginError("ログインに失敗しました。もう一度お試しください。");
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  showLoginUI();
});

onAuthStateChanged(auth, async (user) => {
  clearLoginError();
  clearError();

  if (!user) {
    showLoginUI();
    return;
  }

  try {
    const memberSnapshot = await get(ref(database, `members/${user.uid}`));
    const isMember = memberSnapshot.exists() && memberSnapshot.val() === true;

    if (!isMember) {
      await signOut(auth);
      showLoginUI();
      showLoginError("このアカウントは会員として登録されていません。");
      return;
    }

    currentUser = user;

    await set(ref(database, `loginUsers/${user.uid}`), {
      uid: user.uid,
      name: user.displayName || "",
      email: user.email || "",
      role: "member",
      lastLoginAt: serverTimestamp()
    });

    showAppUI(user);
    resetEntries();
    await loadData();
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showLoginUI();
    showLoginError("会員情報の確認に失敗しました。Realtime Databaseのルールとデータを確認してください。");
  }
});

addEntryBtn.addEventListener("click", () => {
  addProductEntry();
});

unshippedFilterBtn.addEventListener("click", () => {
  shippingView = "unshipped";
  renderShippingList();
});

shippedFilterBtn.addEventListener("click", () => {
  shippingView = "shipped";
  renderShippingList();
});

productForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();

  if (!currentUser) {
    showError("ログイン情報を確認できません。再度ログインしてください。");
    return;
  }

  const entries = [...document.querySelectorAll(".product-entry")];
  const payloads = entries.map((entry) => {
    return {
      name: entry.querySelector('[data-field="name"]').value.trim(),
      numbering: entry.querySelector('[data-field="numbering"]').value.trim(),
      workRequest: entry.querySelector('[data-field="workRequest"]').value,
      note: entry.querySelector('[data-field="note"]').value.trim(),
      purchaseUrl: entry.querySelector('[data-field="purchaseUrl"]').value.trim()
    };
  }).filter((item) => item.name || item.numbering || item.note || item.purchaseUrl);

  if (!payloads.length) {
    showError("登録する商品を入力してください。");
    return;
  }

  if (payloads.some((item) => !item.name)) {
    showError("商品名は必須です。");
    return;
  }

  try {
    const now = Date.now();

    await Promise.all(payloads.map((item, index) => {
      const productId = `${now}_${index}`;

      return set(ref(database, `products/${currentUser.uid}/${productId}`), {
        id: productId,
        ownerUid: currentUser.uid,
        ownerEmail: currentUser.email || "",
        name: item.name,
        numbering: item.numbering,
        workRequest: item.workRequest,
        note: item.note,
        purchaseUrl: item.purchaseUrl,
        shippingRequest: "",
        shippingStatus: "unshipped",
        confirmationDate: "",
        confirmationResult: "",
        photoUrl: "",
        expectedSize: "",
        shootingDate: "",
        status: "registered",
        createdAt: now + index,
        updatedAt: now
      });
    }));

    productForm.reset();
    resetEntries();
    selectedProductIds.clear();
    await loadData();
    alert("商品を登録しました。");
  } catch (error) {
    console.error(error);
    showError("商品の登録に失敗しました。Realtime Databaseのルールを確認してください。");
  }
});

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
    document.querySelectorAll(".section").forEach((section) => section.classList.remove("show"));

    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
  });
});

modalCloseBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (event) => {
  if (event.target === modalBackdrop) closeModal();
});

async function loadData() {
  if (!currentUser) return;

  try {
    const productsSnapshot = await get(ref(database, `products/${currentUser.uid}`));

    productsCache = productsSnapshot.exists()
      ? Object.values(productsSnapshot.val()).sort((a, b) => {
          const aNumber = String(a.numbering || "");
          const bNumber = String(b.numbering || "");
          return aNumber.localeCompare(bNumber, "ja", { numeric: true });
        })
      : [];

    const registeredProducts = productsCache.filter((product) => !product.shippingRequest);
    const existingIds = new Set(registeredProducts.map((product) => product.id));
    selectedProductIds = new Set([...selectedProductIds].filter((id) => existingIds.has(id)));

    document.getElementById("productCount").textContent = registeredProducts.length;
    document.getElementById("unshippedCount").textContent = productsCache.filter((product) => product.shippingRequest && product.shippingStatus !== "shipped").length;
    document.getElementById("shippedCount").textContent = productsCache.filter((product) => product.shippingStatus === "shipped").length;

    document.getElementById("recentProducts").innerHTML =
      registeredProducts.slice(0, 5).length ? productTable(registeredProducts.slice(0, 5), false, true) : emptyHtml("商品が登録されていません");

    document.getElementById("productsList").innerHTML =
      registeredProducts.length ? productTable(registeredProducts, false, true) + bulkActionBar() : emptyHtml("商品が登録されていません");

    renderShippingList();
  } catch (error) {
    console.error(error);
    showError("データの読み込みに失敗しました。");
  }
}

function renderProductsList() {
  const registeredProducts = productsCache.filter((product) => !product.shippingRequest);

  document.getElementById("productsList").innerHTML =
    registeredProducts.length ? productTable(registeredProducts, false, true) + bulkActionBar() : emptyHtml("商品が登録されていません");
}

function renderShippingList() {
  unshippedFilterBtn.classList.toggle("active", shippingView === "unshipped");
  shippedFilterBtn.classList.toggle("active", shippingView === "shipped");

  const filtered = productsCache.filter((product) => {
    if (!product.shippingRequest) return false;
    if (shippingView === "shipped") return product.shippingStatus === "shipped";
    return product.shippingStatus !== "shipped";
  });

  document.getElementById("shippingList").innerHTML =
    filtered.length ? productTable(filtered, true, false) : emptyHtml(shippingView === "shipped" ? "発送済みの商品はありません" : "未発送の商品はありません");
}

function resetEntries() {
  productEntries.innerHTML = "";
  entryCount = 0;
  addProductEntry();
}

function addProductEntry() {
  entryCount += 1;

  const entry = document.createElement("div");
  entry.className = "product-entry";
  entry.innerHTML = `
    <div class="product-entry-head">
      <div class="product-entry-title">登録項目 ${entryCount}</div>
      <button class="danger compact-btn" type="button" data-remove-entry>削除</button>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>商品名 *</label>
        <input type="text" data-field="name" placeholder="例：SONY SEL1855">
      </div>

      <div class="form-group">
        <label>ナンバリング</label>
        <input type="text" data-field="numbering" placeholder="例：20250525">
      </div>

      <div class="form-group">
        <label>作業依頼</label>
        <select data-field="workRequest">
          <option value="検品+写真">検品+写真</option>
          <option value="写真のみ">写真のみ</option>
          <option value="検品のみ">検品のみ</option>
          <option value="保管のみ">保管のみ</option>
        </select>
      </div>

      <div class="form-group">
        <label>購入先URL</label>
        <input type="url" data-field="purchaseUrl" placeholder="https://example.com">
      </div>

      <div class="form-group full">
        <label>備考欄</label>
        <textarea data-field="note" placeholder="備考を入力してください"></textarea>
      </div>
    </div>
  `;

  entry.querySelector("[data-remove-entry]").addEventListener("click", () => {
    if (document.querySelectorAll(".product-entry").length === 1) {
      entry.querySelectorAll("input,textarea").forEach((input) => input.value = "");
      entry.querySelector("select").selectedIndex = 0;
      return;
    }

    entry.remove();
  });

  productEntries.appendChild(entry);
}

function productTable(products, showShippingStatus = false, isRegisteredList = false) {
  return `
    <div class="table-wrap">
      <table class="products-table">
        <thead>
          <tr>
            <th>発送</th>
            <th>商品名</th>
            <th>ナンバリング</th>
            <th>備考欄</th>
            <th>情報</th>
            <th>撮影日</th>
            ${showShippingStatus ? "<th>状態</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${products.map((product) => productRow(product, showShippingStatus, isRegisteredList)).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function productRow(product, showShippingStatus = false, isRegisteredList = false) {
  return `
    <tr>
      <td class="shipping-cell">
        ${
          isRegisteredList
            ? `<input class="shipping-check" type="checkbox" ${selectedProductIds.has(product.id) ? "checked" : ""} onchange="toggleProductSelection('${escapeAttr(product.id)}', this.checked)">`
            : shippingPill(product.shippingRequest)
        }
      </td>
      <td>${escapeHtml(product.name)}</td>
      <td>${escapeHtml(product.numbering || "-")}</td>
      <td>
        ${
          product.note
            ? `<button class="note-preview" type="button" onclick="showNote('${escapeAttr(product.id)}')">${escapeHtml(product.note)}</button>`
            : "-"
        }
      </td>
      <td>
        <button class="secondary compact-btn" type="button" onclick="showInfo('${escapeAttr(product.id)}')">詳細</button>
      </td>
      <td>${escapeHtml(product.shootingDate || "-")}</td>
      ${showShippingStatus ? `<td>${shippingStatusControl(product)}</td>` : ""}
    </tr>
  `;
}

function bulkActionBar() {
  return `
    <div class="bulk-action-bar ${selectedProductIds.size ? "show" : ""}">
      <button type="button" class="bulk-btn domestic" onclick="moveSelectedToShipping('国内発送')">選択中を国内発送する</button>
      <button type="button" class="bulk-btn overseas" onclick="moveSelectedToShipping('海外発送')">選択中を海外発送する</button>
      <button type="button" class="bulk-btn return" onclick="moveSelectedToShipping('返品依頼')">選択中を返品依頼する</button>
    </div>
  `;
}

function shippingPill(value) {
  const className = value === "国内発送" ? "domestic" : value === "海外発送" ? "overseas" : value === "返品依頼" ? "return" : "none";
  return `<span class="status-pill ${className}">${escapeHtml(value || "未選択")}</span>`;
}

function shippingStatusControl(product) {
  return `
    <select onchange="changeShippingStatus('${escapeAttr(product.id)}', this.value)">
      <option value="unshipped" ${product.shippingStatus !== "shipped" ? "selected" : ""}>未発送</option>
      <option value="shipped" ${product.shippingStatus === "shipped" ? "selected" : ""}>発送済み</option>
    </select>
  `;
}

window.toggleProductSelection = function(productId, checked) {
  if (checked) {
    selectedProductIds.add(productId);
  } else {
    selectedProductIds.delete(productId);
  }

  renderProductsList();
};

window.moveSelectedToShipping = async function(shippingRequest) {
  if (!currentUser || !selectedProductIds.size) return;

  try {
    const now = Date.now();

    await Promise.all([...selectedProductIds].map((productId) => {
      return update(ref(database, `products/${currentUser.uid}/${productId}`), {
        shippingRequest,
        shippingStatus: "unshipped",
        updatedAt: now
      });
    }));

    selectedProductIds.clear();
    await loadData();
  } catch (error) {
    console.error(error);
    showError("発送依頼の更新に失敗しました。");
  }
};

window.changeShippingStatus = async function(productId, value) {
  if (!currentUser) return;

  try {
    await update(ref(database, `products/${currentUser.uid}/${productId}`), {
      shippingStatus: value,
      updatedAt: Date.now()
    });

    await loadData();
  } catch (error) {
    console.error(error);
    showError("発送状態の更新に失敗しました。");
  }
};

window.showNote = function(productId) {
  const product = productsCache.find((item) => item.id === productId);
  if (!product) return;

  openModal("備考欄", product.note || "備考はありません。");
};

window.showInfo = function(productId) {
  const product = productsCache.find((item) => item.id === productId);
  if (!product) return;

  openModal("商品情報", `
確認日: ${product.confirmationDate || "-"}
確認結果: ${product.confirmationResult || "-"}
写真URL: ${product.photoUrl || "-"}
予想サイズ: ${product.expectedSize || "-"}
  `.trim());
};

function openModal(title, body) {
  modalTitle.textContent = title;
  modalBody.textContent = body;
  modalBackdrop.classList.add("show");
}

function closeModal() {
  modalBackdrop.classList.remove("show");
}

function showLoginUI() {
  currentUser = null;
  loginArea.classList.remove("hidden");
  appArea.classList.add("hidden");
}

function showAppUI(user) {
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  userEmail.textContent = user.email || user.displayName || user.uid;
}

function emptyHtml(message) {
  return `<div class="empty"><h3>${escapeHtml(message)}</h3></div>`;
}

function showLoginError(message) {
  loginError.textContent = message;
  loginError.classList.add("show");
}

function clearLoginError() {
  loginError.textContent = "";
  loginError.classList.remove("show");
}

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.classList.add("show");
}

function clearError() {
  errorMessage.textContent = "";
  errorMessage.classList.remove("show");
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}
</script>
</body>
