<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おきらく便 - 管理者</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Yu Gothic","Meiryo",sans-serif;color:#1f2937;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px}
button,input,textarea,select{font-family:inherit}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}
button:hover{background:#1d4ed8}
button.secondary{background:#eef2f7;color:#1f2937}
button.secondary:hover{background:#dfe7f1}
.container{background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px;max-width:1280px;margin:0 auto}
.login-container{max-width:520px;margin:80px auto;background:#fff;border-radius:10px;box-shadow:0 18px 50px rgba(31,41,55,.18);padding:36px}
.login-title{font-size:28px;font-weight:800;color:#2563eb;margin-bottom:12px}
.login-text{color:#6b7280;margin-bottom:24px;line-height:1.7}
.login-button{width:100%;font-size:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid #e5e7eb;flex-wrap:wrap}
.title{font-size:28px;font-weight:800;color:#2563eb}
.user{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.badge{background:#2563eb;color:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:800}
.logout{background:#eef2f7;color:#1f2937}
.tabs{display:flex;gap:10px;border-bottom:2px solid #e5e7eb;margin-bottom:24px;flex-wrap:wrap}
.tab{background:none;color:#6b7280;border-radius:0;border-bottom:3px solid transparent}
.tab.active{color:#2563eb;border-bottom-color:#2563eb}
.section{display:none}
.section.show{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat,.panel{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:20px}
.stat-label{color:#6b7280;font-size:13px;font-weight:700;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:800;color:#9ca3af}
.stat.highlight{border-color:#bfdbfe;background:#eff6ff}
.stat.highlight .stat-value{color:#2563eb}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:20px}
.data-table{width:100%;border-collapse:collapse;min-width:980px}
.data-table th{background:#6b7280;color:#fff;text-align:left;font-size:13px;padding:10px 12px;white-space:nowrap}
.data-table td{border-top:1px solid #e5e7eb;padding:10px 12px;vertical-align:middle;font-size:14px}
.data-table tr:nth-child(even){background:#fafafa}
.member-row{cursor:pointer}
.member-row:hover{background:#eff6ff}
.member-name{font-weight:800;color:#1f2937}
.member-meta{font-size:12px;color:#6b7280;margin-top:4px;word-break:break-all}
.status-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.status-pill.blue{background:#dbeafe;color:#1d4ed8}
.status-pill.green{background:#dcfce7;color:#15803d}
.status-pill.yellow{background:#fef3c7;color:#b45309}
.status-pill.gray{background:#f3f4f6;color:#6b7280}
.status-pill.red{background:#fee2e2;color:#b91c1c}
.shipped-date{margin-left:8px;color:#6b7280;font-size:12px;white-space:nowrap}
.management-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.management-number{font-weight:800;color:#1f2937}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.detail-title{font-size:22px;font-weight:800}
.detail-sub{font-size:13px;color:#6b7280;margin-top:4px;word-break:break-all}
.sub-tabs{display:flex;gap:0;justify-content:center;margin-bottom:18px}
.sub-tab{background:#fff;color:#9ca3af;border-bottom:2px solid #d1d5db;border-radius:0;min-width:160px}
.sub-tab.active{color:#2563eb;border-bottom-color:#2563eb}
.compact-btn{padding:7px 10px;font-size:12px}
.empty{padding:32px;text-align:center;color:#6b7280}
.error{display:none;background:#fef3f2;color:#b42318;padding:12px;border-radius:8px;margin-bottom:18px;line-height:1.6}
.error.show{display:block}
.hidden{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-backdrop.show{display:flex}
.modal{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(15,23,42,.28);padding:24px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.detail-section{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.detail-heading-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.detail-heading{font-weight:800;color:#2563eb}
.detail-grid{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px}
.detail-label{color:#6b7280;font-weight:700}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-group{margin-bottom:12px}
.form-group.full{grid-column:1/-1}
label{display:block;font-weight:700;margin-bottom:7px;color:#4b5563}
input,textarea,select{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:10px;font-size:14px;background:#fff}
textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
@media(max-width:700px){body{padding:16px}.container,.login-container{padding:24px}.header{align-items:stretch;flex-direction:column}.logout{width:100%}.sub-tab{min-width:120px}.detail-grid,.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="login-container" id="loginArea">
  <div class="error" id="loginError"></div>
  <h1 class="login-title">おきらく便</h1>
  <p class="login-text">管理者としてログインしてください。</p>
  <button class="login-button" id="loginBtn" type="button">Googleで管理者ログイン</button>
</section>

<div class="container hidden" id="appArea">
  <div class="error" id="errorMessage"></div>

  <header class="header">
    <h1 class="title">おきらく便</h1>
    <div class="user">
      <span id="userEmail"></span>
      <span class="badge">管理者</span>
      <button class="logout" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="members" type="button">メンバー一覧</button>
    <button class="tab" data-tab="memberDetail" type="button">メンバー詳細</button>
  </nav>

  <section class="section show" id="members">
    <div class="grid">
      <div class="stat" id="memberCountCard">
        <div class="stat-label">メンバー</div>
        <div class="stat-value" id="memberCount">0</div>
      </div>
      <div class="stat" id="registeredCountCard">
        <div class="stat-label">登録済み商品</div>
        <div class="stat-value" id="registeredCount">0</div>
      </div>
      <div class="stat" id="unshippedCountCard">
        <div class="stat-label">未発送</div>
        <div class="stat-value" id="unshippedCount">0</div>
      </div>
    </div>

    <h2 style="margin-bottom:16px;">メンバー一覧</h2>
    <div id="memberList"></div>
  </section>

  <section class="section" id="memberDetail">
    <div id="memberDetailContent" class="empty">
      <h3>メンバー一覧から確認するメンバーを選択してください</h3>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="secondary compact-btn" id="modalCloseBtn" type="button">閉じる</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="editModalTitle"></div>
      <button class="secondary compact-btn" id="editModalCloseBtn" type="button">閉じる</button>
    </div>
    <form id="editForm"></form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getDatabase,
  ref,
  get,
  set,
  update,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
  authDomain: "okirakubin-manager.firebaseapp.com",
  projectId: "okirakubin-manager",
  storageBucket: "okirakubin-manager.firebasestorage.app",
  messagingSenderId: "387991576787",
  appId: "1:387991576787:web:db731b898f46dc8214f426"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const database = getDatabase(
  app,
  "https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app"
);

let currentUser = null;
let membersCache = [];
let selectedMemberUid = "";
let detailView = "registered";
let activeEdit = null;

const loginArea = document.getElementById("loginArea");
const appArea = document.getElementById("appArea");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userEmail = document.getElementById("userEmail");
const loginError = document.getElementById("loginError");
const errorMessage = document.getElementById("errorMessage");
const memberList = document.getElementById("memberList");
const memberDetailContent = document.getElementById("memberDetailContent");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalCloseBtn = document.getElementById("modalCloseBtn");
const editModalBackdrop = document.getElementById("editModalBackdrop");
const editModalTitle = document.getElementById("editModalTitle");
const editModalCloseBtn = document.getElementById("editModalCloseBtn");
const editForm = document.getElementById("editForm");

loginBtn.addEventListener("click", async () => {
  clearLoginError();

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    console.error(error);
    showLoginError("ログインに失敗しました。もう一度お試しください。");
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  showLoginUI();
});

onAuthStateChanged(auth, async (user) => {
  clearLoginError();
  clearError();

  if (!user) {
    showLoginUI();
    return;
  }

  try {
    const adminSnapshot = await get(ref(database, `admins/${user.uid}`));
    const isAdmin = adminSnapshot.exists() && adminSnapshot.val() === true;

    if (!isAdmin) {
      await signOut(auth);
      showLoginUI();
      showLoginError("このアカウントは管理者として登録されていません。");
      return;
    }

    currentUser = user;

    await set(ref(database, `loginUsers/${user.uid}`), {
      uid: user.uid,
      name: user.displayName || "",
      email: user.email || "",
      role: "admin",
      lastLoginAt: serverTimestamp()
    });

    showAppUI(user);
    await loadData();
  } catch (error) {
    console.error(error);
    await signOut(auth);
    showLoginUI();
    showLoginError("管理者情報の確認に失敗しました。Realtime Databaseのルールとデータを確認してください。");
  }
});

document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
    document.querySelectorAll(".section").forEach((section) => section.classList.remove("show"));

    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("show");
  });
});

modalCloseBtn.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", (event) => {
  if (event.target === modalBackdrop) closeModal();
});

editModalCloseBtn.addEventListener("click", closeEditModal);
editModalBackdrop.addEventListener("click", (event) => {
  if (event.target === editModalBackdrop) closeEditModal();
});

editForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!activeEdit) return;

  clearError();

  const { ownerUid, productId, type } = activeEdit;

  try {
    if (type === "management") {
      await update(ref(database, `products/${ownerUid}/${productId}`), {
        managementNumber: document.getElementById("editManagementNumber").value.trim(),
        preferenceEnabled: document.getElementById("editPreferenceEnabled").value === "true",
        preferenceComment: document.getElementById("editPreferenceComment").value.trim(),
        updatedAt: Date.now()
      });
    }

    if (type === "member") {
      await update(ref(database, `products/${ownerUid}/${productId}`), {
        name: document.getElementById("editName").value.trim(),
        numbering: document.getElementById("editNumbering").value.trim(),
        workRequest: document.getElementById("editWorkRequest").value,
        note: document.getElementById("editNote").value.trim(),
        purchaseUrl: document.getElementById("editPurchaseUrl").value.trim(),
        updatedAt: Date.now()
      });
    }

    if (type === "admin") {
      const confirmationDate = document.getElementById("editConfirmationDate").value;

      await update(ref(database, `products/${ownerUid}/${productId}`), {
        confirmationDate,
        confirmationResult: document.getElementById("editConfirmationResult").value.trim(),
        photoUrl: document.getElementById("editPhotoUrl").value.trim(),
        expectedSize: document.getElementById("editExpectedSize").value.trim(),
        storageLocation: document.getElementById("editStorageLocation").value.trim(),
        shootingDate: confirmationDate,
        updatedAt: Date.now()
      });
    }

    if (type === "shippingStatus") {
      const shippingStatus = document.getElementById("editShippingStatus").value;

      await update(ref(database, `products/${ownerUid}/${productId}`), {
        shippingStatus,
        shippedDate: shippingStatus === "shipped" ? todayString() : "",
        updatedAt: Date.now()
      });
    }

    closeEditModal();
    closeModal();
    await loadData();
    if (selectedMemberUid) renderMemberDetail(selectedMemberUid);
  } catch (error) {
    console.error(error);
    showError("更新に失敗しました。Realtime Databaseのルールを確認してください。");
  }
});

async function loadData() {
  if (!currentUser) return;

  try {
    const membersSnapshot = await get(ref(database, "members"));
    const loginUsersSnapshot = await get(ref(database, "loginUsers"));
    const productsSnapshot = await get(ref(database, "products"));

    const membersData = membersSnapshot.exists() ? membersSnapshot.val() : {};
    const loginUsersData = loginUsersSnapshot.exists() ? loginUsersSnapshot.val() : {};
    const productsData = productsSnapshot.exists() ? productsSnapshot.val() : {};

    const memberUids = Object.keys(membersData).filter((uid) => membersData[uid] === true);

    membersCache = memberUids.map((uid) => {
      const profile = loginUsersData[uid] || {};
      const products = productsData[uid]
        ? Object.values(productsData[uid]).sort((a, b) => {
            const aNumber = String(a.managementNumber || a.numbering || "");
            const bNumber = String(b.managementNumber || b.numbering || "");
            return aNumber.localeCompare(bNumber, "ja", { numeric: true });
          })
        : [];

      const registeredProducts = products.filter((product) => !hasValue(product.shippingRequest) && !hasValue(product.shootingDate));
      const storedProducts = products.filter((product) => !hasValue(product.shippingRequest) && hasValue(product.shootingDate));
      const unshippedProducts = products.filter((product) => hasValue(product.shippingRequest) && product.shippingStatus !== "shipped");
      const shippedProducts = products.filter((product) => product.shippingStatus === "shipped");

      return {
        uid,
        name: profile.name || "",
        email: profile.email || "",
        role: profile.role || "member",
        lastLoginAt: profile.lastLoginAt || "",
        products,
        registeredProducts,
        storedProducts,
        unshippedProducts,
        shippedProducts
      };
    }).sort((a, b) => String(a.email || a.uid).localeCompare(String(b.email || b.uid), "ja"));

    const memberCount = membersCache.length;
    const registeredCount = membersCache.reduce((sum, member) => sum + member.registeredProducts.length, 0);
    const unshippedCount = membersCache.reduce((sum, member) => sum + member.unshippedProducts.length, 0);

    setStat("memberCount", "memberCountCard", memberCount);
    setStat("registeredCount", "registeredCountCard", registeredCount);
    setStat("unshippedCount", "unshippedCountCard", unshippedCount);

    renderMemberList();

    if (selectedMemberUid) {
      renderMemberDetail(selectedMemberUid);
    }
  } catch (error) {
    console.error(error);
    showError("データの読み込みに失敗しました。Realtime Databaseのルールを確認してください。");
  }
}

function renderMemberList() {
  if (!membersCache.length) {
    memberList.innerHTML = emptyHtml("メンバーが登録されていません");
    return;
  }

  memberList.innerHTML = `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>メンバー</th>
            <th>登録済み商品</th>
            <th>保管商品</th>
            <th>未発送</th>
            <th>発送済み</th>
            <th>最終ログイン</th>
          </tr>
        </thead>
        <tbody>
          ${membersCache.map(memberRow).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function memberRow(member) {
  return `
    <tr class="member-row" onclick="selectMember('${escapeAttr(member.uid)}')">
      <td>
        <div class="member-name">${escapeHtml(member.name || member.email || "メンバー")}</div>
        <div class="member-meta">${escapeHtml(member.email || "")}</div>
        <div class="member-meta">${escapeHtml(member.uid)}</div>
      </td>
      <td>${countPill(member.registeredProducts.length, "blue")}</td>
      <td>${countPill(member.storedProducts.length, "green")}</td>
      <td>${countPill(member.unshippedProducts.length, "yellow")}</td>
      <td>${countPill(member.shippedProducts.length, "blue")}</td>
      <td>${formatDateTime(member.lastLoginAt)}</td>
    </tr>
  `;
}

window.selectMember = function(uid) {
  selectedMemberUid = uid;
  detailView = "registered";
  renderMemberDetail(uid);
  document.querySelector('[data-tab="memberDetail"]').click();
};

function renderMemberDetail(uid) {
  const member = membersCache.find((item) => item.uid === uid);

  if (!member) {
    memberDetailContent.innerHTML = emptyHtml("メンバー情報が見つかりません");
    return;
  }

  const products = detailView === "registered"
    ? member.registeredProducts
    : detailView === "stored"
      ? member.storedProducts
      : detailView === "unshipped"
        ? member.unshippedProducts
        : member.shippedProducts;

  memberDetailContent.classList.remove("empty");
  memberDetailContent.innerHTML = `
    <div class="detail-head">
      <div>
        <div class="detail-title">${escapeHtml(member.name || member.email || "メンバー詳細")}</div>
        <div class="detail-sub">${escapeHtml(member.email || "")}</div>
        <div class="detail-sub">${escapeHtml(member.uid)}</div>
      </div>
      <button class="secondary" type="button" onclick="refreshAdminData()">再読み込み</button>
    </div>

    <div class="grid">
      <div class="${statClass(member.registeredProducts.length)}">
        <div class="stat-label">登録済み商品</div>
        <div class="stat-value">${member.registeredProducts.length}</div>
      </div>
      <div class="${statClass(member.storedProducts.length)}">
        <div class="stat-label">保管商品</div>
        <div class="stat-value">${member.storedProducts.length}</div>
      </div>
      <div class="${statClass(member.unshippedProducts.length)}">
        <div class="stat-label">未発送</div>
        <div class="stat-value">${member.unshippedProducts.length}</div>
      </div>
      <div class="${statClass(member.shippedProducts.length)}">
        <div class="stat-label">発送済み</div>
        <div class="stat-value">${member.shippedProducts.length}</div>
      </div>
    </div>

    <div class="sub-tabs">
      <button class="sub-tab ${detailView === "registered" ? "active" : ""}" type="button" onclick="changeDetailView('registered')">登録済み商品</button>
      <button class="sub-tab ${detailView === "stored" ? "active" : ""}" type="button" onclick="changeDetailView('stored')">保管商品</button>
      <button class="sub-tab ${detailView === "unshipped" ? "active" : ""}" type="button" onclick="changeDetailView('unshipped')">未発送</button>
      <button class="sub-tab ${detailView === "shipped" ? "active" : ""}" type="button" onclick="changeDetailView('shipped')">発送済み</button>
    </div>

    ${products.length ? productTable(products) : emptyHtml("該当する商品はありません")}
  `;
}

window.changeDetailView = function(view) {
  detailView = view;
  renderMemberDetail(selectedMemberUid);
};

window.refreshAdminData = async function() {
  await loadData();
};

function productTable(products) {
  return `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>管理番号</th>
            <th>発送</th>
            <th>商品名</th>
            <th>ナンバリング</th>
            <th>作業依頼</th>
            <th>情報</th>
            <th>こだわり欄</th>
            <th>状態</th>
          </tr>
        </thead>
        <tbody>
          ${products.map(productRow).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function productRow(product) {
  return `
    <tr>
      <td>
        <div class="management-cell">
          <span class="management-number">${escapeHtml(product.managementNumber || "-")}</span>
          <button class="secondary compact-btn" type="button" onclick="openManagementEdit('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">編集</button>
        </div>
      </td>
      <td>${shippingPill(product.shippingRequest)}</td>
      <td>${escapeHtml(product.name || "-")}</td>
      <td>${escapeHtml(product.numbering || "-")}</td>
      <td>${escapeHtml(product.workRequest || "-")}</td>
      <td><button class="secondary compact-btn" type="button" onclick="showProductInfo('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">詳細</button></td>
      <td>${preferenceCell(product)}</td>
      <td>
        ${shippingStatusText(product)}
        ${hasValue(product.shippingRequest) ? `<button class="secondary compact-btn" style="margin-left:6px;" type="button" onclick="openShippingStatusEdit('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">編集</button>` : ""}
      </td>
    </tr>
  `;
}

function preferenceCell(product) {
  if (product.preferenceEnabled === true) {
    return `<button class="secondary compact-btn" type="button" onclick="showPreference('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">あり</button>`;
  }

  return `<span class="status-pill gray">なし</span>`;
}

window.showPreference = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product || product.preferenceEnabled !== true) return;

  openModal("こだわり内容", `
    <div class="detail-section">
      <div class="detail-heading">管理番号</div>
      <div>${escapeHtml(product.managementNumber || "-")}</div>
    </div>
    <div class="detail-section">
      <div class="detail-heading">こだわりコメント</div>
      <div style="white-space:pre-wrap;">${escapeHtml(product.preferenceComment || "内容が登録されていません。")}</div>
    </div>
  `);
};

window.showProductInfo = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product) return;

  openModal("商品情報", productDetailHtml(product));
};

function findProduct(ownerUid, productId) {
  const member = membersCache.find((item) => item.uid === ownerUid);
  if (!member) return null;
  return member.products.find((product) => product.id === productId) || null;
}

function productDetailHtml(product) {
  return `
    <div class="detail-section">
      <div class="detail-heading-row">
        <div class="detail-heading">管理番号情報</div>
        <button class="secondary compact-btn" type="button" onclick="openManagementEdit('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">編集</button>
      </div>
      <div class="detail-grid">
        <div class="detail-label">管理番号</div><div>${escapeHtml(product.managementNumber || "-")}</div>
        <div class="detail-label">こだわり</div><div>${product.preferenceEnabled === true ? "あり" : "なし"}</div>
        <div class="detail-label">コメント</div><div style="white-space:pre-wrap;">${escapeHtml(product.preferenceComment || "-")}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-heading-row">
        <div class="detail-heading">会員記載情報</div>
        <button class="secondary compact-btn" type="button" onclick="openMemberFieldsEdit('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">編集</button>
      </div>
      <div class="detail-grid">
        <div class="detail-label">商品名</div><div>${escapeHtml(product.name || "-")}</div>
        <div class="detail-label">ナンバリング</div><div>${escapeHtml(product.numbering || "-")}</div>
        <div class="detail-label">作業依頼</div><div>${escapeHtml(product.workRequest || "-")}</div>
        <div class="detail-label">備考欄</div><div>${escapeHtml(product.note || "-")}</div>
        <div class="detail-label">購入先URL</div><div>${product.purchaseUrl ? `<a href="${escapeAttr(product.purchaseUrl)}" target="_blank" rel="noopener">${escapeHtml(product.purchaseUrl)}</a>` : "-"}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-heading-row">
        <div class="detail-heading">管理者記載情報</div>
        <button class="secondary compact-btn" type="button" onclick="openAdminFieldsEdit('${escapeAttr(product.ownerUid || "")}','${escapeAttr(product.id)}')">編集</button>
      </div>
      <div class="detail-grid">
        <div class="detail-label">確認日</div><div>${escapeHtml(product.confirmationDate || "-")}</div>
        <div class="detail-label">確認結果</div><div>${escapeHtml(product.confirmationResult || "-")}</div>
        <div class="detail-label">写真URL</div><div>${product.photoUrl ? `<a href="${escapeAttr(product.photoUrl)}" target="_blank" rel="noopener">${escapeHtml(product.photoUrl)}</a>` : "-"}</div>
        <div class="detail-label">予想サイズ</div><div>${escapeHtml(product.expectedSize || "-")}</div>
        <div class="detail-label">保管場所</div><div>${escapeHtml(product.storageLocation || "-")}</div>
      </div>
    </div>
  `;
}

window.openManagementEdit = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product) return;

  activeEdit = { ownerUid, productId, type: "management" };
  editModalTitle.textContent = "管理番号・こだわりを編集";
  editForm.innerHTML = `
    <div class="form-grid">
      <div class="form-group">
        <label>管理番号</label>
        <input id="editManagementNumber" type="text" value="${escapeAttr(product.managementNumber || "")}">
      </div>
      <div class="form-group">
        <label>こだわりポイント</label>
        <select id="editPreferenceEnabled">
          <option value="false" ${product.preferenceEnabled === true ? "" : "selected"}>なし</option>
          <option value="true" ${product.preferenceEnabled === true ? "selected" : ""}>あり</option>
        </select>
      </div>
      <div class="form-group full">
        <label>こだわりコメント</label>
        <textarea id="editPreferenceComment" placeholder="その人なりのこだわりや注意点を記入">${escapeHtml(product.preferenceComment || "")}</textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="secondary" type="button" onclick="closeEditModal()">キャンセル</button>
      <button type="submit">保存する</button>
    </div>
  `;
  editModalBackdrop.classList.add("show");
};

window.openMemberFieldsEdit = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product) return;

  activeEdit = { ownerUid, productId, type: "member" };
  editModalTitle.textContent = "会員記載情報を編集";

    <div class="form-grid">
      <div class="form-group">
        <label>商品名</label>
        <input id="editName" type="text" value="${escapeAttr(product.name || "")}">
      </div>
      <div class="form-group">
        <label>ナンバリング</label>

      </div>
      <div class="form-group">
        <label>作業依頼</label>
        <select id="editWorkRequest">
          <option value="検品+写真" ${product.workRequest === "検品+写真" ? "selected" : ""}>検品+写真</option>
          <option value="写真のみ" ${product.workRequest === "写真のみ" ? "selected" : ""}>写真のみ</option>
          <option value="検品のみ" ${product.workRequest === "検品のみ" ? "selected" : ""}>検品のみ</option>
          <option value="保管のみ" ${product.workRequest === "保管のみ" ? "selected" : ""}>保管のみ</option>
        </select>
      </div>
      <div class="form-group">
        <label>購入先URL</label>
        <input id="editPurchaseUrl" type="url" value="${escapeAttr(product.purchaseUrl || "")}">

      <div class="form-group full">
        <label>備考欄</label>
        <textarea id="editNote">${escapeHtml(product.note || "")}</textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="secondary" type="button" onclick="closeEditModal()">キャンセル</button>
      <button type="submit">保存する</button>
    </div>
  `;
  editModalBackdrop.classList.add("show");
};

window.openAdminFieldsEdit = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product) return;

  activeEdit = { ownerUid, productId, type: "admin" };
  editModalTitle.textContent = "管理者記載情報を編集";
  editForm.innerHTML = `
    <div class="form-grid">
      <div class="form-group">
        <label>確認日</label>
        <input id="editConfirmationDate" type="date" value="${escapeAttr(product.confirmationDate || "")}">

      </div>

        <label>保管場所</label>

window.openShippingStatusEdit = function(ownerUid, productId) {
  const product = findProduct(ownerUid, productId);
  if (!product) return;

  activeEdit = { ownerUid, productId, type: "shippingStatus" };
  editModalTitle.textContent = "発送状態を編集";
  editForm.innerHTML = `
    <div class="form-group">
      <label>状態</label>
      <select id="editShippingStatus">
        <option value="unshipped" ${product.shippingStatus !== "shipped" ? "selected" : ""}>未発送</option>
        <option value="shipped" ${product.shippingStatus === "shipped" ? "selected" : ""}>発送済み</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="secondary" type="button" onclick="closeEditModal()">キャンセル</button>
      <button type="submit">保存する</button>
    </div>
  `;
  editModalBackdrop.classList.add("show");
};

function shippingPill(value) {
  if (value === "国内発送") return `<span class="status-pill blue">国内発送</span>`;
  if (value === "海外発送") return `<span class="status-pill green">海外発送</span>`;
  if (value === "返品依頼") return `<span class="status-pill yellow">返品依頼</span>`;
  return `<span class="status-pill gray">なし</span>`;
}

function shippingStatusText(product) {
  if (!hasValue(product.shippingRequest)) return `<span class="status-pill gray">未依頼</span>`;

  if (product.shippingStatus === "shipped") {
    return `
      <span class="status-pill blue">発送済み</span>
      <span class="shipped-date">${escapeHtml(product.shippedDate || "-")}</span>
    `;
  }

  return `<span class="status-pill yellow">未発送</span>`;
}

function openModal(title, body) {
  modalTitle.textContent = title;
  modalBody.innerHTML = body;
  modalBackdrop.classList.add("show");
}

function closeModal() {
  modalBackdrop.classList.remove("show");
  modalBody.innerHTML = "";
}

function closeEditModal() {
  editModalBackdrop.classList.remove("show");
  editForm.innerHTML = "";
  activeEdit = null;
}

window.closeEditModal = closeEditModal;

function showLoginUI() {
  currentUser = null;
  loginArea.classList.remove("hidden");
  appArea.classList.add("hidden");
}

function showAppUI(user) {
  loginArea.classList.add("hidden");
  appArea.classList.remove("hidden");
  userEmail.textContent = user.email || user.displayName || user.uid;
}

function emptyHtml(message) {
  return `<div class="empty"><h3>${escapeHtml(message)}</h3></div>`;
}

function showLoginError(message) {
  loginError.textContent = message;
  loginError.classList.add("show");
}

function clearLoginError() {
  loginError.textContent = "";
  loginError.classList.remove("show");
}

function showError(message) {
  errorMessage.textContent = message;
  errorMessage.classList.add("show");
}

function clearError() {
  errorMessage.textContent = "";
  errorMessage.classList.remove("show");
}

function hasValue(value) {
  return value !== undefined && value !== null && String(value).trim() !== "";
}

function statClass(value) {
  return Number(value) > 0 ? "stat highlight" : "stat";
}

function setStat(valueId, cardId, value) {
  document.getElementById(valueId).textContent = value;
  document.getElementById(cardId).className = statClass(value);
}

function countPill(value, color) {
  if (Number(value) <= 0) return `<span class="status-pill gray">0</span>`;
  return `<span class="status-pill ${color}">${value}</span>`;
}

function todayString() {
  const date = new Date();
  const yyyy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

function formatDateTime(value) {
  if (!value) return "-";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "-" : date.toLocaleString("ja-JP");
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll("`", "&#096;");
}
