<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おきらく便 管理者</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-soft: #eaf2ff;
      --border: #d9dee8;
      --text: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --white: #ffffff;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --yellow: #fff2b8;
      --yellow-text: #8a5a00;
      --gray-hi: #d7dce5;
      --gray-hi-text: #334155;
      --header: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #4f7df3 0%, #7551b8 100%);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 18px auto 56px;
      padding: 28px 18px 48px;
      background: var(--white);
      border-radius: 10px;
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(460px, 100%);
      background: var(--white);
      border-radius: 10px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: var(--blue);
      letter-spacing: 0;
    }

    .login-card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      font-weight: 700;
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 7px;
      background: #eef2f7;
      color: var(--text);
      font-weight: 700;
    }

    .danger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--danger-bg);
      color: var(--danger);
      font-weight: 700;
    }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      background: #eef2f7;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .mini-btn.blue {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .mini-btn.yellow {
      background: var(--yellow);
      color: var(--yellow-text);
    }

    .hidden {
      display: none !important;
    }

    .error {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #fff1f1;
      color: #d20f0f;
      line-height: 1.6;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      margin: 0;
      color: var(--blue);
      font-size: 30px;
      letter-spacing: 0.08em;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 18px;
      margin-top: 28px;
      border-bottom: 2px solid var(--border);
    }

    .tab {
      min-width: 112px;
      padding: 14px 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .section {
      margin-top: 26px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 26px;
    }

    .stats.four {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .stat-card {
      min-height: 114px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 20px;
      background: var(--white);
    }

    .stat-card.issue {
      border-color: #f6d672;
      background: #fff8d7;
    }

    .stat-card.neutral-hi {
      border-color: #bfc5cf;
      background: #eef1f5;
    }

    .stat-label {
      color: #475569;
      font-weight: 700;
      font-size: 14px;
    }

    .stat-value {
      margin-top: 16px;
      color: var(--blue);
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
    }

    .stat-card.neutral-hi .stat-value {
      color: #64748b;
    }

    h2 {
      margin: 28px 0 16px;
      font-size: 24px;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    th {
      background: var(--header);
      color: white;
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    td {
      padding: 14px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
      font-size: 14px;
    }

    tr:first-child td {
      border-top: 0;
    }

    .member-row {
      cursor: pointer;
    }

    .member-row:hover {
      background: #f8fbff;
    }

    .member-name {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .member-meta {
      color: #475569;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-weight: 800;
    }

    .count-pill.issue {
      background: var(--yellow);
      color: var(--yellow-text);
    }

    .count-pill.neutral-hi {
      background: var(--gray-hi);
      color: var(--gray-hi-text);
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-top: 26px;
    }

    .detail-name {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .management-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .management-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .detail-tabs {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 28px auto 20px;
      border-bottom: 2px solid var(--border);
      max-width: 780px;
    }

    .detail-tab {
      min-width: 140px;
      padding: 13px 8px;
      background: transparent;
      color: #8a93a3;
      font-weight: 700;
      border-bottom: 3px solid transparent;
    }

    .detail-tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .ship-badge,
    .status-pill,
    .preference-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .ship-badge.domestic {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .ship-badge.international {
      background: #dcfce7;
      color: #15803d;
    }

    .ship-badge.return {
      background: #fee2e2;
      color: #b91c1c;
    }

    .ship-badge.speedpak {
      background: #ffedd5;
      color: #c2410c;
    }

    .ship-badge.none {
      background: #f1f5f9;
      color: #64748b;
    }

    .status-pill.yellow {
      background: var(--yellow);
      color: var(--yellow-text);
    }

    .status-pill.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-pill.gray {
      background: #f1f5f9;
      color: #64748b;
    }

    .preference-pill.active {
      background: #eef2ff;
      color: #3730a3;
      cursor: pointer;
    }

    .preference-pill.inactive {
      background: #f1f5f9;
      color: #64748b;
    }

    .shipped-date {
      display: inline-block;
      margin-left: 8px;
      color: #475569;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      padding: 32px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.68);
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      padding: 24px;
    }

    .modal.wide {
      width: min(920px, 100%);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .info-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      margin-top: 12px;
    }

    .info-box-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--blue);
      font-weight: 800;
      font-size: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
      line-height: 1.6;
    }

    .info-label {
      color: #64748b;
      font-weight: 800;
    }

    .info-value {
      word-break: break-word;
      white-space: pre-wrap;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #334155;
      font-weight: 800;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 10px 12px;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .link-cell {
      color: var(--blue);
      text-decoration: underline;
      word-break: break-all;
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 20px);
        padding: 22px 12px 38px;
      }

      .topbar,
      .detail-header {
        align-items: stretch;
        flex-direction: column;
      }

      .user-area {
        justify-content: flex-start;
      }

      .stats,
      .stats.four {
        grid-template-columns: 1fr;
      }

      .tabs,
      .detail-tabs {
        overflow-x: auto;
        justify-content: flex-start;
      }

      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-page">
    <div class="login-card">
      <h1>おきらく便</h1>
      <p>管理者としてログインしてください。</p>
      <div id="loginError" class="error hidden"></div>
      <button id="loginBtn" class="primary-btn">Googleで管理者ログイン</button>
    </div>
  </div>

  <main id="appView" class="page hidden">
    <div id="appError" class="error hidden"></div>

    <header class="topbar">
      <h1 class="brand">おきらく便</h1>
      <div class="user-area">
        <span id="userEmail"></span>
        <span class="role-pill">管理者</span>
        <button id="logoutBtn" class="secondary-btn">ログアウト</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-main-tab="members">メンバー一覧</button>
      <button class="tab" data-main-tab="detail">メンバー詳細</button>
    </nav>

    <section id="membersSection" class="section">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">メンバー</div>
          <div id="totalMembers" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">登録済み商品</div>
          <div id="totalRegistered" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">未発送</div>
          <div id="totalUnshipped" class="stat-value">0</div>
        </div>
      </div>

      <h2>メンバー一覧</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>メンバー</th>
              <th>管理番号</th>
              <th>登録済み商品</th>
              <th>保管商品</th>
              <th>未発送</th>
              <th>発送済み</th>
              <th>最終ログイン</th>
            </tr>
          </thead>
          <tbody id="memberListBody"></tbody>
        </table>
      </div>
    </section>

    <section id="detailSection" class="section hidden">
      <div id="detailEmpty" class="empty">メンバー一覧からメンバーを選択してください。</div>

      <div id="detailContent" class="hidden">
        <div class="detail-header">
          <div>
            <h2 id="detailMemberName" class="detail-name"></h2>
            <div id="detailMemberEmail" class="member-meta"></div>
            <div id="detailMemberUid" class="member-meta"></div>
            <div id="detailManagementHeader" class="management-header"></div>
          </div>
          <button id="reloadBtn" class="secondary-btn">再読み込み</button>
        </div>

        <div class="stats four">
          <div id="detailRegisteredCard" class="stat-card">
            <div class="stat-label">登録済み商品</div>
            <div id="detailRegisteredCount" class="stat-value">0</div>
          </div>
          <div id="detailStoredCard" class="stat-card">
            <div class="stat-label">保管商品</div>
            <div id="detailStoredCount" class="stat-value">0</div>
          </div>
          <div id="detailUnshippedCard" class="stat-card">
            <div class="stat-label">未発送</div>
            <div id="detailUnshippedCount" class="stat-value">0</div>
          </div>
          <div id="detailShippedCard" class="stat-card">
            <div class="stat-label">発送済み</div>
            <div id="detailShippedCount" class="stat-value">0</div>
          </div>
        </div>

        <nav class="detail-tabs">
          <button class="detail-tab active" data-detail-view="registered">登録済み商品</button>
          <button class="detail-tab" data-detail-view="stored">保管商品</button>
          <button class="detail-tab" data-detail-view="unshipped">未発送</button>
          <button class="detail-tab" data-detail-view="shipped">発送済み</button>
        </nav>

        <div id="detailTableArea"></div>
      </div>
    </section>
  </main>

  <div id="infoModalBackdrop" class="modal-backdrop">
    <div class="modal wide">
      <div class="modal-head">
        <h2 id="infoModalTitle">商品情報</h2>
        <button class="secondary-btn" onclick="closeInfoModal()">閉じる</button>
      </div>
      <div id="infoModalBody"></div>
    </div>
  </div>

  <div id="editModalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="editModalTitle">編集</h2>
        <button id="editModalCloseBtn" class="secondary-btn" type="button">閉じる</button>
      </div>
      <form id="editForm"></form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      set,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCBb3FK_mXoeWCCI2-BJlPIMPwwOxG-kI",
      authDomain: "okirakubin-manager.firebaseapp.com",
      projectId: "okirakubin-manager",
      storageBucket: "okirakubin-manager.firebasestorage.app",
      messagingSenderId: "387991576787",
      appId: "1:387991576787:web:db731b898f46dc8214f426"
    };

    const databaseUrl = "https://okirakubin-manager-default-rtdb.asia-southeast1.firebasedatabase.app";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getDatabase(app, databaseUrl);

    const loginView = document.getElementById("loginView");
    const appView = document.getElementById("appView");
    const loginError = document.getElementById("loginError");
    const appError = document.getElementById("appError");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userEmail = document.getElementById("userEmail");
    const reloadBtn = document.getElementById("reloadBtn");

    const membersSection = document.getElementById("membersSection");
    const detailSection = document.getElementById("detailSection");
    const detailEmpty = document.getElementById("detailEmpty");
    const detailContent = document.getElementById("detailContent");
    const memberListBody = document.getElementById("memberListBody");

    const totalMembers = document.getElementById("totalMembers");
    const totalRegistered = document.getElementById("totalRegistered");
    const totalUnshipped = document.getElementById("totalUnshipped");

    const detailMemberName = document.getElementById("detailMemberName");
    const detailMemberEmail = document.getElementById("detailMemberEmail");
    const detailMemberUid = document.getElementById("detailMemberUid");
    const detailManagementHeader = document.getElementById("detailManagementHeader");

    const detailRegisteredCard = document.getElementById("detailRegisteredCard");
    const detailStoredCard = document.getElementById("detailStoredCard");
    const detailUnshippedCard = document.getElementById("detailUnshippedCard");
    const detailShippedCard = document.getElementById("detailShippedCard");

    const detailRegisteredCount = document.getElementById("detailRegisteredCount");
    const detailStoredCount = document.getElementById("detailStoredCount");
    const detailUnshippedCount = document.getElementById("detailUnshippedCount");
    const detailShippedCount = document.getElementById("detailShippedCount");
    const detailTableArea = document.getElementById("detailTableArea");

    const infoModalBackdrop = document.getElementById("infoModalBackdrop");
    const infoModalBody = document.getElementById("infoModalBody");
    const infoModalTitle = document.getElementById("infoModalTitle");

    const editModalBackdrop = document.getElementById("editModalBackdrop");
    const editModalTitle = document.getElementById("editModalTitle");
    const editModalCloseBtn = document.getElementById("editModalCloseBtn");
    const editForm = document.getElementById("editForm");

    let currentUser = null;
    let membersCache = [];
    let selectedMemberUid = null;
    let detailView = "registered";
    let activeEdit = null;

    loginBtn.addEventListener("click", async () => {
      hideError(loginError);
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        showError(loginError, "ログインに失敗しました。Firebase Authentication の設定を確認してください。");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    reloadBtn.addEventListener("click", async () => {
      await loadAllData();
    });

    document.querySelectorAll("[data-main-tab]").forEach((button) => {
      button.addEventListener("click", () => {
        setMainTab(button.dataset.mainTab);
      });
    });

    document.querySelectorAll("[data-detail-view]").forEach((button) => {
      button.addEventListener("click", () => {
        detailView = button.dataset.detailView;
        renderMemberDetail();
      });
    });

    editModalCloseBtn.addEventListener("click", closeEditModal);

    onAuthStateChanged(auth, async (user) => {
      hideError(loginError);
      hideError(appError);

      if (!user) {
        currentUser = null;
        membersCache = [];
        selectedMemberUid = null;
        loginView.classList.remove("hidden");
        appView.classList.add("hidden");
        return;
      }

      currentUser = user;

      try {
        const adminSnap = await get(ref(db, `admins/${user.uid}`));
        if (adminSnap.val() !== true) {
          await signOut(auth);
          showError(loginError, "このアカウントは管理者として登録されていません。");
          return;
        }

        userEmail.textContent = user.email || "";
        loginView.classList.add("hidden");
        appView.classList.remove("hidden");
        await update(ref(db, `loginUsers/${user.uid}`), {
          email: user.email || "",
          name: user.displayName || "",
          uid: user.uid,
          role: "admin",
          lastLoginAt: Date.now()
        });
        await loadAllData();
      } catch (error) {
        showError(loginError, "管理者認証に失敗しました。Realtime Database のルールを確認してください。");
        await signOut(auth);
      }
    });

    async function loadAllData() {
      hideError(appError);

      try {
        const [membersSnap, usersSnap, productsSnap] = await Promise.all([
          get(ref(db, "members")),
          get(ref(db, "loginUsers")),
          get(ref(db, "products"))
        ]);

        const membersRaw = membersSnap.val() || {};
        const usersRaw = usersSnap.val() || {};
        const productsRaw = productsSnap.val() || {};

        membersCache = Object.keys(membersRaw)
          .filter((uid) => membersRaw[uid] === true)
          .map((uid) => {
            const user = usersRaw[uid] || {};
            const productMap = productsRaw[uid] || {};
            const products = Object.entries(productMap).map(([id, value]) => ({
              id,
              uid,
              ...(value || {})
            })).sort(sortProducts);

            return {
              uid,
              name: user.name || user.email || "未設定",
              email: user.email || "-",
              lastLoginAt: user.lastLoginAt || null,
              products,
              registeredProducts: products.filter(isRegisteredProduct),
              storedProducts: products.filter(isStoredProduct),
              unshippedProducts: products.filter(isUnshippedProduct),
              shippedProducts: products.filter(isShippedProduct)
            };
          }).sort((a, b) => String(a.name).localeCompare(String(b.name), "ja"));

        if (selectedMemberUid && !membersCache.some((member) => member.uid === selectedMemberUid)) {
          selectedMemberUid = null;
        }

        renderMembers();
        renderMemberDetail();
      } catch (error) {
        showError(appError, "データの読み込みに失敗しました。Realtime Databaseのルールを確認してください。");
      }
    }

    function sortProducts(a, b) {
      const aNumber = String(a.numbering || "");
      const bNumber = String(b.numbering || "");
      const numberCompare = aNumber.localeCompare(bNumber, "ja", { numeric: true });
      if (numberCompare !== 0) return numberCompare;
      return Number(a.createdAt || 0) - Number(b.createdAt || 0);
    }

    function isRegisteredProduct(product) {
      return !hasValue(product.shippingRequest) && !hasValue(product.shootingDate);
    }

    function isStoredProduct(product) {
      return !hasValue(product.shippingRequest) && hasValue(product.shootingDate);
    }

    function isUnshippedProduct(product) {
      return hasValue(product.shippingRequest) && product.shippingStatus !== "shipped";
    }

    function isShippedProduct(product) {
      return product.shippingStatus === "shipped";
    }

    function renderMembers() {
      const registeredCount = membersCache.reduce((sum, member) => sum + member.registeredProducts.length, 0);
      const unshippedCount = membersCache.reduce((sum, member) => sum + member.unshippedProducts.length, 0);

      totalMembers.textContent = membersCache.length;
      totalRegistered.textContent = registeredCount;
      totalUnshipped.textContent = unshippedCount;

      if (!membersCache.length) {
        memberListBody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty">メンバーが登録されていません。</div>
            </td>
          </tr>
        `;
        return;
      }

      memberListBody.innerHTML = membersCache.map((member) => `
        <tr class="member-row" onclick="selectMember('${escapeAttr(member.uid)}')">
          <td>
            <div class="member-name">${escapeHtml(member.name)}</div>
            <div class="member-meta">${escapeHtml(member.email)}</div>
            <div class="member-meta">${escapeHtml(member.uid)}</div>
          </td>
          <td onclick="event.stopPropagation();">
            ${managementListCell(member)}
          </td>
          <td>${countPill(member.registeredProducts.length, "issue")}</td>
          <td>${countPill(member.storedProducts.length, "neutral-hi")}</td>
          <td>${countPill(member.unshippedProducts.length, "issue")}</td>
          <td>${countPill(member.shippedProducts.length, "neutral-hi")}</td>
          <td>${formatDateTime(member.lastLoginAt)}</td>
        </tr>
      `).join("");
    }

    function managementListCell(member) {
      if (!member.products.length) return `<span class="member-meta">-</span>`;

      return member.products.map((product) => `
        <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
          <strong>${escapeHtml(product.managementNumber || "-")}</strong>
          <button class="mini-btn" onclick="openManagementEdit('${escapeAttr(member.uid)}','${escapeAttr(product.id)}')">編集</button>
        </div>
      `).join("");
    }

    function countPill(value, type) {
      const className = value > 0 ? type : "";
      return `<span class="count-pill ${className}">${value}</span>`;
    }

    function selectMember(uid) {
      selectedMemberUid = uid;
      detailView = "registered";
      setMainTab("detail");
      renderMemberDetail();
    }

    function setMainTab(tabName) {
      document.querySelectorAll("[data-main-tab]").forEach((button) => {
        button.classList.toggle("active", button.dataset.mainTab === tabName);
      });

      membersSection.classList.toggle("hidden", tabName !== "members");
      detailSection.classList.toggle("hidden", tabName !== "detail");
    }

    function renderMemberDetail() {
      const member = membersCache.find((item) => item.uid === selectedMemberUid);

      if (!member) {
        detailEmpty.classList.remove("hidden");
        detailContent.classList.add("hidden");
        return;
      }

      detailEmpty.classList.add("hidden");
      detailContent.classList.remove("hidden");

      detailMemberName.textContent = member.name;
      detailMemberEmail.textContent = member.email;
      detailMemberUid.textContent = member.uid;
      detailManagementHeader.innerHTML = managementHeaderList(member.products);

      setStatCard(detailRegisteredCard, member.registeredProducts.length, "issue");
      setStatCard(detailStoredCard, member.storedProducts.length, "neutral-hi");
      setStatCard(detailUnshippedCard, member.unshippedProducts.length, "issue");
      setStatCard(detailShippedCard, member.shippedProducts.length, "neutral-hi");

      detailRegisteredCount.textContent = member.registeredProducts.length;
      detailStoredCount.textContent = member.storedProducts.length;
      detailUnshippedCount.textContent = member.unshippedProducts.length;
      detailShippedCount.textContent = member.shippedProducts.length;

      document.querySelectorAll("[data-detail-view]").forEach((button) => {
        button.classList.toggle("active", button.dataset.detailView === detailView);
      });

      const products = getDetailProducts(member);
      renderDetailTable(products);
    }

    function managementHeaderList(products) {
      const values = products
        .map((product) => product.managementNumber)
        .filter(hasValue);

      if (!values.length) {
        return `<span class="management-pill">管理番号なし</span>`;
      }

      return values.map((value) => `<span class="management-pill">管理番号 ${escapeHtml(value)}</span>`).join("");
    }

    function setStatCard(card, value, type) {
      card.classList.remove("issue", "neutral-hi");
      if (value > 0) {
        card.classList.add(type);
      }
    }

    function getDetailProducts(member) {
      if (detailView === "stored") return member.storedProducts;
      if (detailView === "unshipped") return member.unshippedProducts;
      if (detailView === "shipped") return member.shippedProducts;
      return member.registeredProducts;
    }

    function renderDetailTable(products) {
      const isShippingView = detailView === "unshipped" || detailView === "shipped";
      const customHeader = isShippingView ? "発送情報" : "こだわり欄";

      if (!products.length) {
        detailTableArea.innerHTML = `<div class="empty">表示できる商品がありません。</div>`;
        return;
      }

      detailTableArea.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>発送</th>
                <th>商品名</th>
                <th>ナンバリング</th>
                <th>作業依頼</th>
                <th>情報</th>
                <th>${customHeader}</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody>
              ${products.map((product) => productRow(product, isShippingView)).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function productRow(product, isShippingView) {
      return `
        <tr>
          <td>${shippingBadge(product.shippingRequest)}</td>
          <td>${escapeHtml(product.name || "-")}</td>
          <td>${escapeHtml(product.numbering || "-")}</td>
          <td>${escapeHtml(product.workRequest || "-")}</td>
          <td>
            <button class="mini-btn" onclick="openInfoModal('${escapeAttr(product.uid)}','${escapeAttr(product.id)}')">詳細</button>
          </td>
          <td>${isShippingView ? shippingInfoCell(product) : preferenceCell(product)}</td>
          <td>
            ${shippingStatusText(product)}
            <button class="mini-btn" onclick="openStatusEdit('${escapeAttr(product.uid)}','${escapeAttr(product.id)}')">編集</button>
          </td>
        </tr>
      `;
    }

    function shippingBadge(value) {
      const map = {
        domestic: ["国内発送", "domestic"],
        international: ["海外発送", "international"],
        return: ["返品依頼", "return"],
        speedpak: ["SpeedPAK", "speedpak"]
      };

      if (!hasValue(value)) {
        return `<span class="ship-badge none">なし</span>`;
      }

      const [label, className] = map[value] || [value, "none"];
      return `<span class="ship-badge ${className}">${escapeHtml(label)}</span>`;
    }

    function shippingInfoCell(product) {
      if (!hasValue(product.shippingRequest)) return "-";
      return `<button class="mini-btn" onclick="openShippingInfo('${escapeAttr(product.uid)}','${escapeAttr(product.id)}')">詳細</button>`;
    }

    function preferenceCell(product) {
      if (product.preferenceEnabled === true) {
        return `<button class="preference-pill active" onclick="openPreferenceModal('${escapeAttr(product.uid)}','${escapeAttr(product.id)}')">あり</button>`;
      }
      return `<span class="preference-pill inactive">なし</span>`;
    }

    function shippingStatusText(product) {
      if (product.shippingStatus === "shipped") {
        return `
          <span class="status-pill blue">発送済み</span>
          <span class="shipped-date">${escapeHtml(product.shippedDate || "-")}</span>
        `;
      }

      if (hasValue(product.shippingRequest)) {
        return `<span class="status-pill yellow">未発送</span>`;
      }

      return `<span class="status-pill gray">未依頼</span>`;
    }

    function findProduct(uid, productId) {
      const member = membersCache.find((item) => item.uid === uid);
      if (!member) return null;
      return member.products.find((product) => product.id === productId) || null;
    }

    function openInfoModal(uid, productId) {

      infoModalTitle.textContent = "商品情報";

        <div class="info-box">

            <div class="info-value">${escapeHtml(product.managementNumber || "-")}</div>
            <div class="info-label">こだわり</div>
            <div class="info-value">${product.preferenceEnabled === true ? "あり" : "なし"}</div>
            <div class="info-label">こだわり内容</div>

          </div>

        <div class="info-box">
          <div class="info-box-title">
            <span>会員記載情報</span>
            <button class="mini-btn" onclick="openMemberFieldsEdit('${escapeAttr(uid)}','${escapeAttr(productId)}')">編集</button>
          </div>

            <div class="info-label">作業依頼</div>
            <div class="info-value">${escapeHtml(product.workRequest || "-")}</div>

        <div class="info-box">

          </div>

            <div class="info-value">${escapeHtml(product.confirmationDate || "-")}</div>
            <div class="info-label">確認結果</div>
            <div class="info-value">${escapeHtml(product.confirmationResult || "-")}</div>
            <div class="info-label">写真URL</div>
            <div class="info-value">${linkOrDash(product.photoUrl)}</div>

            <div class="info-label">保管場所</div>
            <div class="info-value">${escapeHtml(product.storageLocation || "-")}</div>
          </div>
        </div>
      `;

      infoModalBackdrop.classList.add("show");
    }

    function openShippingInfo(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product) return;

      infoModalTitle.textContent = "発送情報";
      infoModalBody.innerHTML = `
        <div class="info-box">
          <div class="info-box-title">発送依頼</div>
          <div class="info-grid">
            <div class="info-label">発送種別</div>
            <div class="info-value">${shippingBadge(product.shippingRequest)}</div>
            <div class="info-label">状態</div>
            <div class="info-value">${shippingStatusText(product)}</div>
          </div>
        </div>

        <div class="info-box">
          <div class="info-box-title">発送先</div>
          ${addressInfo(product.shippingDestination)}
        </div>

        <div class="info-box">
          <div class="info-box-title">発送元</div>
          ${addressInfo(product.shippingOrigin)}
        </div>
      `;

      infoModalBackdrop.classList.add("show");
    }

    function openPreferenceModal(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product || product.preferenceEnabled !== true) return;

      infoModalTitle.textContent = "こだわり欄";
      infoModalBody.innerHTML = `
        <div class="info-box">
          <div class="info-grid">
            <div class="info-label">管理番号</div>
            <div class="info-value">${escapeHtml(product.managementNumber || "-")}</div>
            <div class="info-label">内容</div>
            <div class="info-value">${escapeHtml(product.preferenceComment || "-")}</div>
          </div>
        </div>
      `;

      infoModalBackdrop.classList.add("show");
    }

    function addressInfo(address) {
      const data = address || {};
      return `
        <div class="info-grid">
          <div class="info-label">宛名</div>
          <div class="info-value">${escapeHtml(data.name || "-")}</div>
          <div class="info-label">郵便番号</div>
          <div class="info-value">${escapeHtml(data.zip || "-")}</div>
          <div class="info-label">都道府県</div>
          <div class="info-value">${escapeHtml(data.prefecture || "-")}</div>
          <div class="info-label">住所</div>
          <div class="info-value">${escapeHtml(data.address || "-")}</div>
          <div class="info-label">建物名など</div>
          <div class="info-value">${escapeHtml(data.building || "-")}</div>
          <div class="info-label">電話番号</div>
          <div class="info-value">${escapeHtml(data.phone || "-")}</div>
          <div class="info-label">備考</div>
          <div class="info-value">${escapeHtml(data.note || "-")}</div>
        </div>
      `;
    }

    function closeInfoModal() {
      infoModalBackdrop.classList.remove("show");
      infoModalBody.innerHTML = "";
    }

    window.closeInfoModal = closeInfoModal;

    function openManagementEdit(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product) return;

      activeEdit = { uid, productId, type: "management" };
      editModalTitle.textContent = "管理番号を編集";
      editForm.innerHTML = `
        <div class="form-grid">
          <label>
            管理番号
            <input name="managementNumber" value="${escapeAttr(product.managementNumber || "")}" />
          </label>

          <label>
            こだわりポイント
            <select name="preferenceEnabled">
              <option value="false" ${product.preferenceEnabled === true ? "" : "selected"}>なし</option>
              <option value="true" ${product.preferenceEnabled === true ? "selected" : ""}>あり</option>
            </select>
          </label>

          <label>
            こだわりコメント
            <textarea name="preferenceComment">${escapeHtml(product.preferenceComment || "")}</textarea>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      `;
      editModalBackdrop.classList.add("show");
    }

    function openMemberFieldsEdit(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product) return;

      activeEdit = { uid, productId, type: "memberFields" };
      editModalTitle.textContent = "会員記載情報を編集";
      editForm.innerHTML = `
        <div class="form-grid">
          <label>
            商品名
            <input name="name" value="${escapeAttr(product.name || "")}" />
          </label>

          <label>
            ナンバリング
            <input name="numbering" value="${escapeAttr(product.numbering || "")}" />
          </label>

          <label>
            作業依頼
            <select name="workRequest">
              ${workRequestOptions(product.workRequest)}
            </select>
          </label>

          <label>
            備考欄
            <textarea name="note">${escapeHtml(product.note || "")}</textarea>
          </label>

          <label>
            購入先URL
            <input name="purchaseUrl" value="${escapeAttr(product.purchaseUrl || "")}" />
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      `;
      editModalBackdrop.classList.add("show");
    }

    function openAdminFieldsEdit(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product) return;

      activeEdit = { uid, productId, type: "adminFields" };
      editModalTitle.textContent = "管理者記載情報を編集";
      editForm.innerHTML = `
        <div class="form-grid">
          <label>
            確認日
            <input type="date" name="confirmationDate" value="${escapeAttr(product.confirmationDate || "")}" />
          </label>

          <label>
            確認結果
            <textarea name="confirmationResult">${escapeHtml(product.confirmationResult || "")}</textarea>
          </label>

          <label>
            写真URL
            <input name="photoUrl" value="${escapeAttr(product.photoUrl || "")}" />
          </label>

          <label>
            予想サイズ
            <input name="expectedSize" value="${escapeAttr(product.expectedSize || "")}" />
          </label>

          <label>
            保管場所
            <input name="storageLocation" value="${escapeAttr(product.storageLocation || "")}" />
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      `;
      editModalBackdrop.classList.add("show");
    }

    function openStatusEdit(uid, productId) {
      const product = findProduct(uid, productId);
      if (!product) return;

      activeEdit = { uid, productId, type: "status" };
      editModalTitle.textContent = "発送状態を編集";
      editForm.innerHTML = `
        <div class="form-grid">
          <label>
            状態
            <select name="shippingStatus">
              <option value="unshipped" ${product.shippingStatus === "shipped" ? "" : "selected"}>未発送</option>
              <option value="shipped" ${product.shippingStatus === "shipped" ? "selected" : ""}>発送済み</option>
            </select>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="secondary-btn" onclick="closeEditModal()">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      `;
      editModalBackdrop.classList.add("show");
    }

    editForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!activeEdit) return;

      const formData = new FormData(editForm);
      const path = `products/${activeEdit.uid}/${activeEdit.productId}`;
      const now = Date.now();

      let payload = { updatedAt: now };

      if (activeEdit.type === "management") {
        payload = {
          ...payload,
          managementNumber: getFormValue(formData, "managementNumber"),
          preferenceEnabled: getFormValue(formData, "preferenceEnabled") === "true",
          preferenceComment: getFormValue(formData, "preferenceComment")
        };
      }

      if (activeEdit.type === "memberFields") {
        payload = {
          ...payload,
          name: getFormValue(formData, "name"),
          numbering: getFormValue(formData, "numbering"),
          workRequest: getFormValue(formData, "workRequest"),
          note: getFormValue(formData, "note"),
          purchaseUrl: getFormValue(formData, "purchaseUrl")
        };
      }

      if (activeEdit.type === "adminFields") {
        const confirmationDate = getFormValue(formData, "confirmationDate");
        payload = {
          ...payload,
          confirmationDate,
          shootingDate: confirmationDate,
          confirmationResult: getFormValue(formData, "confirmationResult"),
          photoUrl: getFormValue(formData, "photoUrl"),
          expectedSize: getFormValue(formData, "expectedSize"),
          storageLocation: getFormValue(formData, "storageLocation")
        };
      }

      if (activeEdit.type === "status") {
        const status = getFormValue(formData, "shippingStatus");
        payload = {
          ...payload,
          shippingStatus: status,
          shippedDate: status === "shipped" ? todayString() : ""
        };
      }

      try {
        await update(ref(db, path), payload);
        closeEditModal();
        await loadAllData();
        if (activeEdit?.uid) {
          selectedMemberUid = activeEdit.uid;
        }
      } catch (error) {
        showError(appError, "保存に失敗しました。Realtime Databaseのルールを確認してください。");
      }
    });

    function closeEditModal() {
      editModalBackdrop.classList.remove("show");
      editForm.innerHTML = "";
      activeEdit = null;
    }

    window.closeEditModal = closeEditModal;
    window.selectMember = selectMember;
    window.openInfoModal = openInfoModal;
    window.openShippingInfo = openShippingInfo;
    window.openPreferenceModal = openPreferenceModal;
    window.openManagementEdit = openManagementEdit;
    window.openMemberFieldsEdit = openMemberFieldsEdit;
    window.openAdminFieldsEdit = openAdminFieldsEdit;
    window.openStatusEdit = openStatusEdit;

    function workRequestOptions(current) {
      const options = ["検品+写真", "写真のみ", "検品のみ", "保管のみ"];
      return options.map((option) => `
        <option value="${escapeAttr(option)}" ${current === option ? "selected" : ""}>${escapeHtml(option)}</option>
      `).join("");
    }

    function getFormValue(formData, key) {
      return String(formData.get(key) || "").trim();
    }

    function linkOrDash(value) {
      if (!hasValue(value)) return "-";
      const safe = escapeAttr(value);
      return `<a class="link-cell" href="${safe}" target="_blank" rel="noopener noreferrer">${escapeHtml(value)}</a>`;
    }

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function showError(element, message) {
      element.textContent = message;
      element.classList.remove("hidden");
    }

    function hideError(element) {
      element.textContent = "";
      element.classList.add("hidden");
    }

    function todayString() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDateTime(value) {
      if (!value) return "-";
      const date = new Date(Number(value));
      if (Number.isNaN(date.getTime())) return "-";
      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
