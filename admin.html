<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おきらく便 管理者</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-soft: #eaf2ff;
      --border: #d9dee8;
      --text: #0f172a;
      --muted: #64748b;
      --white: #fff;
      --danger: #dc2626;
      --danger-bg: #fee2e2;
      --yellow: #fff2b8;
      --yellow-soft: #fff9d9;
      --yellow-text: #8a5a00;
      --gray-hi: #d7dce5;
      --gray-hi-text: #334155;
      --header: #6b7280;
      --green-soft: #dcfce7;
      --green-text: #15803d;
      --orange-soft: #ffedd5;
      --orange-text: #c2410c;
      --red-soft: #fee2e2;
      --red-text: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #4f7df3 0%, #7551b8 100%);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 18px auto 56px;
      padding: 28px 18px 48px;
      background: var(--white);
      border-radius: 10px;
    }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(460px, 100%);
      background: var(--white);
      border-radius: 10px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: var(--blue);
    }

    .login-card p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.7;
    }

    .primary-btn, .secondary-btn, .mini-btn, .danger-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      white-space: nowrap;
    }

    .primary-btn {
      gap: 8px;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      background: var(--blue);
      color: white;
    }

    .secondary-btn {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 7px;
      background: #eef2f7;
      color: var(--text);
    }

    .danger-btn {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--danger-bg);
      color: var(--danger);
    }

    .mini-btn {
      min-height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      background: #eef2f7;
      color: var(--text);
      font-size: 13px;
    }

    .mini-btn.yellow {
      background: var(--yellow);
      color: var(--yellow-text);
    }

    .hidden { display: none !important; }

    .error {
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      background: #fff1f1;
      color: #d20f0f;
      line-height: 1.6;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      margin: 0;
      color: var(--blue);
      font-size: 30px;
      letter-spacing: 0.08em;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 18px;
      margin-top: 28px;
      border-bottom: 2px solid var(--border);
    }

    .tab {
      min-width: 112px;
      padding: 14px 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .section { margin-top: 26px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 26px;
    }

    .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .stat-card {
      min-height: 114px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 20px;
      background: var(--white);
    }

    .stat-card.clickable { cursor: pointer; }

    .stat-card.active-view {
      border-color: var(--blue);
      box-shadow: inset 0 -3px 0 var(--blue);
    }

    .stat-card.issue {
      border-color: #f6d672;
      background: #fff8d7;
    }

    .stat-card.neutral-hi {
      border-color: #bfc5cf;
      background: #eef1f5;
    }

    .stat-label {
      color: #475569;
      font-weight: 700;
      font-size: 14px;
    }

    .stat-value {
      margin-top: 16px;
      color: var(--blue);
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
    }

    .stat-card.neutral-hi .stat-value { color: #64748b; }

    h2 {
      margin: 28px 0 16px;
      font-size: 24px;
    }

    .table-actions, .invoice-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin: 0 0 12px;
      flex-wrap: wrap;
    }

    .table-actions label, .invoice-actions label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #475569;
      font-weight: 800;
    }

    .table-actions input, .invoice-actions input, .detail-invoice-input {
      width: 150px;
      min-height: 36px;
      padding: 6px 10px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
    }

    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }

    th {
      background: var(--header);
      color: white;
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      white-space: nowrap;
    }

    td {
      padding: 14px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
      font-size: 14px;
    }

    .member-row { cursor: pointer; }
    .member-row:hover { background: #f8fbff; }

    .member-name {
      font-weight: 800;
      margin-bottom: 6px;
    }

    .member-meta {
      color: #475569;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }

    .management-cell, .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #64748b;
      font-weight: 800;
    }

    .count-pill.issue {
      background: var(--yellow);
      color: var(--yellow-text);
    }

    .count-pill.neutral-hi {
      background: var(--gray-hi);
      color: var(--gray-hi-text);
    }

    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-top: 26px;
    }

    .detail-name {
      margin: 0 0 10px;
      font-size: 24px;
    }

    .management-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .management-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
    }

    .ship-badge, .status-pill, .preference-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }

    .ship-badge.domestic { background: #dbeafe; color: #1d4ed8; }
    .ship-badge.international { background: var(--green-soft); color: var(--green-text); }
    .ship-badge.return { background: var(--red-soft); color: var(--red-text); }
    .ship-badge.speedpak { background: var(--orange-soft); color: var(--orange-text); }
    .ship-badge.none { background: #f1f5f9; color: #64748b; }

    .status-pill.yellow { background: var(--yellow); color: var(--yellow-text); }
    .status-pill.blue { background: #dbeafe; color: #1d4ed8; }
    .status-pill.gray { background: #f1f5f9; color: #64748b; }

    .preference-pill.active {
      background: var(--yellow);
      color: var(--yellow-text);
      cursor: pointer;
    }

    .preference-pill.inactive {
      background: #f1f5f9;
      color: #64748b;
    }

    .shipped-date {
      display: inline-block;
      margin-left: 8px;
      color: #475569;
      font-weight: 700;
      white-space: nowrap;
    }

    .empty {
      padding: 32px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.68);
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: white;
      border-radius: 10px;
      padding: 24px;
    }

    .modal.wide { width: min(920px, 100%); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .info-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      margin-top: 12px;
    }

    .info-box.highlight {
      border-color: #f6d672;
      background: var(--yellow-soft);
    }

    .info-box-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--blue);
      font-weight: 800;
      font-size: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
      line-height: 1.6;
    }

    .info-label {
      color: #64748b;
      font-weight: 800;
    }

    .info-value {
      word-break: break-word;
      white-space: pre-wrap;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #334155;
      font-weight: 800;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      padding: 10px 12px;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .link-cell {
      color: var(--blue);
      text-decoration: underline;
      word-break: break-all;
    }

    .invoice-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .invoice-summary-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      background: #f8fafc;
    }

    .invoice-summary-item strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
      color: var(--blue);
    }

    .announcement-form {
      display: grid;
      gap: 12px;
      margin: 18px 0 24px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #f8fafc;
    }

    .announcement-form textarea {
      min-height: 120px;
      background: white;
    }

    .announcement-actions {
      display: flex;
      justify-content: flex-end;
    }

    .announcement-list {
      position: relative;
      display: grid;
      gap: 14px;
      margin-top: 18px;
      padding-left: 28px;
    }

    .announcement-list::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #d1d5db;
    }

    .announcement-card {
      position: relative;
      padding: 16px 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f8fafc;
    }

    .announcement-card::before {
      content: "";
      position: absolute;
      left: -27px;
      top: 18px;
      width: 16px;
      height: 16px;
      border: 4px solid white;
      border-radius: 999px;
      background: #111827;
      box-shadow: 0 0 0 2px #d1d5db;
    }

    .announcement-date {
      color: #475569;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .announcement-message {
      color: var(--text);
      font-weight: 700;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .announcement-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .storage-action-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 20px);
        padding: 22px 12px 38px;
      }

      .topbar, .detail-header {
        align-items: stretch;
        flex-direction: column;
      }

      .user-area { justify-content: flex-start; }
      .stats, .stats.four, .invoice-summary { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      .detail-actions { align-items: stretch; }
      .detail-invoice-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-page">
    <div class="login-card">
      <h1>おきらく便</h1>
      <p>管理者としてログインしてください。</p>
      <div id="loginError" class="error hidden"></div>
      <button id="loginBtn" class="primary-btn">Googleで管理者ログイン</button>
    </div>
  </div>

  <main id="appView" class="page hidden">
    <div id="appError" class="error hidden"></div>

    <header class="topbar">
      <h1 class="brand">おきらく便</h1>
      <div class="user-area">
        <span id="userEmail"></span>
        <span class="role-pill">管理者</span>
        <button id="logoutBtn" class="secondary-btn">ログアウト</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-main-tab="members">メンバー一覧</button>
      <button class="tab" data-main-tab="detail">メンバー詳細</button>
      <button class="tab" data-main-tab="invoices">請求書</button>
      <button class="tab" data-main-tab="announcements">お知らせ</button>
    </nav>

    <section id="membersSection" class="section">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">メンバー</div>
          <div id="totalMembers" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">登録済み商品</div>
          <div id="totalRegistered" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">未発送</div>
          <div id="totalUnshipped" class="stat-value">0</div>
        </div>
      </div>

      <h2>メンバー一覧</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>管理番号</th>
              <th>メンバー</th>
              <th>登録済み商品</th>
              <th>保管商品</th>
              <th>未発送</th>
              <th>発送済み</th>
              <th>最終ログイン</th>
            </tr>
          </thead>
          <tbody id="memberListBody"></tbody>
        </table>
      </div>
    </section>

    <section id="detailSection" class="section hidden">
      <div id="detailEmpty" class="empty">メンバー一覧からメンバーを選択してください。</div>

      <div id="detailContent" class="hidden">
        <div class="detail-header">
          <div>
            <h2 id="detailMemberName" class="detail-name"></h2>
            <div id="detailMemberEmail" class="member-meta"></div>
            <div id="detailMemberUid" class="member-meta"></div>
            <div id="detailManagementHeader" class="management-header"></div>
          </div>
          <div class="detail-actions">
            <input id="detailInvoiceMonthInput" class="detail-invoice-input" type="month" />
            <button class="primary-btn" onclick="createInvoiceForSelectedMember()">このメンバーの請求書作成</button>
            <button id="reloadBtn" class="secondary-btn">再読み込み</button>
          </div>
        </div>

        <div class="stats four">
          <div id="detailRegisteredCard" class="stat-card clickable" onclick="setDetailView('registered')">
            <div class="stat-label">登録済み商品</div>
            <div id="detailRegisteredCount" class="stat-value">0</div>
          </div>
          <div id="detailStoredCard" class="stat-card clickable" onclick="setDetailView('stored')">
            <div class="stat-label">保管商品</div>
            <div id="detailStoredCount" class="stat-value">0</div>
          </div>
          <div id="detailUnshippedCard" class="stat-card clickable" onclick="setDetailView('unshipped')">
            <div class="stat-label">未発送</div>
            <div id="detailUnshippedCount" class="stat-value">0</div>
          </div>
          <div id="detailShippedCard" class="stat-card clickable" onclick="setDetailView('shipped')">
            <div class="stat-label">発送済み</div>
            <div id="detailShippedCount" class="stat-value">0</div>
          </div>
        </div>

        <div id="detailTableArea" class="section"></div>
      </div>
    </section>

    <section id="invoicesSection" class="section hidden">
      <h2>請求書</h2>

      <div class="invoice-actions">
        <label>
          対象月
          <input id="invoiceMonthInput" type="month" />
        </label>
        <button class="primary-btn" onclick="createInvoicesForMonth()">全メンバーの請求書作成</button>
      </div>

      <div class="invoice-summary">
        <div class="invoice-summary-item">
          メンバー
          <strong id="invoiceMemberCount">0</strong>
        </div>
        <div class="invoice-summary-item">
          請求書
          <strong id="invoiceCount">0</strong>
        </div>
        <div class="invoice-summary-item">
          検品料金
          <strong id="invoiceInspectionTotal">0</strong>
        </div>
        <div class="invoice-summary-item">
          合計
          <strong id="invoiceGrandTotal">0</strong>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>対象月</th>
              <th>管理番号</th>
              <th>メンバー</th>
              <th>件数</th>
              <th>検品料金</th>
              <th>発送料金</th>
              <th>合計</th>
              <th>明細</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="invoiceListBody"></tbody>
        </table>
      </div>
    </section>

    <section id="announcementsSection" class="section hidden">
      <h2>お知らせ</h2>

      <div class="announcement-form">
        <label>
          アナウンス内容
          <textarea id="announcementInput" placeholder="会員全員に知らせる内容を入力してください"></textarea>
        </label>
        <div class="announcement-actions">
          <button class="primary-btn" onclick="publishAnnouncement()">発信</button>
        </div>
      </div>

      <h2>アナウンス欄</h2>
      <div id="announcementList" class="announcement-list"></div>
    </section>
  </main>

  <div id="infoModalBackdrop" class="modal-backdrop">
    <div class="modal wide">
      <div class="modal-head">
        <h2 id="infoModalTitle">商品情報</h2>
        <button class="secondary-btn" onclick="closeInfoModal()">閉じる</button>
      </div>
      <div id="infoModalBody"></div>
    </div>
  </div>

  <div id="editModalBackdrop" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="editModalTitle">編集</h2>
        <button id="editModalCloseBtn" class="secondary-btn" type="button">閉じる</button>
      </div>
      <form id="editForm"></form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getDatabase,
      ref,
      get,
      update,
      remove,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    const firebaseConfig = {

    function getProductGroups(member) {
      const registered = [];
      const stored = [];
      const unshipped = [];
      const shipped = [];

      member.products.forEach((product) => {
        const hasShippingRequest = hasValue(product.shippingRequest);
        const hasShootingDate = hasValue(product.shootingDate);
        const isShipped = product.shippingStatus === "shipped";

        if (isShipped) {
          shipped.push(product);
        } else if (hasShippingRequest) {
          unshipped.push(product);
        } else if (hasShootingDate) {
          stored.push(product);
        } else {
          registered.push(product);
        }
      });

      const sorter = (a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true });

      return {
        registered: registered.sort(sorter),
        stored: stored.sort(sorter),
        unshipped: unshipped.sort(sorter),
        shipped: shipped.sort(sorter)
      };
    }

    function getDetailProducts(member) {
      return getProductGroups(member)[detailView] || [];

    function shippingBadge(value) {
      const key = shippingKey(value);
      const textMap = {
        domestic: "国内発送",
        international: "海外発送",
        return: "返品依頼",
        speedpak: "SpeedPAK",
        none: "なし"
      };

      return `<span class="ship-badge ${key}">${textMap[key] || "なし"}</span>`;
    }

    function shippingKey(value) {
      const text = String(value || "").trim();

      if (text === "domestic" || text === "国内発送") return "domestic";
      if (text === "international" || text === "海外発送") return "international";
      if (text === "return" || text === "返品依頼") return "return";
      if (text === "speedpak" || text === "SpeedPAK") return "speedpak";

      return "none";

      hideError(appError);

      const product = findProduct(uid, productId);

    async function createDriveFolderWithGas(driveBaseUrl, folderName) {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("ここに")) {
        throw new Error("GAS_WEB_APP_URLが未設定です。");
      }

      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
          token: GAS_WEB_APP_TOKEN,
          driveBaseUrl,
          folderName
        })
      });

      const result = await response.json();

      if (!result.ok) {
        throw new Error(result.error || "Driveフォルダ作成に失敗しました。");
      }

      if (!result.folderUrl) {
        throw new Error("DriveフォルダURLが返却されませんでした。");
      }

      return result;
    }

async function createInvoiceForMember(member, month, showNoTargetError = true) {
  const items = buildInvoiceItems(member, month);

  if (!items.length) {
    if (showNoTargetError) {
      showError(appError, "対象月に請求対象の商品がありません。");
    }
    return false;
  }

  const totalInspectionFee = items.reduce((sum, item) => sum + feeValue(item.inspectionFee), 0);
  const totalShippingFee = items.reduce((sum, item) => sum + feeValue(item.shippingFee), 0);
  const grandTotal = items.reduce((sum, item) => sum + feeValue(item.total), 0);

  const itemMap = {};
  items.forEach((item) => {
    itemMap[item.productId] = cleanForFirebase(item);
  });

  const invoiceData = cleanForFirebase({
    uid: member.uid,
    memberName: member.name || "",
    email: member.email || "",
    managementNumber: member.managementNumber || "",
    month,
    status: "created",
    createdAt: Date.now(),
    createdBy: currentUser ? currentUser.uid : "",
    createdByEmail: currentUser ? currentUser.email || "" : "",
    totalInspectionFee,
    totalShippingFee,
    grandTotal,
    items: itemMap
  });

  await set(ref(db, `invoices/${member.uid}/${month}`), invoiceData);

  return true;
}

function cleanForFirebase(value) {
  if (typeof value === "number" && Number.isNaN(value)) return 0;

  if (value === undefined) return "";

  if (value === null) return null;

  if (Array.isArray(value)) {
    return value.map((item) => cleanForFirebase(item));
  }

  if (typeof value === "object") {
    const cleaned = {};

    Object.entries(value).forEach(([key, item]) => {
      cleaned[key] = cleanForFirebase(item);
    });

    return cleaned;
  }

  return value;
}

function feeValue(value) {
  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  const cleaned = String(value ?? "").replace(/[^\d.-]/g, "");
  const parsed = Number(cleaned);
  return Number.isFinite(parsed) ? parsed : 0;
}

function buildInvoiceItems(member, month) {
  return member.products
    .map((product) => {
      const inspectionInMonth = matchesMonth(product.shootingDate, month);
      const shippingInMonth = matchesMonth(product.shippedDate, month);

      if (!inspectionInMonth && !shippingInMonth) return null;

      const inspectionFee = inspectionInMonth ? inspectionFeeFor(product.workRequest) : 0;
      const shippingFee = shippingInMonth ? numberValue(product.shippingPrice) : 0;

      return {
        productId: product.id,
        name: product.name || "",
        numbering: product.numbering || "",
        workRequest: product.workRequest || "",
        inspectionDate: inspectionInMonth ? product.shootingDate || "" : "-",
        inspectionFee: inspectionInMonth ? inspectionFee : "-",
        shippingDate: shippingInMonth ? product.shippedDate || "" : "-",
        shippingFee: shippingInMonth ? shippingFee : "-",
        total: inspectionFee + shippingFee
      };
    })
    .filter(Boolean)
    .sort((a, b) => String(a.numbering || "").localeCompare(String(b.numbering || ""), "ja", { numeric: true }));
}

    function inspectionFeeFor(workRequest) {
      return Number(INSPECTION_PRICE_MAP[workRequest] ?? 0);
    }

    function numberValue(value) {
      if (typeof value === "number") return value;
      const cleaned = String(value || "").replace(/[^\d.-]/g, "");
      return Number(cleaned || 0);
    }

    function downloadInvoiceCsv(uid, month) {
      const invoice = invoicesCache?.[uid]?.[month];
      if (!invoice) return;

      const items = Object.values(invoice.items || {});
      const rows = [
        ["請求月", invoice.month || ""],
        ["メンバー", invoice.memberName || ""],
        ["管理番号", invoice.managementNumber || ""],
        [],
        ["商品名", "ナンバリング", "作業内容", "検品日", "検品料金", "発送日", "発送料金", "合計"],
        ...items.map((item) => [
          item.name || "",
          item.numbering || "",
          item.workRequest || "",
          item.inspectionDate || "-",
          item.inspectionFee ?? "-",
          item.shippingDate || "-",
          item.shippingFee ?? "-",
          item.total || 0
        ]),
        [],
        ["検品料金合計", invoice.totalInspectionFee || 0],
        ["発送料金合計", invoice.totalShippingFee || 0],
        ["合計", invoice.grandTotal || 0]
      ];

      downloadCsv(rows, `${invoice.memberName || uid}_${month}_ご利用明細.csv`);
    }

    function matchesMonth(dateValue, selectedMonth) {
      if (!selectedMonth) return true;
      if (!hasValue(dateValue)) return false;
      return String(dateValue).startsWith(selectedMonth);
    }

    function downloadCsv(rows, filename) {
      const csv = rows.map((row) => row.map(csvCell).join(",")).join("\r\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value ?? "").replaceAll('"', '""')}"`;
    }

      if (status === "error") return `作成失敗 ${product.folderError ? "：" + product.folderError : ""}`;

    function makeFolderName(numbering, name) {
      return sanitizeName(`${numbering || ""}_${name || ""}`);
    }

    function sanitizeName(value) {
      return String(value || "")
        .trim()
        .replace(/[\/\\<>:"|?*\u0000-\u001F]/g, "_")
        .replace(/\s{2,}/g, " ")
        .slice(0, 180);

    function formatShippingInfo(value) {
      if (!hasValue(value)) return "-";

      if (typeof value !== "object") {
        return escapeHtml(value);
      }

      const labelMap = {
        name: "宛名",
        senderName: "宛名",
        recipientName: "宛名",
        postalCode: "郵便番号",
        zip: "郵便番号",
        prefecture: "都道府県",
        address: "住所",
        address1: "住所",
        address2: "建物名など",
        building: "建物名など",
        company: "会社名など",
        phone: "電話番号",
        phoneNumber: "電話番号",
        deliveryDate: "配送希望日",
        deliveryTime: "配送希望時間",
        note: "備考"
      };

      const rows = Object.entries(value)
        .filter(([key, item]) => key !== "updatedAt" && hasValue(item))
        .map(([key, item]) => {
          const label = labelMap[key] || key;
          return `${escapeHtml(label)}：${escapeHtml(item)}`;
        });

      return rows.length ? rows.join("<br>") : "-";
    }

    function linkOrDash(value) {
      if (!hasValue(value)) return "-";
      const safe = escapeAttr(value);
      return `<a class="link-cell" href="${safe}" target="_blank" rel="noopener noreferrer">${escapeHtml(value)}</a>`;
    }

    function storageLocationControl(uid, productId, product) {
      const storageUrl = product.storageLocation || product.folderUrl || "";
      const button = `<button class="mini-btn yellow" onclick="createStorageFolderFromInfo('${escapeAttr(uid)}','${escapeAttr(productId)}')">作成</button>`;

      if (!hasValue(storageUrl)) {
        return `<div class="storage-action-row">${button}</div>`;
      }

      return `<div class="storage-action-row">${linkOrDash(storageUrl)}${button}</div>`;
    }

    function hasValue(value) {
      return value !== undefined && value !== null && String(value).trim() !== "";
    }

    function showError(element, message) {
      element.textContent = message;
      element.classList.remove("hidden");
    }

    function hideError(element) {
      element.textContent = "";
      element.classList.add("hidden");
    }

    function todayString() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDateTime(value) {
      if (!value) return "-";
      const date = new Date(Number(value));
      if (Number.isNaN(date.getTime())) return "-";
      return date.toLocaleString("ja-JP", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function formatDateOnly(value) {
      if (!value) return "-";
      const date = new Date(Number(value));
      if (Number.isNaN(date.getTime())) return "-";
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}/${month}/${day}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
